    count. Hover for the typical margin.</p>
    <div class="filters"><label>Posts<select id="f-hours-all">
      <option value=""${all ? "" : " selected"}>News only</option>
      <option value="1"${all ? " selected" : ""}>All tweets</option></select></label></div>
    <div class="type-wrap"><div class="hours">
      <div class="hlab">RW posts</div>${hours.map(h => bar(rwN(h), "RotoWire", "up")).join("")}
      <div></div><div class="hzero"></div>
      <div class="hlab">UD posts</div>${hours.map(h => bar(udN(h), "Underdog", "down")).join("")}
      <div class="hlab">RW first</div>${hours.map(cell).join("")}
      <div></div>${hours.map(h => `<div class="htick">${hourLabel(h.hour)}</div>`).join("")}
    </div></div>
    <div class="type-legend"><span class="key-sw rw"></span><span>RotoWire ${what}posts</span>
      <span class="key-sw ud"></span><span>Underdog ${what}posts</span>
      <span class="hatch-key"></span><span>Fewer than ${TYPE_MIN_STORIES} stories</span></div>
    <details class="hours-table"><summary>Show as a table</summary>
      <table><thead><tr><th data-nosort>Hour</th><th data-nosort style="text-align:right">RW news posts</th>
      <th data-nosort style="text-align:right">UD news posts</th><th data-nosort style="text-align:right">RW all posts</th>
      <th data-nosort style="text-align:right" title="Of RW all posts: 'More Details' replies linking the full write-up">RW detail links</th>
      <th data-nosort style="text-align:right">UD all posts</th><th data-nosort style="text-align:right">Matched</th>
      <th data-nosort style="text-align:right">RW first</th><th data-nosort style="text-align:right">Typical margin</th>
      </tr></thead><tbody>${rows}</tbody></table></details>`;
  document.getElementById("f-hours-all").onchange = e => { state.hoursAll = !!e.target.value; renderHours(); };
}

// ---- by staff: who held each desk role when the news broke ----
// Clock times (no date) in US Central, like every other time on the dashboard.
const _ctTime = new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", hour: "numeric", minute: "2-digit" });
const hhLabel = hh => { const h = +hh.slice(0, 2); return `${(h + 11) % 12 + 1}${h < 12 ? "a" : "p"}`; };
const STAFF_MIN = 10;   // fewer matched stories than this: flagged as a small sample
// Orange when Underdog was typically first, teal when RotoWire was; stronger = bigger margin.
function marginBg(sec, n) {
  if (!n || sec == null) return "";
  const a = (0.18 + 0.55 * Math.min(1, Math.abs(sec) / 240)).toFixed(2);
  return sec < 0 ? `rgba(221,107,40,${a})` : `rgba(31,162,184,${a})`;
}

// Stories behind a strip cell or window row: when each broke (ET), who won, the first post.
function storyList(title, ids) {
  const rows = ids.map(storyById).filter(Boolean)
    .filter(s => !s.same_event_duplicate && s.review_status !== "rejected")
    .sort((a, b) => storyTime(a) - storyTime(b));
  const what = s => s.status === "matched" ? (s.rotowire_first ? "RotoWire first" : "Underdog first")
    : s.roundup ? "Roundup" : s.gap_kind === "update" ? (s.underdog ? "Step RW skipped" : "Step UD skipped")
    : s.gap_kind === "not_fantasy" ? "Not fantasy" : s.gap_kind === "not_covered" ? "Below RW's bar"
    : s.underdog ? "RotoWire missed" : "RotoWire only";
  const body = rows.map(s => {
    const lead = s.underdog && (!s.rotowire || !s.rotowire_first) ? s.underdog : s.rotowire;
    const handle = lead === s.underdog ? state.handles.underdog : state.handles.rotowire;
    return `<tr><td>${_ctTime.format(new Date(storyTime(s)))}</td><td>${esc(s.player || "?")}${borderlineChip(lead)}</td>
      <td><span class="chip">${what(s)}</span></td>
      <td class="num">${s.status === "matched" ? fmtMargin(s.time_delta_seconds) : "—"}</td>
      <td class="story">${textLink(handle, lead, lead && lead.text)}</td></tr>`;
  }).join("");
  return `<h3 style="font-size:14px;margin:18px 0 8px">${esc(title)} · ${rows.length} ${rows.length === 1 ? "story" : "stories"}</h3>
    ${rows.length ? `<div class="type-wrap"><table><thead><tr><th data-nosort>Broke (ET)</th><th data-nosort>Player</th>
      <th data-nosort>Result</th><th data-nosort style="text-align:right">Margin</th><th data-nosort>First post</th></tr></thead>
      <tbody>${body}</tbody></table></div>` : `<div class="empty">No stories.</div>`}`;
}

function renderStaff() {
  const st = state.agg.staffing || {};
  const days = st.days || [];
  document.getElementById("tab-staff").classList.toggle("hidden", !days.length);
  const el = document.getElementById("view-staff");
  if (!days.length) { el.innerHTML = ""; return; }

  const ALLDAYS = "__all";
  const dayKey = days.some(d => d.date === state.staffDay) || (state.staffDay === ALLDAYS && days.length > 1)
    ? state.staffDay : days[days.length - 1].date;
  const day = days.find(d => d.date === dayKey);
  // A day shows only the roles its sheet has (X Watcher: tweets / distributor / writers;
  // the older Breaking News Schedule: NFL desk / NFL News). All days lists every role.
  const roles = (day && day.roles) || st.roles || {};
  const role = roles[state.staffRole] ? state.staffRole : Object.keys(roles)[0];
  const total = day ? day.total : st.all.total;
  const people = (day ? day.people : st.all.people)[role] || [];
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US",
    { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });

  const kpi = (label, value, small) => `<div class="kpi"><div class="label">${label}</div>
    <div class="value">${value}${small ? ` <small>${small}</small>` : ""}</div></div>`;
  const missed = t => `${t.underdog_only}${t.underdog_only_borderline ? ` <small>(${t.underdog_only_borderline} borderline)</small>` : ""}`;
  const kpis = `<div class="kpis">
    ${kpi("Matched stories", total.matched, total.rotowire_posts != null ? `of ${total.rotowire_posts} RW news posts` : "")}
    ${kpi("RotoWire first", fmtPct(total.rotowire_first_rate), `${total.rotowire_first}/${total.matched}`)}
    ${kpi("Typical margin", fmtMargin(total.median_lead_seconds))}
    ${kpi("RotoWire missed", missed(total))}
    ${kpi("Steps skipped", total.underdog_update_only ?? 0, "Underdog-only steps")}</div>`;

  // Shift strip: one row per role (spans = who held it), then each hour's result.
  let strip = "";
  if (day) {
    const slots = day.slots, n = slots.length;
    const spans = r => {
      const out = []; let cur = null, from = 0;
      slots.forEach((s, i) => {
        const k = (s.roles[r] || []).join(" / ");
        if (k !== cur) { if (cur !== null) out.push([from, i, cur]); cur = k; from = i; }
      });
      out.push([from, n, cur]);
      return out.map(([a, b, k]) => {
        const hand = slots.slice(a, b).flatMap(s => s.handoffs[r] || []);
        const tip = `${k} · ${hhLabel(slots[a].start)}–${hhLabel(slots[b - 1].start)}${hand.length ? " · " + hand.join(", ") : ""}`;
        return `<div class="s-span" style="grid-column:${a + 2}/${b + 2}" title="${esc(tip)}">${esc(k)}</div>`;
      }).join("");
    };
    const cells = slots.map((s, i) => {
      const posts = s.rotowire_posts != null ? ` · news posts RW ${s.rotowire_posts} (+${s.rotowire_links ?? 0} detail links), UD ${s.underdog_posts}` : "";
      const tip = `${hhLabel(s.start)} CT${posts}: ${s.matched} matched, RotoWire first on ${s.rotowire_first}` +
        `${s.matched ? ", typical " + fmtMargin(s.median_lead_seconds) : ""}; ${s.underdog_only} missed` +
        `${s.underdog_only_borderline ? ` (${s.underdog_only_borderline} borderline)` : ""}; ${s.underdog_update_only} steps skipped`;
      const miss = s.underdog_only ? `${s.underdog_only} missed` : "";
      return `<button type="button" class="s-cell${state.staffHour === s.start ? " on" : ""}" data-h="${s.start}"
        style="${marginBg(s.median_lead_seconds, s.matched) ? "background:" + marginBg(s.median_lead_seconds, s.matched) : ""}"
        title="${esc(tip)}" aria-label="${esc(tip)}"><b>${s.matched || ""}</b><span>${miss}</span></button>`;
    }).join("");
    strip = `<div class="type-wrap"><div class="strip" style="grid-template-columns:120px repeat(${n}, minmax(34px, 1fr))">
      ${Object.entries(roles).map(([r, l]) => `<div class="s-lab">${esc(l)}</div>${spans(r)}`).join("")}
      <div class="s-lab">Result</div>${cells}
      <div></div>${slots.map(s => `<div class="s-tick">${hhLabel(s.start)}</div>`).join("")}
    </div></div>
    <p class="type-note">Each hour: the number is matched stories, colour is the typical margin (orange: Underdog
      first, teal: RotoWire first, stronger = bigger gap), "missed" is news only Underdog posted. Click an hour
      to list its stories. Hours are Central time.</p>`;
  }

  // Stories behind the selected hour.
  const slot = day && day.slots.find(s => s.start === state.staffHour);
  const detail = slot ? storyList(`${hhLabel(slot.start)} CT`, slot.story_ids) : "";

  const vol = people.some(p => p.rotowire_posts != null);
  const prow = p => `<tr><td>${esc(p.name)}${p.matched < STAFF_MIN ? `<span class="small-n" title="Fewer than ${STAFF_MIN} matched stories: too few to judge">small sample</span>` : ""}</td>
    <td class="num">${p.hours.toFixed(1)}</td>
    ${vol ? `<td class="num">${p.rotowire_posts ?? 0}</td><td class="num">${p.rotowire_links ?? 0}</td><td class="num">${p.underdog_posts ?? 0}</td>` : ""}
    <td class="num">${p.matched}</td>
    <td class="num">${p.rotowire_first} <span class="bl">${fmtPct(p.rotowire_first_rate)}</span></td>
    <td class="num">${fmtMargin(p.median_lead_seconds)}</td>
    <td class="num">${p.underdog_only}${p.underdog_only_borderline ? ` <span class="bl">(${p.underdog_only_borderline} borderline)</span>` : ""}</td>
    <td class="num">${p.underdog_update_only ?? 0}</td><td class="num">${p.rotowire_only}</td></tr>`;
  const table = `<div class="type-wrap"><table><thead><tr><th data-nosort>Person</th>
    <th data-nosort style="text-align:right">Hours on</th>
    ${vol ? `<th data-nosort style="text-align:right" title="News posts RotoWire made while this person was on (detail links and other non-news left out)">RW news posts</th>
    <th data-nosort style="text-align:right" title="RotoWire's 'More Details' replies linking the full write-up on the site. Counted as tweets, never as news">RW detail links</th>
    <th data-nosort style="text-align:right" title="News posts Underdog made while this person was on">UD news posts</th>` : ""}
    <th data-nosort style="text-align:right">Matched</th>
    <th data-nosort style="text-align:right">RotoWire first</th>
    <th data-nosort style="text-align:right" title="Median of the matched stories; UD +1:40 means Underdog was typically 1:40 faster">Typical margin</th>
    <th data-nosort style="text-align:right" title="News only Underdog posted. Borderline = highlight clips and in-game notes the classifier would otherwise drop">RotoWire missed</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted (e.g. headed to the locker room)">Steps skipped</th>
    <th data-nosort style="text-align:right">RotoWire exclusive</th></tr></thead>
    <tbody>${[...people].sort((a, b) => b.hours - a.hours).map(prow).join("")}</tbody></table></div>`;

  el.innerHTML = `<p class="type-note">How RotoWire did against Underdog by who held each desk role when the news
      broke (the first post on either feed). A shared hour credits everyone on it. Only hours on the schedule count.</p>
    <div class="filters">
      <label>Day<select id="f-staff-day">${[...days].reverse().map(d =>
        `<option value="${d.date}"${d.date === dayKey ? " selected" : ""}>${fmtDay(d.date)}</option>`).join("")}
        ${days.length > 1 ? `<option value="${ALLDAYS}"${dayKey === ALLDAYS ? " selected" : ""}>All scheduled days</option>` : ""}</select></label>
    </div>
    ${kpis}${strip}${detail}
    <div class="filters" style="margin-top:20px"><label>Role<div class="seg-chips" role="group" aria-label="Role">
      ${Object.entries(roles).map(([r, l]) => `<button type="button" data-r="${r}" class="${r === role ? "on" : ""}" aria-pressed="${r === role}">${esc(l)}</button>`).join("")}
    </div></label></div>
    ${table}`;

  document.getElementById("f-staff-day").onchange = e => { state.staffDay = e.target.value; state.staffHour = null; renderStaff(); };
  el.querySelectorAll(".seg-chips button").forEach(b => b.onclick = () => { state.staffRole = b.dataset.r; renderStaff(); });
  el.querySelectorAll(".s-cell").forEach(c => c.onclick = () => {
    state.staffHour = state.staffHour === c.dataset.h ? null : c.dataset.h; renderStaff();
  });
}

// ---- during games: kickoff - 2h to kickoff + 3h (+4h primetime), from ESPN kickoffs ----
function renderGames() {
  const gw = state.agg.game_windows || {};
  const wins = gw.windows || [];
  document.getElementById("tab-games").classList.toggle("hidden", !wins.length);
  const el = document.getElementById("view-games");
  if (!wins.length) { el.innerHTML = ""; return; }

  const missed = t => `${t.underdog_only}`;
  const cmp = (label, t, hrs) => `<tr><td>${label}</td><td class="num">${hrs}</td><td class="num">${t.matched}</td>
    <td class="num">${t.rotowire_first} <span class="bl">${fmtPct(t.rotowire_first_rate)}</span></td>
    <td class="num">${fmtMargin(t.median_lead_seconds)}</td><td class="num">${missed(t)}</td>
    <td class="num">${t.underdog_update_only ?? 0}</td><td class="num">${t.rotowire_only}</td></tr>`;
  const head = `<th data-nosort style="text-align:right">Matched</th><th data-nosort style="text-align:right">RotoWire first</th>
    <th data-nosort style="text-align:right">Typical margin</th>
    <th data-nosort style="text-align:right" title="News only Underdog posted">RotoWire missed</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted">Steps skipped</th>
    <th data-nosort style="text-align:right">RotoWire exclusive</th>`;
  const compare = `<div class="type-wrap"><table><thead><tr><th data-nosort></th><th data-nosort style="text-align:right">Hours</th>${head}</tr></thead>
    <tbody>${cmp("During games", gw.inside, gw.inside_hours)}${cmp("Rest of the week", gw.outside, "—")}</tbody></table></div>`;

  // Clock hours (ET) across every game window so far.
  const hrs = gw.hours || [];
  const lab = h => `${(h + 11) % 12 + 1}${h < 12 ? "a" : "p"}`;
  const strip = hrs.length ? `<h3 style="font-size:14px;margin:22px 0 8px">By hour, during games</h3>
    <div class="type-wrap"><div class="strip" style="grid-template-columns:120px repeat(${hrs.length}, minmax(40px, 1fr))">
      <div class="s-lab">Result</div>${hrs.map(h => {
        const tip = `${lab(h.hour)} CT in game windows: ${h.matched} matched, RotoWire first on ${h.rotowire_first}` +
          `${h.matched ? ", typical " + fmtMargin(h.median_lead_seconds) : ""}; ${h.underdog_only} missed; ${h.underdog_update_only} steps skipped`;
        const bg = marginBg(h.median_lead_seconds, h.matched);
        return `<div class="s-cell" style="cursor:default${bg ? ";background:" + bg : ""}" title="${esc(tip)}" aria-label="${esc(tip)}">
          <b>${h.matched || ""}</b><span>${h.matched ? fmtPct(h.rotowire_first / h.matched) + " RW" : ""}</span></div>`;
      }).join("")}
      <div></div>${hrs.map(h => `<div class="s-tick">${lab(h.hour)}</div>`).join("")}
    </div></div>
    <p class="type-note">Number is matched stories that broke in that hour during a game window, with RotoWire's
      win rate under it; colour is the typical margin (orange: Underdog first, teal: RotoWire first). Hover for misses.</p>` : "";

  const fmtCT = iso => _ctTime.format(new Date(iso));
  const rows = [...wins].reverse().map(w => {
    const names = w.games.map(g => g.name).join(", ");
    return `<tr class="gw-row${state.gameWin === w.start ? " on" : ""}" data-w="${w.start}" style="cursor:pointer">
      <td>${esc(w.label)}</td><td>${fmtCT(w.start)} – ${fmtCT(w.end)}</td>
      <td title="${esc(names)}">${w.games.length === 1 ? esc(names) : `${w.games.length} games`}</td>
      <td class="num">${w.matched}</td><td class="num">${w.rotowire_first} <span class="bl">${fmtPct(w.rotowire_first_rate)}</span></td>
      <td class="num">${fmtMargin(w.median_lead_seconds)}</td><td class="num">${missed(w)}</td>
      <td class="num">${w.underdog_update_only ?? 0}</td><td class="num">${w.rotowire_only}</td></tr>`;
  }).join("");
  const sel = wins.find(w => w.start === state.gameWin);
  const detail = sel ? storyList(`${sel.label}, ${fmtCT(sel.start)} – ${fmtCT(sel.end)} CT`, sel.story_ids) : "";

  el.innerHTML = `<p class="type-note">How RotoWire compares while NFL games are on. A game's window runs from 2 hours
      before kickoff (injury reports land about 90 minutes before), rounded down to the hour, to 3 hours after
      (4 hours for a 6pm CT or later kickoff), rounded up; overlapping windows merge. Kickoffs come from ESPN, so
      international and other one-off games are included. Times are Central.</p>
    ${compare}${strip}
    <h3 style="font-size:14px;margin:22px 0 8px">Game windows</h3>
    <div class="type-wrap"><table><thead><tr><th data-nosort>Day</th><th data-nosort>Window (ET)</th><th data-nosort>Games</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="type-note">Click a window to list its stories.</p>${detail}`;

  el.querySelectorAll(".gw-row").forEach(r => r.onclick = () => {
    state.gameWin = state.gameWin === r.dataset.w ? null : r.dataset.w; renderGames();
  });
}

// ---- practice reports: pre-practice (seen / will practice) vs post-practice (official report) ----
function renderPractice() {
  const pr = state.agg.practice;
  document.getElementById("tab-practice").classList.toggle("hidden", !pr);
  const el = document.getElementById("view-practice");
  if (!pr) { el.innerHTML = ""; return; }
  const LABEL = { pre: "Pre-practice", post: "Post-practice" };
  const NOTE = { pre: "will / won't practice, seen or not seen, worked on the side, media-window notes",
                 post: "the session's result, usually the official report: full, limited, DNP" };
  const since = new Date(pr.since + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const row = ph => {
    const p = pr.phases[ph];
    return `<tr><td>${LABEL[ph]}<div class="bl">${NOTE[ph]}</div></td><td class="num">${p.days}</td>
      <td class="num">${p.rotowire_posted} <span class="bl">${fmtPct(p.rotowire_posted_rate)}</span></td>
      <td class="num">${p.underdog_posted} <span class="bl">${fmtPct(p.underdog_posted_rate)}</span></td>
      <td class="num">${p.rotowire_only}</td><td class="num">${p.underdog_only}</td>
      <td class="num">${p.both ? `${p.rotowire_first} / ${p.ties} / ${p.underdog_first}` : "—"}</td>
      <td class="num">${fmtMargin(p.median_lead_seconds)}</td></tr>`;
  };
  const cell = (side, handle) => side
    ? `<a href="${tweetUrl(handle, side.tweet_id)}" target="_blank" rel="noopener" title="${esc(side.text)}">${_ctTime.format(new Date(side.created_at))}</a>` : `<span class="bl">—</span>`;
  const verdict = r => {
    const out = [];
    ["pre", "post"].forEach(ph => {
      const h = r[ph];
      if (h.rotowire && !h.underdog) out.push(`UD skipped ${ph}`);
      if (h.underdog && !h.rotowire) out.push(`RW skipped ${ph}`);
    });
    return out.map(t => `<span class="chip">${t}</span>`).join(" ");
  };
  const fmtD = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  const rows = [...pr.recent].reverse().map(r => `<tr><td>${fmtD(r.date)}</td><td>${esc(r.player || r.player_key)}</td>
    <td class="num">${cell(r.pre.rotowire, state.handles.rotowire)}</td><td class="num">${cell(r.pre.underdog, state.handles.underdog)}</td>
    <td class="num">${cell(r.post.rotowire, state.handles.rotowire)}</td><td class="num">${cell(r.post.underdog, state.handles.underdog)}</td>
    <td>${verdict(r)}</td></tr>`).join("");
  el.innerHTML = `<p class="type-note">Each practice day has two updates fantasy players want: before or during
      practice (is he out there?) and after it (how much did he do?). RotoWire tries to post both. This tracks
      them separately, per player per practice day, so a day one side skipped shows up as exactly that.
      Last ${pr.days} days (since ${since}); a tie is within ${Math.round(pr.tie_seconds / 60)} minute. Times are Central.</p>
    <div class="type-wrap"><table><thead><tr><th data-nosort>Update</th><th data-nosort style="text-align:right">Player-days</th>
      <th data-nosort style="text-align:right">RotoWire posted</th><th data-nosort style="text-align:right">Underdog posted</th>
      <th data-nosort style="text-align:right">Only RotoWire</th><th data-nosort style="text-align:right">Only Underdog</th>
      <th data-nosort style="text-align:right" title="When both posted it: RotoWire first / tie / Underdog first">Both: RW / tie / UD first</th>
      <th data-nosort style="text-align:right">Typical margin</th></tr></thead>
      <tbody>${row("pre")}${row("post")}</tbody></table></div>
    <h3 style="font-size:14px;margin:22px 0 8px">Practice days, last two weeks</h3>
    <div class="type-wrap"><table><thead><tr><th data-nosort>Day</th><th data-nosort>Player</th>
      <th data-nosort style="text-align:right">RW pre</th><th data-nosort style="text-align:right">UD pre</th>
      <th data-nosort style="text-align:right">RW post</th><th data-nosort style="text-align:right">UD post</th>
      <th data-nosort>Skipped</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="type-note">Times link to the tweet; hover for its text.</p>`;
}

// ---- focus areas: which kinds of news cost RotoWire the most (recomputed every run) ----
function tweetCard(who, handle, side, extra) {
  if (!side) return `<div class="tweet none">${who}: no post</div>`;
  const when = new Date(side.created_at).toLocaleString("en-US", { timeZone: "America/Chicago",
    month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit" });
  return `<div class="tweet"><div class="who"><b>${who}</b><span>${when} CT${extra ? " · " + extra : ""}</span></div>
    <div class="txt"><a href="${tweetUrl(handle, side.tweet_id)}" target="_blank" rel="noopener">${esc(side.text)}</a></div></div>`;
}

function focusSection(g, open) {
  const pairs = g.slowest.map(x => `<div class="pair">
      ${tweetCard("Underdog", state.handles.underdog, x.underdog, "first")}
      ${tweetCard("RotoWire", state.handles.rotowire, x.rotowire, fmtMargin(x.delta_seconds))}</div>`).join("");
  const misses = g.recent_misses.map(x => `<div class="pair">
      ${tweetCard("Underdog", state.handles.underdog, x.underdog, "")}
      <div class="tweet none">RotoWire: no post on this</div></div>`).join("");
  return `<details class="fg"${open ? " open" : ""}><summary><span class="fg-rank">#${g.rank}</span><h3>${esc(g.label)}</h3>
      <span class="fg-stats">${fmtPct(g.share_of_time_behind)} of time behind · ${g.missed} missed (${fmtPct(g.missed_rate)})
      · typical ${fmtMargin(g.median_lead_seconds)} · RotoWire first ${g.rotowire_first} of ${g.matched}</span></summary>
    <div class="fg-body">
      ${pairs ? `<h4>Races RotoWire lost by the most</h4>${pairs}` : ""}
      ${misses ? `<h4>Recent stories RotoWire missed</h4>${misses}` : ""}
    </div></details>`;
}

function renderFocus() {
  const fa = state.agg.focus || {};
  const groups = fa.groups || [];
  document.getElementById("tab-focus").classList.add("hidden");  // focus areas live in the Archive tab now
  const el = document.getElementById("view-focus");
  if (!groups.length) { el.innerHTML = ""; return; }
  const since = new Date(fa.since + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const views = v => v == null ? "—" : v >= 1000 ? `${Math.round(v / 1000)}k` : v;
  const rows = groups.map(g => `<tr><td class="num">${g.rank}</td><td>${esc(g.label)}</td>
    <td class="num">${g.matched}</td><td class="num">${fmtMargin(g.median_lead_seconds)}</td>
    <td class="num">${g.rotowire_first} <span class="bl">${fmtPct(g.matched ? g.rotowire_first / g.matched : null)}</span></td>
    <td class="num">${fmtPct(g.share_of_time_behind)}</td>
    <td class="num">${g.missed} <span class="bl">${fmtPct(g.missed_rate)}</span></td>
    <td class="num">${g.steps_skipped}</td><td class="num">${views(g.underdog_median_views)}</td></tr>`).join("");
  const section = focusSection;
  el.innerHTML = `<p class="type-note">What to work on, recomputed every run from the last ${fa.days} days (since ${since}).
      Ranked by share of RotoWire's time behind on matched stories plus share of the stories it missed, so a kind
      of news that is both slow and often missed comes first. Highlight clips, roundups and follow-ups are left out.</p>
    <div class="type-wrap"><table><thead><tr><th data-nosort>#</th><th data-nosort>Kind of news</th>
      <th data-nosort style="text-align:right">Matched</th><th data-nosort style="text-align:right">Typical margin</th>
      <th data-nosort style="text-align:right">RotoWire first</th>
      <th data-nosort style="text-align:right" title="Of all the minutes RotoWire trailed on matched stories">Share of time behind</th>
      <th data-nosort style="text-align:right" title="Real stories only Underdog posted">RotoWire missed</th>
      <th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted">Steps skipped</th>
      <th data-nosort style="text-align:right" title="Underdog's median views on this kind of news: how much fantasy players care">UD views/post</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:16px">${groups.map((g, i) => section(g, i < 3)).join("")}</div>`;
}

// ---- trend: median margin per day / week / month, zero line = even ----
// Positive = RotoWire typically first.
const TREND_GRAINS = [["day", "Day"], ["week", "Week"], ["month", "Month"]];
const TREND_CLAMP = Infinity;       // no cap: the axis fits the data, whatever its range
const TREND_MIN_ROLLING = 20;       // a trailing window with fewer stories draws dotted and faint
const TREND_MIN_DAY = 10;           // same for a single day in the Day view
function trendGrain() {
  // Always opens on Week; a Day/Month pick lasts until the page is reloaded.
  return state.trendGrain || "week";
}

// Before / after comparison under the trend chart (sports.<sport>.eras).
function erasTable() {

  return `<div class="trend-head"><div><h3>By phase</h3>

    </tr></thead><tbody>${rows}</tbody></table></div>
    <p class="type-note" style="margin-top:6px">Posts per week is RotoWire / Underdog. Before mass adoption is the offseason
      (few posts, mostly signings and the draft), so read it as direction. A phase under 2 weeks old is a small sample.</p>`;
}
const num0 = n => n == null ? "—" : n.toLocaleString("en-US");

// Time from the original source tweet to each side's post (src/source.py). The margin chart
// can't say which side moved; this one can. Lower is faster. Same Day / Week / Month grain.
function sourceChart(rows, grain, W, fmtDay, marks) {
  if (!rows.some(r => r.sourced)) return "";
  const isDay = grain === "day";
  const pre = { day: "rolling1_", week: "rolling7_", month: "rolling30_" }[grain];
  const val = (r, side) => r[`${pre}${side}_from_source`];
  const thin = () => false;   // windows stretch to enough stories (aggregate.TREND_MIN)
  const H = 200, m = { t: 14, r: 76, b: 30, l: 72 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const solid = rows.filter(r => !thin(r)).flatMap(r => [val(r, "rw"), val(r, "ud")]).filter(v => v != null);
  const all = rows.flatMap(r => [val(r, "rw"), val(r, "ud")]).filter(v => v != null);
  const hi = Math.min(3600, Math.max(120, ...(solid.length ? solid : all)) * 1.15);
  const step = [60, 120, 300, 600, 900, 1800].find(s => hi / s <= 5) || 1800;
  const y = v => m.t + (1 - Math.min(hi, Math.max(0, v)) / hi) * ih;
  const x = i => m.l + (rows.length === 1 ? iw / 2 : i / (rows.length - 1) * iw);
  const ticks = []; for (let v = 0; v <= hi; v += step) ticks.push(v);
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="t-grid"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" class="t-tick" text-anchor="end">${v ? fmtMS(v) : "0:00"}</text>`).join("");
  const paths = side => {
    let s = "", t = "";
    rows.forEach((r, i) => {
      if (!i) return;
      const a = val(rows[i - 1], side), b = val(r, side);
      if (a == null || b == null) return;
      const seg = `M${x(i - 1).toFixed(1)},${y(a).toFixed(1)}L${x(i).toFixed(1)},${y(b).toFixed(1)}`;
      if (thin(rows[i - 1]) || thin(r)) t += seg; else s += seg;
    });
    return `<path d="${t}" class="s-line thin ${side}"/><path d="${s}" class="s-line ${side}"/>`;
  };
  // Direct end labels name each line, so colour isn't the only cue.
  const lastI = rows.map((r, i) => [r, i]).filter(([r]) => val(r, "ud") != null).pop();
  let ends = "";
  if (lastI) {
    const [r, i] = lastI, yr = y(val(r, "rw")), yu = y(val(r, "ud"));
    const gap = Math.abs(yr - yu) < 14 ? (yr < yu ? -7 : 7) : 0;
    ends = `<text x="${x(i) + 10}" y="${yr + 4 + gap}" class="s-end rw">RW ${fmtMS(val(r, "rw"))}</text>
      <text x="${x(i) + 10}" y="${yu + 4 - gap}" class="s-end ud">UD ${fmtMS(val(r, "ud"))}</text>`;
  }
  const markSvg = marks.map(mk => `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${m.t}" y2="${m.t + ih}" class="t-mark"/>`).join("");
  const every = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 64)));
  const xlabels = rows.map((r, i) => i % every === 0 && rows.length - 1 - i >= every / 2 || i === rows.length - 1
    ? `<text x="${x(i)}" y="${H - 8}" class="t-tick" text-anchor="middle">${esc(r.label)}</text>` : "").join("");
  const sourced = rows.reduce((a, r) => a + (r.sourced || 0), 0);
  return `<div class="trend-head" style="margin-top:22px"><div><h3>Time from source to post</h3>
      <p>How long after the original report (the reporter or team tweet the post credits) each side posted.
      Median over the last ${{ day: "day", week: "7 days", month: "30 days" }[grain]}, reaching further back when news is thin;
      lower is faster. The margin above can't say which side moved; this can. Covers the ${sourced} matched
      stories whose source tweet was found.</p></div></div>
    <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Median minutes from source tweet to post, RotoWire and Underdog">
      ${grid}${xlabels}${markSvg}${paths("ud")}${paths("rw")}${ends}</svg></div>`;
}

// ---- by-period table under the margin chart ----
// The chart's own buckets (aggregate._trend: US Central days, season weeks, months), newest
// first, with each period's full record. A day row opens that day's stories underneath.
const ctDate = ms => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago" }).format(ms);
function periodLabel(r, grain) {
  if (grain === "day") {
    const d = new Date(r.period + "T12:00:00Z");
    return `${d.toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" })} ${esc(r.label)}`;
  }
  if (grain === "week") {
    const end = new Date(new Date(r.period + "T12:00:00Z").getTime() + 6 * 864e5).toISOString().slice(0, 10);
    return /^Week/.test(r.label) ? `${esc(r.label)} <span class="bl">${fmtWeekRange(r.period, end)}</span>` : fmtWeekRange(r.period, end);
  }
  return esc(r.label);
}
function periodTable(grain) {
  const rows = ((state.agg.trend || {})[grain] || []).filter(r => r.detail && (r.matched || r.detail.rotowire_only || r.detail.underdog_only));
  if (!rows.length || !rows[0].detail) return "";
  const noun = { day: "day", week: "week", month: "month" }[grain];
  const head = [["", "Period"], ["n", "Matched"], ["n", "RW first"], ["n", "Tie"], ["n", "UD first"],
    ["n", "Typical margin", "Median of every matched story; UD +1:30 means Underdog was typically 1:30 faster"],
    ["n", "RW wins by", "Median margin on the stories RotoWire posted first"],
    ["n", "UD wins by", "Median margin on the stories Underdog posted first"],
    ["n", "RW only", "Real stories only RotoWire posted"], ["n", "UD only", "Real stories only Underdog posted"]]
    .map(([n, l, t]) => `<th data-nosort${n ? ' style="text-align:right"' : ""}${t ? ` title="${t}"` : ""}>${l}</th>`).join("");
  const pct = (a, b) => b ? ` <span class="bl">${Math.round(a / b * 100)}%</span>` : "";
  const body = rows.slice().reverse().map(r => { const d = r.detail, open = grain === "day" && state.periodOpen === r.period;
    return `<tr class="p-row${grain === "day" ? " p-click" : ""}${open ? " on" : ""}" data-p="${r.period}"${grain === "day" ? ` tabindex="0" aria-expanded="${open}"` : ""}>
      <td>${grain === "day" ? `<span class="p-caret" aria-hidden="true">${open ? "▾" : "▸"}</span>` : ""}${periodLabel(r, grain)}</td>
      <td class="num">${r.matched}</td><td class="num">${d.rotowire_first}${pct(d.rotowire_first, r.matched)}</td>
      <td class="num">${d.ties}${pct(d.ties, r.matched)}</td><td class="num">${d.underdog_first}${pct(d.underdog_first, r.matched)}</td>
      <td class="num"><b>${fmtMargin(r.median_lead_seconds)}</b></td>
      <td class="num">${fmtMS(d.median_win_lead_seconds)}</td><td class="num">${fmtMS(d.median_win_trail_seconds)}</td>
      <td class="num">${d.rotowire_only}</td><td class="num">${d.underdog_only}</td></tr>
      ${open ? `<tr class="p-detail"><td colspan="10">${dayStories(r.period)}</td></tr>` : ""}`; }).join("");
  return `<details class="hours-table period-table"${state.periodTableOpen ? " open" : ""}>
    <summary>Show by ${noun} as a table</summary>
    ${grain === "day" ? `<p class="type-note">Central-time days, newest first. Open a day to see its stories.</p>` : ""}
    <div class="type-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></details>`;
}
// One day's stories: every matched story and every real one-sided story, in time order.
function dayStories(day) {
  const list = state.stories.filter(s => s.review_status !== "rejected" && s.review_status !== "merged"
      && !s.same_event_duplicate && storyTime(s) && ctDate(storyTime(s)) === day
      && (s.status === "matched" || (!s.roundup && !NOT_GAPS.includes(s.gap_kind))))
    .sort((a, b) => storyTime(a) - storyTime(b));
  if (!list.length) return `<div class="bl">No stories that day.</div>`;
  return `<table class="p-stories"><thead><tr><th data-nosort>Player</th><th data-nosort>Story</th><th data-nosort>RotoWire</th>
    <th data-nosort>Underdog</th><th data-nosort style="text-align:right">Margin</th><th data-nosort>First</th></tr></thead><tbody>${
    list.map(s => `<tr><td>${esc(s.player || "—")}</td><td class="story">${esc(s.canonical_label || "—")}</td>
      <td>${timeLink(state.handles.rotowire, s.rotowire)}</td><td>${timeLink(state.handles.underdog, s.underdog)}</td>
      <td class="num">${s.status === "matched" ? fmtMargin(s.time_delta_seconds) : "—"}</td><td>${winnerBadge(s)}</td></tr>`).join("")}
    </tbody></table>`;
}
function wirePeriodTable(el) {
  const det = el.querySelector(".period-table");
  if (!det) return;
  det.addEventListener("toggle", () => { state.periodTableOpen = det.open; });
  det.querySelectorAll("tr.p-click").forEach(tr => {
    const go = () => { state.periodOpen = state.periodOpen === tr.dataset.p ? null : tr.dataset.p; renderTrend(); };
    tr.onclick = go;
    tr.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}

function renderTrend() {
  const el = document.getElementById("trend");
  const trend = state.agg.trend;
  if (!trend || !(trend.week || []).length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  applyTopMode();   // visibility follows the Timing / Audience switch
  const grain = trendGrain();
  // Every view runs day by day: Day is each day's actual median, Week a trailing 7-day
  // median and Month a trailing 30-day median (pooled over the stories in the window).
  const rows = trend.day || [];
  const isDay = grain === "day";
  // The line is a trailing median (7 days / 4 weeks / 3 months, pooled over the stories) so
  // it shows the trend; each bucket's own median is a faint dot. Older JSON without the
  // rolling field falls back to the bucket median.
  // Day view plots each day's actual median; Week and Month draw a trailing median.
  // Every view is one continuous line: the last N days, stretched back until the window
  // holds enough stories (aggregate.TREND_MIN), so quiet stretches never leave a gap.
  const ROLL = { day: "day", week: "7 days", month: "30 days" }[grain];
  const MIN = { day: 10, week: 30, month: 100 }[grain];
  const rollKey = { day: "rolling1", week: "rolling7", month: "rolling30" }[grain];
  const rolling = true;
  const hasStretch = rows.some(r => r[`${rollKey}_median_seconds`] !== undefined);
  const lineVal = r => hasStretch ? r[`${rollKey}_median_seconds`]
    : isDay ? r.median_lead_seconds : r[`${rollKey}_median_seconds`];
  const thin = () => false;
  const last = rows[rows.length - 1];

  const W = Math.max(300, el.clientWidth - 28), H = 260;
  const narrow = W < 560;
  const m = { t: 14, r: narrow ? 70 : 84, b: 30, l: 72 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  // The axis fits every point on the line.
  const allVals = rows.map(lineVal).filter(v => v != null);
  const solidVals = rows.filter(r => !thin(r)).map(lineVal).filter(v => v != null);
  const vals = solidVals.length ? solidVals : allVals;
  const clampV = v => Math.max(-TREND_CLAMP, Math.min(TREND_CLAMP, v));
  let lo = Math.min(0, ...vals.map(clampV)), hi = Math.max(0, ...vals.map(clampV));
  const span = Math.max(120, hi - lo); lo -= span * 0.12;
  hi = Math.max(hi + span * 0.12, span * 0.3);   // always leave room above "even": that's the goal
  const step = [30, 60, 120, 300, 600, 900, 1800].find(s => (hi - lo) / s <= 6) || 1800;
  const y = v => m.t + (hi - Math.max(lo, Math.min(hi, clampV(v)))) / (hi - lo) * ih;
  const x = i => m.l + (rows.length === 1 ? iw / 2 : i / (rows.length - 1) * iw);

  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const tickLabel = v => v === 0 ? "even" : `${v > 0 ? "RW" : "UD"} ${fmtMS(Math.abs(v))}`;
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? "t-zero" : "t-grid"}"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" class="t-tick" text-anchor="end">${tickLabel(v)}</text>`).join("");

  const every = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 64)));
  const lastI = rows.length - 1;
  const showX = i => i % every === 0 ? !(i !== lastI && lastI - i < every / 2 && lastI % every !== 0)
                                     : i === lastI && lastI % every >= every / 2;
  const xlabels = rows.map((r, i) => showX(i)
    ? `<text x="${x(i)}" y="${H - 8}" class="t-tick" text-anchor="middle">${esc(r.label)}</text>` : "").join("");

  const pts = rows.map((r, i) => [i, lineVal(r)]).filter(([, v]) => v != null);
  // A period with no value breaks the line rather than bridging it. A segment touching a
  // thin point goes on the dotted path; the rest is the solid line.
  const P = (i, v) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  let path = "", thinPath = "";
  pts.forEach(([i, v], k) => {
    if (!k || pts[k - 1][0] !== i - 1) return;
    const [pi, pv] = pts[k - 1], seg = `M${P(pi, pv)}L${P(i, v)}`;
    if (thin(rows[pi]) || thin(rows[i])) thinPath += seg; else path += seg;
  });
  const anyThin = thinPath !== "";
  const dots = rows.map((r, i) => {
    const v = r.median_lead_seconds, low = r.matched < TYPE_MIN_STORIES;
    if (v == null) return "";   // a period with no matched story: no dot, axis keeps its place
    const clipped = v > hi || v < lo || Math.abs(v) > TREND_CLAMP;
    if (rolling) return "";   // smoothed views: the line alone (daily dots would be noise)
    const faint = thin(r);   // a day on too few stories: greyed like its dotted line
    return `<circle cx="${x(i)}" cy="${y(v)}" r="${isDay ? 3 : 4}" class="t-dot ${faint ? "faint" : ""} ${low ? "hollow" : ""} ${clipped ? "clipped" : ""}"/>`;
  }).join("");
  const lastV = last && lineVal(last);
  const endLabel = lastV != null ? `<text x="${x(rows.length - 1) + 8}" y="${y(lastV) + 4}" class="t-end">${fmtMargin(Math.round(lastV))}</text>
    <text x="${x(rows.length - 1) + 8}" y="${y(lastV) + 18}" class="t-side">${isDay ? "latest day" : (narrow ? "" : "last ") + ROLL}</text>` : "";
  // Release markers: a dashed line at the bucket each release date falls in. A release
  // before the first bucket can't be placed, so it's named in a note instead.
  const keyOf = d => d;   // rows are days in every view
  const marks = [], early = [];
  (state.agg.milestones || []).forEach(ms => {
    const k = keyOf(ms.date);
    let idx = -1;
    rows.forEach((r, i) => { if (r.period <= k) idx = i; });
    if (idx < 0) { early.push(ms); return; }
    marks.push({ ...ms, i: idx });
  });
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  // A milestone that opens an era is named after that era, so chart and table agree.
  const eras = state.agg.eras || [];
  marks.forEach(mk => { const e = eras.find(e => e.from === mk.date); if (e) mk.label = e.label; });
  // Labels sit along the bottom of the plot; ones closer than their width stack upwards.
  const markText = mk => narrow ? fmtDay(mk.date) : `${mk.label} · ${fmtDay(mk.date)}`;
  // Each label's horizontal extent (about 7px a character at 12px); a label that would touch
  // one already placed moves up a row.
  const placed = [];
  marks.forEach(mk => {
    mk.end = x(mk.i) + 6 + markText(mk).length * 7 > W - m.r;
    const w = markText(mk).length * 7, px = x(mk.i);
    const [a0, a1] = mk.end ? [px - 6 - w, px - 6] : [px + 6, px + 6 + w];
    let r = 0;
    while (placed.some(p => p.row === r && a0 < p.a1 + 8 && a1 > p.a0 - 8)) r++;
    mk.row = r; placed.push({ row: r, a0, a1 });
  });
  const markSvg = marks.map(mk => `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${m.t}" y2="${m.t + ih}" class="t-mark"/>
    <text x="${x(mk.i) + (mk.end ? -6 : 6)}" y="${m.t + ih - 8 - mk.row * 16}" class="t-mark-label halo"
      text-anchor="${mk.end ? "end" : "start"}">${esc(markText(mk))}</text>`).join("");
  // The first era (before mass adoption) is shaded, with its typical margin drawn across it.
  let band = "", bandFg = "";
  const e0 = eras[0];
  if (eras.length > 1 && e0.until && e0.median_lead_seconds != null) {
    let iEnd = -1;
    rows.forEach((r, i) => { if (r.period < e0.until) iEnd = i; });
    if (iEnd > 0) {
      const x1 = x(iEnd), yv = y(e0.median_lead_seconds);
      band = `<rect x="${m.l}" y="${m.t}" width="${x1 - m.l}" height="${ih}" class="t-band"/>`;
      bandFg = `<line x1="${m.l}" x2="${x1}" y1="${yv}" y2="${yv}" class="t-era"/>
        <text x="${(m.l + x1) / 2}" y="${yv - 7}" text-anchor="middle" class="t-band-label halo">${narrow ? "" : esc(e0.label) + ": "}typical ${fmtMargin(e0.median_lead_seconds)}</text>`;
    }
  }
  // How far the 7-day gap has stayed over the last month, stated as a ceiling with a start date.
  const r7 = rows.map(r => [r.period, r.rolling7_median_seconds]).filter(([, v]) => v != null);
  let held = "";
  if (r7.length > 30) {
    const worst = Math.min(...r7.slice(-30).map(([, v]) => v));
    if (worst < 0) {
      const T = Math.ceil(-worst / 60) * 60;
      const breach = r7.filter(([, v]) => v < -T).pop();
      const startI = breach ? r7.findIndex(([d]) => d === breach[0]) + 1 : 0;
      if (r7.length - startI > 30)
        held = ` Since ${fmtDay(r7[startI][0])} the 7-day gap has stayed under ${T / 60} minute${T === 60 ? "" : "s"}.`;
    }
  }
  const earlyNote = early.length ? ` ${early.map(e => `${esc(e.label)} (${fmtDay(e.date)})`).join(", ")}
    went live before tracking started, so everything shown is after it.` : "";
  const hits = rows.map((r, i) => {
    const w = rows.length === 1 ? iw : iw / (rows.length - 1);
    return `<rect x="${x(i) - w / 2}" y="${m.t}" width="${w}" height="${ih}" data-i="${i}" class="t-hit"/>`;
  }).join("");

  el.innerHTML = `<div class="trend-head">
      <div><h3>Typical margin over time</h3>
        <p>Median of every matched story over the last ${ROLL}, day by day, reaching further back when news is thin so each point rests on at least ${MIN} stories${state.agg.analysis_start ? `, from ${fmtDay(state.agg.analysis_start)} on` : ""}. Above the line RotoWire was typically first; below it, Underdog.${held}${earlyNote}</p></div>
      <div class="seg" role="group" aria-label="Group by">${TREND_GRAINS.map(([k, l]) =>
        `<button type="button" data-g="${k}" class="${k === grain ? "on" : ""}" aria-pressed="${k === grain}">${l}</button>`).join("")}</div>
    </div>
    <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Median margin by ${grain}; latest ${last ? esc(last.label) + " " + fmtMargin(Math.round(lastV)) : ""}">
      ${band}
      <text x="${m.l + 6}" y="${y(0) - 7}" class="t-side halo">▲ RotoWire earlier</text>
      <text x="${m.l + 6}" y="${y(0) + 15}" class="t-side halo">▼ Underdog earlier</text>
      ${grid}${xlabels}${markSvg}<path d="${thinPath}" class="t-line thin"/><path d="${path}" class="t-line"/>${bandFg}${dots}${endLabel}
      <line class="t-cross hidden" y1="${m.t}" y2="${m.t + ih}"/>${hits}</svg>
      <div class="t-tip hidden"></div></div>${periodTable(grain)}`;
  // Before / after table and source timing live in their own panel, below the KPIs.
  const erasEl = document.getElementById("eras");
  erasEl.innerHTML = erasTable() + sourceChart(rows, grain, W, fmtDay, marks);
  if (erasEl.innerHTML.trim()) delete erasEl.dataset.empty; else erasEl.dataset.empty = "1";
  applyTopMode();

  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    state.trendGrain = b.dataset.g;
    renderTrend();
  });
  wirePeriodTable(el);
  const tip = el.querySelector(".t-tip"), cross = el.querySelector(".t-cross");
  el.querySelectorAll(".t-hit").forEach(h => {
    h.onmouseenter = () => {
      const r = rows[+h.dataset.i], cx = x(+h.dataset.i);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.classList.remove("hidden");
      const span = r[`${rollKey}_days`];
      const roll = r[`${rollKey}_median_seconds`] != null
        ? `<div>Trend: ${fmtMargin(Math.round(r[`${rollKey}_median_seconds`]))} (${r[`${rollKey}_matched`]} stories${span ? ` over ${span >= 2 ? Math.round(span) + " days" : "1 day"}` : ""})</div>` : "";
      tip.innerHTML = `<b>${esc(r.label)}</b>${roll}<div>${r.median_lead_seconds == null ? "No matched stories that day"
          : `That day: ${fmtMargin(Math.round(r.median_lead_seconds))}, RotoWire first on ${r.rotowire_first} of ${r.matched}`}</div>`;
      tip.classList.remove("hidden");
      const left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), W - tip.offsetWidth);
      tip.style.left = left + "px";
    };
    h.onmouseleave = () => { tip.classList.add("hidden"); cross.classList.add("hidden"); };
  });
}

// Custom-range summary for the current sport. Reuses summarize() (same math as the
// ALL overview / src/aggregate.py::_summary) over a user-picked [from,to] window.
function renderCustom() {
  const fromT = ctDayStart(state.customFrom);
  const toT = ctDayEnd(state.customTo);
  const s = summarize(state.stories, fromT, toT);
  const ranged = state.customFrom || state.customTo;
  const rangeLabel = `${state.customFrom || "start"} → ${state.customTo || "latest"}`;
  const cards = [
    ["RotoWire-first win rate", fmtPct(s.rotowire_first_rate), s.matched ? `${s.rotowire_first}/${s.matched}` : ""],
    ["RW wins by", fmtMS(s.median_win_lead_seconds), "median, when RotoWire is first"],
    ["UD wins by", fmtMS(s.median_win_trail_seconds), "median, when Underdog is first"],
    ["Matched stories", fmtNum(s.matched), ""],

    ["Follow-ups", `${s.dups}`, "RW + UD"],

  // Win-rate graph: a single bar for the whole selected period (RotoWire-first rate over
  // the [from,to] window, from the same summary `s` as the KPI cards).
  const pct = (s.rotowire_first_rate ?? 0) * 100;

    ? `<div class="bar-row" style="grid-template-columns:minmax(120px,auto) 1fr 56px">

  const graph = `<div class="panel"><h3 style="color:var(--muted)">RotoWire-first win rate</h3>

// Feed label = which account actually posted this one-sided story.
const feedOf = s => s.status === "rotowire_only" ? "RotoWire" : "Underdog";

// One-sided stories that are not missed stories: a skipped step, or news outside RotoWire's beat.
const NOT_GAPS = ["update", "not_fantasy", "not_covered"];

// Coverage gaps for sports whose stories carry gap_kind (development matching): what each
// side missed or posted later, one NFL week at a time, so a week's misses can be reviewed.
const GAP_VIEWS = [
  { key: "ud_missed", status: "underdog_only", kind: "missed", label: "RotoWire missed",
    note: "Underdog posted it and RotoWire posted nothing about the player in the next 24 hours." },
  { key: "ud_late", status: "underdog_only", kind: "late", label: "RotoWire later",
    note: "Underdog posted it; RotoWire's next post about the player came later (it may be a different update, so both are shown)." },
  { key: "rw_missed", status: "rotowire_only", kind: "missed", label: "RotoWire exclusive",
    note: "RotoWire posted it and Underdog posted nothing about the player in the next 24 hours." },
  { key: "rw_late", status: "rotowire_only", kind: "late", label: "Underdog later",
    note: "RotoWire posted it; Underdog's next post about the player came later." },
  { key: "ud_update", status: "underdog_only", kind: "update", label: "Update RotoWire skipped",
    note: "Both accounts covered this player's story, but only Underdog posted this step of it (e.g. headed to the locker room). Shown next to RotoWire's closest post on the player. Not counted as a missed story." },
  { key: "rw_update", status: "rotowire_only", kind: "update", label: "Update Underdog skipped",
    note: "Both accounts covered this player's story, but only RotoWire posted this step of it." },
  { key: "ud_not_fantasy", status: "underdog_only", kind: "not_fantasy", label: "Not fantasy (UD)",
    note: "Underdog news about linemen, defenders and specialists. RotoWire is a fantasy account and skips these, so they are not counted as missed." },
  { key: "ud_not_covered", status: "underdog_only", kind: "not_covered", label: "Below RotoWire's bar",
    note: "Underdog news about a fantasy-position player RotoWire has never posted about (a deep backup, for example). Not counted as missed; check here for anyone who should be covered." },
];

// Signed offset of the other account's post from the lone one: "4m before" / "12m after".
function fmtOffset(sec) {
  const m = Math.round(Math.abs(sec) / 60);
  const t = m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
  return sec < 0 ? `${t} before` : `${t} after`;
}
const borderlineChip = side => side && side.borderline
  ? ` <span class="chip" title="Labelled ${esc(side.borderline.replace("_", " "))} by the classifier, counted as news anyway">borderline</span>` : "";

function fmtDelay(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m}m later` : `${Math.floor(m / 60)}h ${pad(m % 60)}m later`;
}

function renderGapsByWeek() {
  const el = document.getElementById("view-gaps");
  const gaps = state.stories.filter(s => s.gap_kind && !s.same_event_duplicate && !s.before_start
                                         && s.review_status !== "rejected" && s.season_week);
  const weeks = (state.agg.season_weeks || []).map(r => r.period)
    .filter(w => gaps.some(s => s.season_week === w));
  if (!weeks.length) { el.innerHTML = `<div class="empty">No coverage gaps.</div>`; return; }
  const week = weeks.includes(state.gapWeek) ? state.gapWeek : weeks[weeks.length - 1];
  const inWeek = gaps.filter(s => s.season_week === week);
  const view = GAP_VIEWS.find(v => v.key === state.gapView) || GAP_VIEWS[0];
  const count = v => inWeek.filter(s => s.status === v.status && s.gap_kind === v.kind).length;
  const rows = inWeek.filter(s => s.status === view.status && s.gap_kind === view.kind)
    .sort((a, b) => storyTime(a) - storyTime(b));

  const hype = ((state.agg.hype || {}).weeks || {})[week];
  const hypeLine = hype ? ` Left out as hype (not a report) this week: Underdog ${hype.underdog},
    RotoWire ${hype.rotowire}.` : "";
  const loneHandle = view.status === "underdog_only" ? state.handles.underdog : state.handles.rotowire;
  const otherHandle = view.status === "underdog_only" ? state.handles.rotowire : state.handles.underdog;

  const paired = view.kind === "late" || view.kind === "update";
  const body = rows.map(s => {
    const lone = s.underdog || s.rotowire;
    const other = view.kind === "update" ? s.other_side_near : s.other_side_later;
    const gap = !other ? "—" : view.kind === "update" ? fmtOffset(other.delay_seconds)
                                                     : fmtDelay(other.delay_seconds);
    return `<tr><td>${fmtTime(lone.created_at)}</td><td>${esc(s.player || "?")}${borderlineChip(lone)}</td>
      <td class="story">${textLink(loneHandle, lone, lone.text)}</td>
      ${paired ? `<td class="num">${gap}</td>
      <td class="story">${other ? textLink(otherHandle, other, other.text) : "—"}</td>` : ""}</tr>`;
  }).join("");
  const loneName = view.status === "underdog_only" ? "Underdog post" : "RotoWire post";
  const otherWho = view.status === "underdog_only" ? "RotoWire's" : "Underdog's";
  const otherName = view.kind === "update" ? `${otherWho} closest post on the player`
                                           : `${otherWho} later post`;

  el.innerHTML = `<p class="type-note">News only one account covered. Pick a week and a list
      to review what RotoWire missed or posted late.${hypeLine}</p>
    <div class="filters">
      <label>NFL week<select id="f-gap-week">${weeks.map(w =>
        `<option${w === week ? " selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
      <label>Show<select id="f-gap-view">${GAP_VIEWS.map(v =>
        `<option value="${v.key}"${v === view ? " selected" : ""}>${v.label} (${count(v)})</option>`).join("")}
      </select></label>
    </div>
    <p class="type-note">${view.note}</p>
    ${rows.length ? `<div class="type-wrap"><table><thead><tr><th data-nosort>Posted</th>
      <th data-nosort>Player</th><th data-nosort>${loneName}</th>
      ${paired ? `<th data-nosort style="text-align:right">Gap</th>
      <th data-nosort>${otherName}</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>`
      : `<div class="empty">None in ${esc(week)}.</div>`}`;

  document.getElementById("f-gap-week").onchange = e => { state.gapWeek = e.target.value; renderGapsByWeek(); };
  document.getElementById("f-gap-view").onchange = e => { state.gapView = e.target.value; renderGapsByWeek(); };
}

function renderGaps() {
  if (state.stories.some(s => s.gap_kind)) return renderGapsByWeek();
  const all = state.stories
    .filter(s => (s.status === "rotowire_only" || s.status === "underdog_only")
                 && !s.same_event_duplicate && !s.roundup && !NOT_GAPS.includes(s.gap_kind) && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const rw = all.filter(s => s.status === "rotowire_only").length;
  const ud = all.length - rw;

  const sel = state.gapFeed || "";  // "", "RotoWire", or "Underdog"
  const rows = sel ? all.filter(s => feedOf(s) === sel) : all;
  const filters = `<div class="filters"><label>Feed<select id="f-gap-feed">
      <option value="">both (${all.length})</option>
      <option value="RotoWire"${sel==="RotoWire"?" selected":""}>RotoWire-only (${rw})</option>
      <option value="Underdog"${sel==="Underdog"?" selected":""}>Underdog-only (${ud})</option>
    </select></label></div>`;

  const body = rows.map(s => {
    const ls = loneSide(s);
    return `<tr>
      <td>${ls ? fmtTime(ls.side.created_at) : "—"}</td>
      <td>${esc(s.player||"?")}</td>
      <td><span class="chip">${esc(s.event_class||"—")}</span></td>
      <td><span class="chip">${feedOf(s)}</span></td>
      <td class="story">${ls ? textLink(ls.handle, ls.side, ls.side.text) : "—"}</td></tr>`;
  }).join("");
  const intro = `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">
       News one feed posted and the other never matched — ${rw} RotoWire-only,
       ${ud} Underdog-only. The Story links to the tweet.</p>`;
  const table = rows.length
    ? `<table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th>
       <th data-nosort>Story</th></tr></thead><tbody>${body}</tbody></table>`
    : `<div class="empty">No coverage gaps for this feed.</div>`;
  document.getElementById("view-gaps").innerHTML = all.length
    ? intro + filters + table
    : `<div class="empty">No coverage gaps.</div>`;

  const fsel = document.getElementById("f-gap-feed");
  if (fsel) fsel.onchange = () => { state.gapFeed = fsel.value; renderGaps(); };
}

function renderDups() {
  // Same-event duplicates: posts that matched an event already counted elsewhere, so
  // they lost the strict 1-to-1 match. Shown here (not in the feed or coverage gaps).
  const dups = state.stories
    .filter(s => s.same_event_duplicate && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const body = dups.map(s => {
    const ls = loneSide(s);
    const m = s.duplicate_of && storyById(s.duplicate_of);
    const matchedSide = m && (s.status === "rotowire_only" ? m.rotowire : m.underdog);
    const matchedText = m ? (m.canonical_label || `${m.player||""} ${m.event_class||""}`.trim() || s.duplicate_of) : null;
    const matchedHandle = ls && ls.handle;  // same feed as the duplicate
    const role = dupRole(s);
    return `<tr>
      <td>${ls ? fmtTime(ls.side.created_at) : "—"}</td>
      <td>${esc(s.player||"?")}</td>
      <td><span class="chip">${esc(s.event_class||"—")}</span></td>
      <td><span class="chip">${feedOf(s)}</span></td>
      <td><span class="chip ${role.cls}">${esc(role.label)}</span></td>
      <td class="story">${ls ? textLink(ls.handle, ls.side, ls.side.text) : "—"}</td>
      <td class="story">${matchedSide ? textLink(matchedHandle, matchedSide, matchedText) : esc(matchedText || "—")}</td></tr>`;
  }).join("");
  document.getElementById("view-dups").innerHTML = dups.length
    ? `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">
         Later posts about news one account already reported: an Underdog quote-tweet update
         or a second RotoWire tweet on the same development. They don't count toward speed
         or coverage gaps; this list is for spot-checking. <b>Type</b> flags whether this post is
         the original headline or a later follow-up (RotoWire adds a story link; Underdog
         adds a video). Story and Matched-story link to their tweets.</p>
       <table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th><th data-nosort>Type</th>
       <th data-nosort>Story</th><th data-nosort>Matched story</th></tr></thead>
       <tbody>${body}</tbody></table>`
    : `<div class="empty">No follow-up posts.</div>`;
}

// ---- ALL overview ----
const medianOf = xs => {
  if (!xs.length) return null;
  const a = [...xs].sort((x,y) => x-y), m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
};
const meanOf = xs => xs.length ? xs.reduce((p,c) => p+c, 0) / xs.length : null;

// Compute a sport's headline metrics from its stories over an optional [from,to) range.
// fromT is inclusive, toT is exclusive (pass CT day boundaries via ctDayStart/ctDayEnd).
// Mirrors src/aggregate.py::_summary (active = not rejected/merged; gaps exclude dups).
function summarize(stories, fromT, toT) {
  const inRange = s => {
    const t = storyTime(s);
    if (fromT != null && t < fromT) return false;
    if (toT != null && t >= toT) return false;
    return true;
  };
  const isDup = s => !!s.same_event_duplicate;
  const active = stories.filter(s =>
    s.review_status !== "rejected" && s.review_status !== "merged" && !s.before_start && inRange(s));
  const matched = active.filter(s => s.status === "matched");
  const deltas = matched.map(s => s.time_delta_seconds).filter(v => v != null);
  const rwFirst = matched.filter(s => s.rotowire_first).length;
  // Split by who posted first: lead = RotoWire's head start (delta>0); trail = its lag.
  const leads = deltas.filter(d => d > 0);
  const trails = deltas.filter(d => d < 0).map(d => -d);
  // Unmatched roundups and update gaps (a step of a story both covered) are not missed stories.
  const count = (st, dup) => active.filter(s => s.status === st && isDup(s) === dup
                                               && (dup || (!s.roundup && !NOT_GAPS.includes(s.gap_kind)))).length;
  return {
    matched: matched.length,
    rotowire_first: rwFirst,
    rotowire_first_rate: matched.length ? rwFirst / matched.length : null,
    median_lead_seconds: medianOf(deltas),
    mean_lead_seconds: meanOf(deltas),
    avg_lead_seconds: meanOf(leads),
    avg_trail_seconds: meanOf(trails),
    median_win_lead_seconds: medianOf(leads),
    median_win_trail_seconds: medianOf(trails),
    rotowire_only: count("rotowire_only", false),
    underdog_only: count("underdog_only", false),
    dups: count("rotowire_only", true) + count("underdog_only", true),
  };
}

function renderAll() {

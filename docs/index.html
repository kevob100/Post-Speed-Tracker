<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post-Speed Tracker — RotoWire vs Underdog</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --panel2: #222b36; --line: #2d3743;
    --text: #e6edf3; --muted: #8b98a5; --green: #1fa2b8; --red: #dd6b28;  /* RotoWire teal / Underdog orange: CVD-safe pair */
    --accent: #4493f8; --chip: #2d3743;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 20px 24px 8px; max-width: 1200px; margin: 0 auto; }
  /* The title and sport pills stay pinned while the page scrolls under them. */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid transparent;
    transition: border-color .15s; }
  .topbar.stuck { border-bottom-color: var(--line); }
  .topbar .sports { margin-bottom: 8px; }
  /* Sport pills, then the page switch: Speed (the head-to-head) or Audience (RotoWire's account). */
  .top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
  .page-seg { margin: 4px 0; }
  .page-seg button { font-size: 14px; padding: 6px 14px; font-weight: 600; }
  /* Audience page: everything that compares post times steps aside. */
  body.page-audience #lead, body.page-audience #trend, body.page-audience #kpis, body.page-audience #desk, body.page-audience #edits, body.page-audience #sum, body.page-audience #road, body.page-audience #det-cols, body.page-audience #insider, body.page-audience #pagetabs, body.page-audience #credits, body.page-audience #eras,
  body.page-audience #tabs-wrap, body.page-audience [id^="view-"]:not(#view-all) { display: none !important; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }

  /* sport switcher */
  .sports { display: flex; gap: 6px; margin: 12px 0 4px; flex-wrap: wrap; }
  .sport-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .sport-btn:hover { color: var(--text); }
  .sport-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wrap { padding: 0 24px 48px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 640px) { header { padding: 12px 16px 4px; } .wrap { padding: 0 16px 40px; }
    /* keep the pinned bar short on a phone: one-line subtitle, smaller title and pills */
    header h1 { font-size: 16px; } header .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .sports { margin: 8px 0 6px; } .sport-btn { padding: 4px 12px; }
    .page-seg { margin: 0 0 6px; } .page-seg button { font-size: 12px; padding: 5px 12px; } }
  table, .kpi, .hb, svg text, .type-cell, .hcell, .strip { font-variant-numeric: tabular-nums; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 28px; font-weight: 650; margin-top: 4px; }
  .kpi .value small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .kpi .kpi-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* lead: the gap to Underdog, first era vs latest */
  .lead { margin: 14px 0 12px; }
  .lead .eyebrow { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  .lead h2 { font-size: 28px; font-weight: 650; margin: 2px 0 4px; line-height: 1.2; display: flex; flex-wrap: wrap;
    align-items: baseline; gap: 0 12px; }
  .lead h2 .from { color: var(--muted); font-weight: 500; }
  .lead h2 .arrow { color: var(--muted); font-weight: 400; }
  .lead h2 .to { color: var(--text); }
  .lead p { color: var(--muted); font-size: 14px; margin: 0; }

  /* who posted first over the last 30 days: a slim bar, labels in a key below */
  /* --n is the number of cards (set in renderKpis), so two or three cards always fill the row */
  .kpis.has-headline { grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); }
  @media (max-width: 640px) { .kpis.has-headline { grid-template-columns: minmax(0, 1fr); } }
  .headline { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 16px 12px; }
  .hl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
  .hl-head h3 { font-size: 14px; margin: 0; }
  .hl-head span { color: var(--muted); font-size: 12px; }
  .hb { display: flex; gap: 2px; height: 32px; border-radius: 6px; overflow: hidden; }
  .hb-seg { display: flex; align-items: center; padding: 0 6px; min-width: 8px; color: #fff; white-space: nowrap; overflow: hidden;
    font-size: 14px; font-weight: 650; }
  .hb-seg.rw { background: var(--green); color: #0f1419; }   /* dark ink reads better on teal */
  .hb-seg.tie { background: #4a5563; justify-content: center; }
  .hb-seg.ud { background: var(--red); justify-content: flex-end; }
  .hb-key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .hb-key b { color: var(--text); font-weight: 650; }
  .hb-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .kpi .rows { display: grid; grid-template-columns: auto auto auto; gap: 2px 10px; margin-top: 6px; align-items: baseline;
    justify-content: start; font-size: 12px; color: var(--muted); }
  .kpi .rows b { font-size: 20px; font-weight: 650; color: var(--text); }

  /* tabs */
  .tabs-wrap { position: relative; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs { display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  /* edge fades show there is more to scroll; toggled by updateTabFade() */
  .tabs-wrap::before, .tabs-wrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40px;
    pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1; }
  .tabs-wrap::before { left: 0; background: linear-gradient(to right, var(--bg), transparent); }
  .tabs-wrap::after { right: 0; background: linear-gradient(to left, var(--bg), transparent); }
  .tabs-wrap.fade-l::before, .tabs-wrap.fade-r::after { opacity: 1; }
  .tab { padding: 10px 10px; cursor: pointer; color: var(--muted); background: none; border: 0;
    border-bottom: 2px solid transparent; font: inherit; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-group { display: flex; align-items: center; padding: 0 2px 0 12px; color: var(--muted);
    font-size: 12px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .tab-group::before { content: ""; width: 1px; height: 16px; background: var(--line); margin-right: 12px; }
  .tabs > .tab-group:not(.hidden):first-of-type, #tab-focus.hidden + .tab-group { padding-left: 0; }
  #tab-focus.hidden + .tab-group::before { display: none; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: end; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  .filters input, .filters select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 14px;
  }

  #feed-wrap, #all-wrap { overflow-x: auto; }
  /* Wide tables scroll inside their tab on a phone instead of widening the page. */
  section[id^="view-"] { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td.story { white-space: normal; min-width: 200px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
  th[data-nosort] { cursor: default; }
  th.sorted::after { content: " ▾"; color: var(--accent); }
  th.sorted.asc::after { content: " ▴"; }
  tbody tr:hover { background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .has-tip { cursor: help; text-decoration: underline dotted var(--line); text-underline-offset: 3px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.rw { background: rgba(31,162,184,.15); color: var(--green); }
  .badge.ud { background: rgba(221,107,40,.15); color: var(--red); }
  .delta.pos { color: var(--green); } .delta.neg { color: var(--red); }
  .chip { background: var(--chip); color: var(--muted); padding: 1px 7px; border-radius: 999px; font-size: 12px; }
  .chip.role-followup { background: rgba(88,166,255,.15); color: var(--accent); }
  .chip.role-original { background: var(--chip); color: var(--muted); }
  .status-confirmed { color: var(--green); } .status-rejected { color: var(--red); }
  .status-merged { color: var(--accent); } .status-pending { color: var(--muted); }

  .empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .hidden { display: none; }

  /* trend bars */
  .bars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 18px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; font-size: 12px; }
  .bar-track { background: var(--panel2); border-radius: 5px; height: 16px; overflow: hidden; }
  .bar-fill { background: var(--green); height: 100%; }
  .cov { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cov h3 { font-size: 14px; margin: 0 0 6px; color: var(--muted); }
  .cov li { margin: 4px 0; }

  /* by news type grid */
  .type-note { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .type-wrap { overflow-x: auto; }
  .type-grid { border-collapse: separate; border-spacing: 2px; }
  .type-grid th, .type-grid td { border-bottom: 0; }
  .type-grid th.type-name { color: var(--text); font-weight: 400; font-size: 14px; cursor: default; padding-left: 0; }
  /* keep the type names visible while the weeks scroll sideways on a phone */
  .type-grid th:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); }
  .type-grid thead th { vertical-align: bottom; cursor: default; }
  .type-grid th.wk { text-align: center; }
  .type-grid .wk-note { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .type-grid th.season { border-left: 2px solid var(--line); }
  .type-cell { padding: 0; min-width: 104px; height: 50px; }
  .type-cell > div, .type-cell > button { display: flex; flex-direction: column; justify-content: center;
    align-items: center; width: 100%; height: 100%; border-radius: 4px; }
  .type-cell > button { border: 0; font: inherit; cursor: pointer; padding: 0; }
  .type-cell > button:hover { outline: 1px solid var(--muted); }
  .type-cell > button:focus-visible, .type-cell.picked > button { outline: 2px solid var(--accent); outline-offset: 1px; }
  .type-cell .pct { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .type-cell .meta { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  .type-cell.low > button, .hatch-key { background-image: repeating-linear-gradient(45deg, transparent 0 5px,
    rgba(255,255,255,.08) 5px 7px); }
  .type-cell.empty-cell > div { color: var(--muted); background: var(--panel); }
  .type-cell.season { border-left: 2px solid var(--line); padding-left: 4px; }
  .type-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px;
    color: var(--muted); margin-top: 12px; }
  .type-legend .ramp { display: inline-flex; gap: 2px; }
  .type-legend .ramp i { width: 26px; height: 10px; border-radius: 2px; }
  .hatch-key { display: inline-block; width: 26px; height: 10px; border-radius: 2px; margin-left: 10px;
    background-color: var(--panel2); }

  .legend-hint { margin-left: auto; }
  #type-examples { margin-top: 20px; }
  .examples-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
  .examples-head h3 { font-size: 14px; margin: 0; }
  .examples-head span { color: var(--muted); font-size: 12px; }
  table.examples td { vertical-align: top; }
  table.examples td.story { min-width: 260px; }
  .who-tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); margin-right: 6px; }
  .muted-sm { color: var(--muted); font-size: 12px; }

  /* by time of day */
  .hours { display: grid; grid-template-columns: 70px repeat(24, minmax(26px, 1fr)); gap: 2px;
    align-items: end; min-width: 760px; }
  .hlab { color: var(--muted); font-size: 12px; align-self: center; }
  .hcol { display: flex; flex-direction: column; justify-content: flex-end; }
  .hcol.down { justify-content: flex-start; }
  .hcol .hbar { width: 100%; background: var(--green); border-radius: 3px 3px 0 0; }
  .hcol.down .hbar { background: var(--red); border-radius: 0 0 3px 3px; }
  .hzero { grid-column: 2 / -1; height: 1px; background: var(--muted); opacity: .5; }
  .hcell { height: 42px; border-radius: 3px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .hcell span { font-size: 12px; opacity: .85; }
  .hcell.none { background: var(--panel); color: var(--muted); }
  .hcell.low { background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.08) 5px 7px); }
  .htick { color: var(--muted); font-size: 12px; text-align: center; }
  .key-sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .key-sw.rw { background: var(--green); } .key-sw.ud { background: var(--red); margin-left: 10px; }
  .hours-table { margin-top: 14px; }

  /* by staff: shift strip (who held each role, hour by hour) + people table */
  .seg-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg-chips button { background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .seg-chips button:hover { color: var(--text); }
  .seg-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .strip { display: grid; gap: 3px; min-width: 760px; }
  .strip .s-lab { color: var(--muted); font-size: 12px; align-self: center; padding-right: 6px; }
  .strip .s-span { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    font-size: 12px; padding: 5px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .s-cell { height: 52px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 12px; cursor: pointer; color: var(--text); font: inherit; padding: 0; }
  .strip .s-cell b { font-size: 14px; }
  .strip .s-cell span { font-size: 12px; opacity: .85; }
  .strip .s-cell.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .strip .s-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .strip .s-tick { font-size: 12px; color: var(--muted); text-align: center; }
  .small-n { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .bl { color: var(--muted); font-size: 12px; }

  /* focus areas */
  details.fg { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 10px; }
  details.fg > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap;
    align-items: baseline; gap: 4px 14px; }
  details.fg > summary::-webkit-details-marker { display: none; }
  details.fg > summary h3 { font-size: 14px; margin: 0; }
  details.fg > summary .fg-rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  details.fg > summary .fg-stats { color: var(--muted); font-size: 12px; }
  details.fg[open] > summary { border-bottom: 1px solid var(--line); }
  .fg-body { padding: 12px 14px 14px; }
  .fg-body h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; margin: 4px 0 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } }
  .tweet { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 14px; }
  .tweet .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .tweet .who b { color: var(--text); }
  .tweet .txt { white-space: pre-line; }
  .tweet.none { color: var(--muted); font-style: italic; }
  tr.gw-row.on td { background: var(--panel2); }
  .hours-table summary { color: var(--accent); cursor: pointer; font-size: 12px; margin-bottom: 8px; }
  .period-table { margin-top: 14px; }
  .period-table table { width: 100%; }
  .period-table td, .period-table th { white-space: nowrap; }
  .period-table td.story { white-space: normal; min-width: 220px; }
  tr.p-click { cursor: pointer; }
  tr.p-click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  tr.p-row.on td { background: var(--panel2); }
  .p-caret { display: inline-block; width: 14px; color: var(--muted); }
  tr.p-detail > td { background: var(--bg); padding: 4px 0 14px 14px; }
  .p-stories th, .p-stories td { font-size: 12px; }

  /* trend chart */
  .trend { padding: 14px; margin: 0 0 20px; }
  .trend-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; align-items: flex-start; }
  .trend-head h3 { font-size: 14px; margin: 0 0 2px; }
  .trend-head p { color: var(--muted); font-size: 12px; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit;
    font-size: 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .trend-plot { position: relative; margin-top: 10px; }
  .trend-plot svg { display: block; max-width: 100%; }
  .t-grid { stroke: var(--line); stroke-width: 1; }
  .t-zero { stroke: var(--muted); stroke-width: 1.5; }
  .t-tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .t-side { fill: var(--muted); font-size: 12px; }
  .t-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  #audience-top { margin-top: 8px; }
  .a-grid.a-main { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  .a-grid.one { grid-template-columns: minmax(0, 1fr); }
  .a-col { fill: var(--green); } .a-col.thin { opacity: .4; }
  .a-bar-fill.ud { background: var(--red); }
  .a-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  @media (max-width: 860px) { .a-grid, .a-grid.a-main { grid-template-columns: minmax(0, 1fr); } }
  .a-panel { padding: 14px; min-width: 0; }
  .a-panel h3 { font-size: 14px; margin: 0 0 2px; }
  .a-panel svg { display: block; width: 100%; height: auto; }
  .a-bars { display: grid; gap: 12px; margin-top: 12px; }
  .a-bar { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; }
  .a-bar-lab { display: flex; flex-direction: column; font-size: 14px; }
  .a-bar-track { display: flex; align-items: center; gap: 8px; }
  .a-track { flex: 1; min-width: 0; height: 16px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
  .a-bar-fill { height: 16px; border-radius: 4px; background: var(--green); opacity: .5; }
  .a-bar-val { min-width: 48px; text-align: right; }
  .f-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; pointer-events: none; }
  .f-mark { fill: var(--text); }
  .f-mark-name { fill: var(--text); font-size: 12px; font-weight: 650; }
  .f-mark-date { fill: var(--muted); font-size: 12px; }
  .acct-seg { flex-wrap: wrap; max-width: 100%; }
  /* Account chart picker: its own row under the title, the group switch then that group's metrics. */
  .acct-pick { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
  .acct-chips { padding-left: 12px; border-left: 1px solid var(--line); }
  @media (max-width: 560px) {
    .acct-chips { padding-left: 0; border-left: 0; }

  .sm-bar .trk i { display: block; height: 100%; border-radius: 4px; }
  .sm-bar b { text-align: right; font-variant-numeric: tabular-nums; }
  .sm-chg { font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  #det-cols { --s1: #8fdbe6; --s2: #1fa2b8; --s3: #157f92; --hand: #a7b4c2; margin: 0 0 20px; }
  .dc-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .dc-cols { grid-template-columns: minmax(0, 1fr); } }
  .dc-col { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 10px; padding: 12px 14px; }
  .dc-f { border-top: 1px solid var(--line); padding: 8px 0 0; margin-top: 8px; }
  .dc-f .t { font-size: 12px; font-weight: 600; } .dc-f .v { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .dc-f .d { font-size: 12px; color: var(--muted); } .dc-f .d b { color: var(--text); }
  .dc-pend { color: var(--muted); font-size: 12px; border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; display: inline-block; }
  .dc-prio { display: inline-block; font-size: 11px; font-weight: 700; color: #0f1419; background: #f0a070; border-radius: 4px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
  .sm-wk-h { display: flex; gap: 6px; align-items: center; } .sm-wk-t { font-weight: 600; margin: 6px 0 2px; }
  /* One day, story by story */
  #day { padding: 16px 18px 18px; margin: 0 0 20px; }
  #day h2 { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
  #day .dek { color: var(--muted); margin: 0 0 12px; }
  .dy-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
  .dy-pick { display: inline-flex; align-items: center; gap: 4px; }
  .dy-pick button, .dy-pick select { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 13px; padding: 5px 9px; cursor: pointer; }
  .dy-pick button:disabled { opacity: .4; cursor: default; }
  .dy-pick button:focus-visible, .dy-pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dy-stats { font-size: 13px; color: var(--muted); } .dy-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .dy-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 16px; }
  @media (max-width: 900px) { .dy-grid { grid-template-columns: minmax(0, 1fr); } }
  #dy-chart svg { display: block; width: 100%; height: auto; overflow: visible; }

  .dy-key i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px; border-radius: 50%; }
  .dy-key i.sq { border-radius: 2px; background: none; border: 1.5px solid var(--muted); }
  .dy-det { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; align-self: start; }
  .dy-det h3 { font-size: 14px; margin: 0 0 2px; }
  .dy-det .big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .dy-tl { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; margin: 10px 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  .dy-tl .lbl { color: var(--muted); }
  .dy-steps { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; }

  .dy-steps .row.max b { color: #f0a070; }
  .dy-tw { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 8px; font-size: 12px; }
  .dy-tw p { margin: 2px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .dy-slow th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }

  @media (max-width: 640px) { .dy-slow .hide-sm { display: none; } }
  #insider { padding: 16px 18px 18px; margin: 0 0 20px; }

</style>

<body>
<div class="topbar" id="topbar"><header>
  <h1>Post-Speed Tracker</h1>
  <div class="sub" id="subtitle">RotoWire vs Underdog — news-speed comparison.
    <span id="generated"></span></div>
  <div class="top-row"><div class="sports" id="sport-switcher"></div>
    <div class="seg page-seg hidden" id="page-seg" role="group" aria-label="Page">
      <button type="button" data-page="speed">Speed</button><button type="button" data-page="audience">Audience</button></div></div>
</header></div>
<div class="wrap">
  <!-- ALL-sports overview (shown when the ALL pill is selected) -->
  <section id="view-all" class="hidden"></section>

  <!-- Per-sport views (shown when a single sport is selected) -->
  <div class="pagetabs hidden" id="pagetabs" role="tablist" aria-label="Report">
    <button type="button" role="tab" data-t="sum">Summary</button><button type="button" role="tab" data-t="det">Details</button><button type="button" role="tab" data-t="road">Roadmap</button>
  </div>
  <section id="sum" aria-label="Summary"></section>
  <section id="road" aria-label="Roadmap"></section>
  <section id="audience-top" class="hidden"></section>
  <section class="lead timing-lead hidden" id="lead"></section>
  <section class="hidden" id="det-cols" aria-label="What drives each step"></section>
  <section class="panel trend" id="trend"></section>
  <section class="panel hidden" id="day" aria-labelledby="day-h"></section>
  <div class="kpis" id="kpis"></div>
  <section class="panel hidden" id="desk" aria-labelledby="desk-h"></section>
  <section class="panel hidden" id="edits" aria-labelledby="ed-h"></section>
  <section class="panel hidden" id="credits" aria-labelledby="cr-h"></section>
  <section class="panel hidden" id="insider" aria-labelledby="in-h"></section>

  <div class="tabs-wrap" id="tabs-wrap"><div class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" class="tab hidden" data-view="focus" id="tab-focus">Focus areas</button>
    <span class="tab-group" aria-hidden="true">Stories</span>
    <button type="button" role="tab" class="tab" data-view="feed">Feed</button>
    <button type="button" role="tab" class="tab" data-view="dups">Follow-ups</button>
    <button type="button" role="tab" class="tab" data-view="gaps">Gaps</button>
    <span class="tab-group" aria-hidden="true">Breakdowns</span>
    <button type="button" role="tab" class="tab hidden" data-view="types" id="tab-types">News type</button>
    <button type="button" role="tab" class="tab hidden" data-view="hours" id="tab-hours">Hour</button>
    <button type="button" role="tab" class="tab hidden" data-view="staff" id="tab-staff">Staff</button>
    <button type="button" role="tab" class="tab hidden" data-view="games" id="tab-games">Games</button>
    <button type="button" role="tab" class="tab hidden" data-view="practice" id="tab-practice">Practice</button>
    <span class="tab-group" aria-hidden="true">Over time</span>
    <button type="button" role="tab" class="tab" data-view="weekly">Weekly</button>
    <button type="button" role="tab" class="tab" data-view="monthly">Monthly</button>
    <button type="button" role="tab" class="tab" data-view="custom">Custom</button>
    <span class="tab-group" aria-hidden="true">Archive</span>
    <button type="button" role="tab" class="tab" data-view="archive">By phase · Focus areas</button>
  </div></div>

  <section id="view-feed">
    <div class="filters">
      <label>From<input type="date" id="f-from"></label>
      <label>To<input type="date" id="f-to"></label>
      <label>Event<select id="f-event"></select></label>
      <label>Player<input type="text" id="f-player" placeholder="name…"></label>
      <label>Min confidence<input type="number" id="f-conf" min="0" max="1" step="0.05" style="width:80px"></label>
      <label>Status<select id="f-status">
        <option value="matched" selected>matched</option><option value="">all</option>
        <option>pending</option><option>confirmed</option>
        <option>rejected</option><option>merged</option></select></label>
    </div>
    <div id="feed-wrap"></div>
  </section>

  <section id="view-archive" class="hidden">
    <p class="type-note">Kept for reference: the news system's phases, and the earlier "what to work on" ranking. The Summary and Details tabs above are the current report.</p>
    <section class="panel trend hidden" id="eras"></section>
    <h2 class="arch-h">Focus areas</h2>
    <div id="view-focus"></div>
  </section>
  <section id="view-weekly" class="hidden"></section>
  <section id="view-types" class="hidden"></section>
  <section id="view-hours" class="hidden"></section>
  <section id="view-staff" class="hidden"></section>
  <section id="view-games" class="hidden"></section>
  <section id="view-practice" class="hidden"></section>
  <section id="view-monthly" class="hidden"></section>
  <section id="view-custom" class="hidden"></section>
  <section id="view-gaps" class="hidden"></section>
  <section id="view-dups" class="hidden"></section>
</div>

<script>
const ALL = "all";
const state = {
  stories: [], agg: null, sortKey: "time", sortAsc: false,
  sport: null, sportMeta: null, sportsIndex: [],
  allSummaries: null,   // [{key,label,summary}] when the ALL overview is loaded
  // Default handles; overridden per-sport from sports.json.
  handles: { rotowire: "RotoWireMLB", underdog: "UnderdogMLB" },
};

// Bootstrap: read the sports index, build the switcher, then load the chosen view.
async function boot() {
  const bust = "?_=" + Date.now();
  let index;
  try {
    index = await fetch("./data/sports.json" + bust, { cache: "no-store" }).then(r => r.json());
  } catch (e) {
    // Fallback for a single-sport (pre-index) deployment: assume MLB.
    index = { sports: [{ key: "mlb", label: "MLB",
      handles: { rotowire: "RotoWireMLB", underdog: "UnderdogMLB" } }] };
  }
  state.sportsIndex = index.sports || [];
  const keys = state.sportsIndex.map(s => s.key);
  // Opening the bare page (or an old #all link) lands on NFL; an explicit #sport link is
  // still honored. We intentionally do NOT remember the last-viewed sport.
  const home = keys.includes("nfl") ? "nfl" : keys[0];
  const wanted = (location.hash || "").replace(/^#/, "");
  const chosen = keys.includes(wanted) ? wanted : home;
  await select(chosen);
}

function renderSwitcher() {
  const el = document.getElementById("sport-switcher");
  if (!el) return;
  const pill = (key, label) =>
    `<div class="sport-btn${key === state.sport ? " active" : ""}" data-sport="${key}">${esc(label)}</div>`;
  el.innerHTML = state.sportsIndex.map(s => pill(s.key, s.label)).join("");
  el.querySelectorAll(".sport-btn").forEach(btn =>
    btn.onclick = async () => {
      if (btn.dataset.sport === state.sport) return;
      // Switching sports keeps the reader on the same section (the sports' pages differ in
      // length, so a raw pixel offset would land somewhere else).
      const bar = document.getElementById("topbar").offsetHeight;
      const SECTIONS = ["audience-top", "lead", "trend", "kpis", "eras", "tabs-wrap"];
      const vis = id => { const n = document.getElementById(id); return n && !n.classList.contains("hidden") ? n : null; };
      const at = window.scrollY > 4 && SECTIONS.map(vis).filter(Boolean)
        .filter(n => n.getBoundingClientRect().top <= bar + 1).pop();
      const off = at ? at.getBoundingClientRect().top : 0;
      await select(btn.dataset.sport);
      const back = at && (vis(at.id) || SECTIONS.map(vis).filter(Boolean).find(n => SECTIONS.indexOf(n.id) > SECTIONS.indexOf(at.id)));
      window.scrollTo(0, back ? Math.max(0, window.scrollY + back.getBoundingClientRect().top - off) : 0);
    });
}

// Route to either the ALL overview or a single sport.
async function select(key) {
  state.sport = key;
  history.replaceState(null, "", "#" + key);
  if (key === ALL) { await loadAll(); }
  else { await loadSport(key); }
  renderSwitcher();
}

async function loadSport(sport) {
  state.sportMeta = state.sportsIndex.find(s => s.key === sport) || null;
  if (state.sportMeta && state.sportMeta.handles) state.handles = state.sportMeta.handles;
  try {
    const bust = "?_=" + Date.now();
    const base = `./data/${sport}/`;
    const [s, a] = await Promise.all([
      fetch(base + "stories.json" + bust, { cache: "no-store" }).then(r => r.json()),
      fetch(base + "aggregates.json" + bust, { cache: "no-store" }).then(r => r.json()),
    ]);
    state.stories = s; state.agg = a;
    state.desk = await fetch(base + "desk_speed.json" + bust, { cache: "no-store" })
      .then(r => r.ok ? r.json() : null).catch(() => null);
    state.credits = await fetch(base + "credits.json" + bust, { cache: "no-store" })
      .then(r => r.ok ? r.json() : null).catch(() => null);
  } catch (e) {
    state.desk = null; state.credits = null;
    state.stories = []; state.agg = { summary: {}, weekly: [], monthly: [] };
  }
  setMode(false);
  init();
}

// Fetch every sport's stories for the ALL overview (stories, not just aggregates, so
// the date filter can recompute each sport's totals over an arbitrary range).
async function loadAll() {
  const bust = "?_=" + Date.now();
  const rows = await Promise.all(state.sportsIndex.map(async s => {
    try {
      const stories = await fetch(`./data/${s.key}/stories.json` + bust, { cache: "no-store" })
        .then(r => r.json());
      return { key: s.key, label: s.label, stories, generated_at: s.generated_at };
    } catch (e) {
      return { key: s.key, label: s.label, stories: [], generated_at: s.generated_at };
    }
  }));
  state.allStories = rows;
  setMode(true);
  renderAll();
}

// Toggle between the ALL overview and the per-sport views.
function setMode(isAll) {
  document.getElementById("view-all").classList.toggle("hidden", !isAll);
  document.getElementById("kpis").classList.toggle("hidden", isAll);
  document.getElementById("trend").classList.toggle("hidden", isAll);
  if (isAll) { document.body.classList.remove("sp-sum", "sp-det", "sp-road"); document.getElementById("pagetabs").classList.add("hidden"); document.getElementById("desk").classList.add("hidden"); document.getElementById("credits").classList.add("hidden"); document.getElementById("edits").classList.add("hidden"); document.getElementById("day").classList.add("hidden"); }
  document.getElementById("tabs-wrap").classList.toggle("hidden", isAll);
  applyTopMode();
  if (isAll) {
    VIEWS.forEach(v =>
      document.getElementById("view-" + v).classList.add("hidden"));
  } else {
    showView(state.view || defaultView());   // restore the active tab, one visible at a time
  }
}

const VIEWS = ["feed","archive","weekly","types","hours","staff","games","practice","monthly","custom","gaps","dups"];

// ---- formatting helpers ----
const pad = n => String(n).padStart(2, "0");
// Central Time (America/Chicago) — Intl handles CDT/CST daylight-saving automatically.
const _ctFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Chicago", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", hour12: false,
});
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(+d)) return "—";
  const p = Object.fromEntries(_ctFmt.formatToParts(d).map(x => [x.type, x.value]));
  return `${p.month}/${pad(p.day)} ${p.hour}:${p.minute} CT`;
}

// Date-filter boundaries in Central Time (matching the CT display), so filtering
// "8/14–8/15" excludes an 8/13-evening-CT post even though it's 8/14 in UTC.
const _ctOffsetMs = ms => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", hour12: false, year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  const h = p.hour === "24" ? 0 : +p.hour;
  return Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second) - ms;
};
// Start (00:00 CT) of the given YYYY-MM-DD, as an epoch ms. null for empty input.
function ctDayStart(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  const utcMid = Date.UTC(y, m - 1, d);
  return utcMid - _ctOffsetMs(utcMid);
}
// Exclusive end (00:00 CT of the next day) of the given YYYY-MM-DD.
const ctDayEnd = dateStr => { const s = ctDayStart(dateStr); return s == null ? null : s + 86400000; };

// Tweet links: story sides carry tweet_id + the feed implies the handle.
// Handles are per-sport, sourced from sports.json into state.handles.
const tweetUrl = (handle, id) => `https://x.com/${handle}/status/${id}`;
function timeLink(handle, sideObj) {
  if (!sideObj || !sideObj.created_at) return "—";
  const label = fmtTime(sideObj.created_at);
  return sideObj.tweet_id
    ? `<a href="${tweetUrl(handle, sideObj.tweet_id)}" target="_blank" rel="noopener">${label}</a>`
    : label;
}
// Link arbitrary text to the tweet a story side refers to.
function textLink(handle, sideObj, text) {
  const label = esc(text || "—");
  return (sideObj && sideObj.tweet_id && text)
    ? `<a href="${tweetUrl(handle, sideObj.tweet_id)}" target="_blank" rel="noopener">${label}</a>`
    : label;
}
const hasMedia = t => /(https?:\/\/|t\.co\/)/.test(t || "");
// Classify a same-event duplicate as the original headline or a later follow-up,
// relative to the matched post on the SAME feed. Follow-ups that add a link/clip are
// flagged accordingly (RotoWire adds a story link; Underdog adds a video).
function dupRole(s) {
  const ls = loneSide(s);
  const m = s.duplicate_of && storyById(s.duplicate_of);
  const matchedSide = m && (s.status === "rotowire_only" ? m.rotowire : m.underdog);
  if (!ls || !matchedSide) return { cls: "", label: "duplicate" };
  // The original is the FIRST post on this feed about the event — comparing against the
  // matched post AND every other duplicate of it on the same feed (so a 2nd follow-up
  // isn't mislabeled "original" just because the matched post came later still).
  const peers = state.stories
    .filter(x => x.same_event_duplicate && x.duplicate_of === m.story_id && x.status === s.status)
    .map(x => loneSide(x)?.side).filter(Boolean);
  const sameFeed = [matchedSide, ...peers];
  const earliest = sameFeed.reduce((a, b) => new Date(a.created_at) <= new Date(b.created_at) ? a : b);
  if (ls.side.tweet_id === earliest.tweet_id) return { cls: "role-original", label: "Original (headline)" };
  const medium = hasMedia(ls.side.text)
    ? (s.status === "underdog_only" ? " + video" : " + link") : "";
  return { cls: "role-followup", label: "Follow-up" + medium };
}
// The single populated side of a one-sided story (gap or duplicate) + its handle.
function loneSide(s) {
  if (s.rotowire) return { handle: state.handles.rotowire, side: s.rotowire };
  if (s.underdog) return { handle: state.handles.underdog, side: s.underdog };
  return null;
}
const storyById = id => state.stories.find(s => s.story_id === id);
function fmtDelta(sec) {
  if (sec == null) return "—";
  const a = Math.abs(sec), m = Math.floor(a/60), s = a%60;
  const txt = (m ? `${m}m ` : "") + `${s}s`;
  const cls = sec > 0 ? "pos" : "neg";
  const sign = sec > 0 ? "+" : "−";
  return `<span class="delta ${cls}">${sign}${txt}</span>`;
}
const fmtPct = r => r == null ? "—" : (r*100).toFixed(0) + "%";
const fmtNum = n => n == null ? "—" : n.toLocaleString();
// Minutes:seconds, e.g. 244 -> "4:04". Used for the win/loss margins.
const fmtMS = sec => {
  if (sec == null) return "—";
  const a = Math.round(Math.abs(sec)), m = Math.floor(a / 60), s = a % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
};
function side(s, key) { return (s[key] && s[key].created_at) ? s[key].created_at : null; }
function storyTime(s) {
  const ts = [side(s,"rotowire"), side(s,"underdog")].filter(Boolean).map(t => +new Date(t));
  return ts.length ? Math.min(...ts) : 0;
}

// ---- lead + KPI header ----
const fmtShortDay = d => d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" }) : "";

// The lead: the typical margin in the first era vs the latest one (sports.<sport>.eras).
function renderLead() {
  const el = document.getElementById("lead");
  const eras = (state.agg.eras || []).filter(e => e.median_lead_seconds != null);
  if (eras.length < 2) { el.innerHTML = ""; el.dataset.empty = "1"; return; }
  delete el.dataset.empty;
  const a = eras[0], z = eras[eras.length - 1];
  const win = e => e.from ? `since ${fmtShortDay(e.from)}` : `${fmtShortDay(e.first)} – ${fmtShortDay(e.last)}`;
  el.innerHTML = `<div class="eyebrow">Gap to Underdog</div>
    <h2><span class="from">${fmtMargin(a.median_lead_seconds)}</span><span class="arrow" aria-label="to">→</span><span class="to">${fmtMargin(z.median_lead_seconds)}</span></h2>
    <p>Typical margin on stories both accounts posted: ${esc(a.label)} (${win(a)}) vs ${esc(z.label)} (${win(z)}).</p>`;
}

function renderKpis() {
  renderLead();
  const h = state.agg.headline;
  const el = document.getElementById("kpis");
  el.classList.toggle("has-headline", !!(h && h.matched));
  if (!h || !h.matched) { el.innerHTML = ""; return; }
  const pct = r => r == null ? "—" : `${Math.round(r * 100)}%`;
  const since = fmtShortDay(h.since);
  // Who posted first on matched stories: RotoWire | tie (within a minute) | Underdog.
  // Each segment shows its number when it fits (fitBarLabels); the key below names every segment.
  const seg = (cls, n, rate, label) => rate ? `<div class="hb-seg ${cls}" style="flex:${n}"
      title="${label}: ${n} of ${h.matched} matched stories (${pct(rate)})"><span>${pct(rate)}</span></div>` : "";
  const key = (color, label, rate) => `<span><i style="background:${color}"></i>${label} <b>${pct(rate)}</b></span>`;
  const tile = (label, value, sub, tip) => `<div class="kpi" title="${esc(tip)}"><div class="label">${label}</div>
    <div class="value">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  // Practice reports: share of player practice days each side posted, pre and post practice.
  const pr = state.agg.practice && state.agg.practice.phases;
  const prTile = pr && pr.pre && pr.post ? `<div class="kpi" title="Of the player practice days in the last ${state.agg.practice.days} days, how often each account posted the pre-practice update (will he practice, seen or not) and the post-practice report (full, limited, DNP)">
      <div class="label">Practice updates posted</div>
      <div class="rows"><span></span><span>RW</span><span>UD</span>
        <span>Pre</span><b>${pct(pr.pre.rotowire_posted_rate)}</b><span>${pct(pr.pre.underdog_posted_rate)}</span>
        <span>Post</span><b>${pct(pr.post.rotowire_posted_rate)}</b><span>${pct(pr.post.underdog_posted_rate)}</span></div></div>` : "";
  el.innerHTML = `<div class="headline">
      <div class="hl-head"><h3>Who posted first</h3>
        <span>Last ${h.days} days (since ${since}) · ${h.matched} matched stories · a tie is within ${Math.round(h.tie_seconds / 60)} minute</span></div>
      <div class="hb" role="img" aria-label="RotoWire first ${pct(h.rotowire_first_rate)}, tie ${pct(h.tie_rate)}, Underdog first ${pct(h.underdog_first_rate)}">
        ${seg("rw", h.rotowire_first, h.rotowire_first_rate, "RotoWire first")}
        ${seg("tie", h.ties, h.tie_rate, "Tie")}
        ${seg("ud", h.underdog_first, h.underdog_first_rate, "Underdog first")}
      </div>
      <div class="hb-key">${key("var(--green)", "RotoWire first", h.rotowire_first_rate)}${key("#4a5563", "Tie", h.tie_rate)}${key("var(--red)", "Underdog first", h.underdog_first_rate)}</div>
    </div>
    ${prTile}
    ${tile(`Typical margin · last ${h.days} days`, fmtMargin(h.median_lead_seconds), "on stories both posted",
      "UD +1:50 means Underdog was typically 1:50 faster on the stories both posted")}
    <div class="kpi" title="Real stories only one account posted, out of every real story either posted (highlight clips, roundups, follow-ups and skipped steps left out)">
      <div class="label">Stories only one side posted</div>
      <div class="rows">
        <span>RW only</span><b>${pct(h.underdog_missed_rate)}</b><span>${h.underdog_missed} stories</span>
        <span>UD only</span><b>${pct(h.rotowire_missed_rate)}</b><span>${h.rotowire_missed} stories</span></div></div>`;
  el.style.setProperty("--n", el.querySelectorAll(":scope > .kpi").length || 1);
  fitBarLabels();
}

// Hide a segment's number when it does not fit inside the segment.
function fitBarLabels() {
  document.querySelectorAll(".hb-seg").forEach(seg => {
    const sp = seg.querySelector("span");
    if (sp) sp.style.visibility = sp.offsetWidth + 12 <= seg.clientWidth ? "" : "hidden";
  });
}

// ---- feed ----
const COLS = [
  ["time", "Date", s => fmtTime(storyTimeIso(s)), false],
  ["player", "Player", s => esc(s.player), false],
  ["team", "Team", s => esc(s.team || "—"), false],
  ["event_class", "Event", s => `<span class="chip">${esc(s.event_class||"—")}</span>`, false],
  ["canonical_label", "Story", s => esc(s.canonical_label || "—"), false],
  ["rw_time", "RotoWire", s => timeLink(state.handles.rotowire, s.rotowire), false],
  ["ud_time", "Underdog", s => timeLink(state.handles.underdog, s.underdog), false],
  ["time_delta_seconds", "Δ lead", s => fmtDelta(s.time_delta_seconds), true],
  ["winner", "Winner", s => winnerBadge(s), false],
  ["rw_impr", "RW impr", s => fmtNum(s.rotowire?.impression_count), true],
  ["ud_impr", "UD impr", s => fmtNum(s.underdog?.impression_count), true],
  // RotoWire's own post metrics (non-public; X gives them only to the account owner, @RotoWireNFL).
  ["rw_eng", "RW eng.", s => rwOwned(s.rotowire, "engagements"), true, hasOwned],
  ["rw_profile", "RW profile clicks", s => rwOwned(s.rotowire, "profile_clicks"), true, hasOwned],
  ["match_confidence", "Conf", s => s.match_confidence!=null ? s.match_confidence.toFixed(2) : "—", true],
  ["review_status", "Review", s => `<span class="status-${s.review_status}">${s.review_status}</span>`, false],
];
// RotoWire's engagements or profile clicks on a post. Hover gives the share of its views and,
// when the post has any, its link clicks (news posts rarely carry a link).
function hasOwned() { return state.stories.some(s => s.rotowire?.engagements != null); }
function rwOwned(sd, k) {
  if (sd?.[k] == null) return "—";
  const tip = [sd.impression_count ? `${(sd[k] / sd.impression_count * 100).toFixed(1)}% of views` : "",
    sd.link_clicks ? `${fmtNum(sd.link_clicks)} link click${sd.link_clicks === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ");
  return tip ? `<span class="has-tip" title="${tip}">${fmtNum(sd[k])}</span>` : fmtNum(sd[k]);
}
function storyTimeIso(s){ const t = storyTime(s); return t ? new Date(t).toISOString() : null; }
function winnerBadge(s) {
  if (s.roundup) return `<span class="chip">Roundup</span>`;
  if (s.status === "rotowire_only") return `<span class="chip">RW only</span>`;
  if (s.status === "underdog_only") return `<span class="chip">UD only</span>`;
  if (s.rotowire_first == null) return "—";
  return s.rotowire_first ? `<span class="badge rw">RotoWire</span>` : `<span class="badge ud">Underdog</span>`;
}
function esc(v){ return v==null ? "" : String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function sortVal(s, key) {
  switch (key) {
    case "time": return storyTime(s);
    case "rw_time": return +new Date(side(s,"rotowire")||0);
    case "ud_time": return +new Date(side(s,"underdog")||0);
    case "rw_impr": return s.rotowire?.impression_count ?? -1;
    case "ud_impr": return s.underdog?.impression_count ?? -1;
    case "rw_eng": return s.rotowire?.engagements ?? -1;
    case "rw_profile": return s.rotowire?.profile_clicks ?? -1;
    case "winner": return s.rotowire_first ? 1 : 0;
    default: return s[key] ?? "";
  }
}

function filteredStories() {
  const fromT = ctDayStart(val("f-from")), toT = ctDayEnd(val("f-to")),
        ev = val("f-event"), pl = val("f-player").toLowerCase(),
        conf = parseFloat(val("f-conf")), st = val("f-status");
  return state.stories.filter(s => {
    if (s.same_event_duplicate) return false;  // duplicates live on their own tab
    const t = storyTime(s);
    if (fromT != null && t < fromT) return false;
    if (toT != null && t >= toT) return false;
    if (ev && s.event_class !== ev) return false;
    if (pl && !(s.player||"").toLowerCase().includes(pl)) return false;
    if (!isNaN(conf) && (s.match_confidence ?? 0) < conf) return false;
    // Status filter: "matched" targets the story's match status; the review states
    // (pending/confirmed/rejected/merged) target review_status.
    if (st === "matched") { if (s.status !== "matched") return false; }
    else if (st && s.review_status !== st) return false;
    return true;
  });
}
const val = id => document.getElementById(id).value;

function renderFeed() {
  const rows = filteredStories().sort((a,b) => {
    const va = sortVal(a, state.sortKey), vb = sortVal(b, state.sortKey);
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return state.sortAsc ? cmp : -cmp;
  });
  const wrap = document.getElementById("feed-wrap");
  if (!rows.length) { wrap.innerHTML = `<div class="empty">No stories match. Once matching (Phase 3) writes stories.jsonl, rows appear here.</div>`; return; }
  const cols = COLS.filter(c => !c[4] || c[4]());
  const head = cols.map(([k,label,,num]) => {
    const cls = (k===state.sortKey ? "sorted "+(state.sortAsc?"asc":"") : "");
    return `<th class="${cls}" data-key="${k}" ${num?'style="text-align:right"':''}>${label}</th>`;
  }).join("");
  const body = rows.map(s => "<tr>" + cols.map(([k,,fn,num]) =>
    `<td class="${num?'num':''}${k==='canonical_label'?' story':''}">${fn(s)}</td>`).join("") + "</tr>").join("");
  wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  wrap.querySelectorAll("th[data-key]").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if (state.sortKey === k) state.sortAsc = !state.sortAsc;
    else { state.sortKey = k; state.sortAsc = false; }
    renderFeed();
  });
}

// ---- rollup views ----
// "2026-09-08","2026-09-14" -> "Sep 8–14"; a single date -> "Sep 7". Dates are local calendar days.
function fmtWeekRange(start, end) {
  const d = x => new Date(x + "T12:00:00Z");
  const mon = x => d(x).toLocaleString("en-US", { month: "short", timeZone: "UTC" });
  const day = x => d(x).getUTCDate();
  if (!end) return `${mon(start)} ${day(start)}`;
  return mon(start) === mon(end) ? `${mon(start)} ${day(start)}–${day(end)}`
                                 : `${mon(start)} ${day(start)} – ${mon(end)} ${day(end)}`;
}
function renderRollup(el, rows, periodLabel) {
  if (!rows.length) { el.innerHTML = `<div class="empty">No ${periodLabel} data yet.</div>`; return; }
  // Update gaps (development matching): a step of a story both covered that one side skipped.
  const steps = rows.some(r => r.underdog_update_only != null);
  const bars = rows.map(r => {
    const pct = (r.rotowire_first_rate ?? 0) * 100;
    return `<div class="bar-row"><span>${r.period}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span>${fmtPct(r.rotowire_first_rate)}</span></div>`;
  }).join("");
  const body = rows.map(r => `<tr>
    <td>${r.period}</td><td class="num">${r.matched}</td>
    <td class="num">${fmtPct(r.rotowire_first_rate)}</td>
    <td class="num">${fmtMargin(r.median_lead_seconds)}</td>
    <td class="num">${fmtMS(r.median_win_lead_seconds)}</td>
    <td class="num">${fmtMS(r.median_win_trail_seconds)}</td>
    <td class="num">${r.rotowire_only}</td><td class="num">${r.underdog_only}</td>
    ${steps ? `<td class="num">${r.underdog_update_only ?? 0}</td><td class="num">${r.rotowire_update_only ?? 0}</td>` : ""}</tr>`).join("");
  el.innerHTML = `<div class="panel"><h3 style="color:var(--muted)">RotoWire-first win rate by ${periodLabel}</h3>
    <div class="bars">${bars}</div></div>
    <table><thead><tr><th data-nosort>Period</th><th data-nosort style="text-align:right">Matched</th>
    <th data-nosort style="text-align:right">RW win rate</th>
    <th data-nosort style="text-align:right" title="Median of every matched story; UD +1:40 means Underdog was typically 1:40 faster">Typical margin</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories RotoWire posted first">RW wins by</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories Underdog posted first">UD wins by</th><th data-nosort style="text-align:right">RW-only</th>
    <th data-nosort style="text-align:right">UD-only</th>
    ${steps ? `<th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted (e.g. headed to the locker room)">Steps RW skipped</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only RotoWire posted">Steps UD skipped</th>` : ""}
    </tr></thead><tbody>${body}</tbody></table>`;
}

// ---- by news type: season week x type grid of RotoWire's win rate ----
// Single-hue ramp (magnitude): surface -> RotoWire teal. Win rates of 50%+ share the top step.
const TYPE_RAMP = ["#1c282e", "#1d404a", "#1d5965", "#1e7181", "#1e8a9c", "#1fa2b8"];
const TYPE_MIN_STORIES = 10;   // cells below this are hatched: too few stories to read much into

function fmtMargin(sec) {
  if (sec == null) return "—";
  if (sec === 0) return "even";
  const a = Math.abs(Math.round(sec));
  return `${sec > 0 ? "RW" : "UD"} +${Math.floor(a / 60)}:${pad(a % 60)}`;
}

function typeCell(c, extra = "", typeKey = "", week = "") {
  if (!c) return `<td class="type-cell empty-cell ${extra}"><div>—</div></td>`;
  const rate = c.rotowire_first_rate;
  const bg = TYPE_RAMP[Math.min(TYPE_RAMP.length - 1, Math.floor(rate / 0.1))];
  const ink = rate >= 0.3 ? "#0f1419" : "var(--text)";
  const low = c.matched < TYPE_MIN_STORIES;
  const tip = `${c.matched} matched ${c.matched === 1 ? "story" : "stories"} · RW first ${fmtPct(rate)} · ` +
    `median ${c.median_lead_seconds < 0 ? "Underdog" : c.median_lead_seconds > 0 ? "RotoWire" : "even"}` +
    `${c.median_lead_seconds ? " faster by " + fmtMargin(c.median_lead_seconds).split("+")[1] : ""}`;
  const picked = state.typePick && state.typePick.type === typeKey && state.typePick.week === week;
  return `<td class="type-cell ${low ? "low" : ""} ${picked ? "picked" : ""} ${extra}">
    <button type="button" data-type="${esc(typeKey)}" data-week="${esc(week)}" title="${esc(tip)} · click for examples"
      style="background:${bg};color:${ink}"><span class="pct">${fmtPct(rate)}</span>
    <span class="meta">${c.matched} · ${fmtMargin(c.median_lead_seconds)}</span></button></td>`;
}

function renderTypes() {
  const nt = state.agg.news_types;
  const has = !!(nt && nt.types && nt.types.length);
  document.getElementById("tab-types").classList.toggle("hidden", !has);
  const el = document.getElementById("view-types");
  if (!has) { el.innerHTML = ""; return; }

  // Flag the week still in progress (its end date hasn't passed yet).
  const today = new Date().toISOString().slice(0, 10);
  const ends = Object.fromEntries((state.agg.season_weeks || []).map(r => [r.period, r.end]));
  const head = nt.weeks.map(w => `<th class="wk">${esc(w)}${ends[w] && ends[w] >= today
    ? `<span class="wk-note">in progress</span>` : ""}</th>`).join("");
  const rows = nt.types.map(t => `<tr><th scope="row" class="type-name">${esc(t.label)}</th>
    ${nt.weeks.map(w => typeCell(t.weeks[w], "", t.key, w)).join("")}${typeCell(t.season, "season", t.key, "")}</tr>`).join("");

  el.innerHTML = `<p class="type-note">How often RotoWire posted first, by type of news and NFL week.
    Each cell shows RW's win rate, then the number of matched stories and the median margin
    (UD +2:00 means Underdog was typically two minutes faster). Week 1 on; types are sorted
    by keyword rules on the post text, so treat them as close, not exact.</p>
    <div class="type-wrap"><table class="type-grid"><thead><tr><th>News type</th>${head}
    <th class="wk season">Season</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="type-legend"><span>RW win rate</span>
      <span class="ramp">${TYPE_RAMP.map(c => `<i style="background:${c}"></i>`).join("")}</span>
      <span>0% → 50%+</span><span class="hatch-key"></span><span>Fewer than ${TYPE_MIN_STORIES} stories</span>
      <span class="legend-hint">Click a cell to see its stories.</span></div>
    <div id="type-examples">${typeExamples(nt)}</div>`;
  el.querySelectorAll(".type-cell button").forEach(b => b.onclick = () => {
    const pick = { type: b.dataset.type, week: b.dataset.week };
    const same = state.typePick && state.typePick.type === pick.type && state.typePick.week === pick.week;
    state.typePick = same ? null : pick;
    renderTypes();
    if (state.typePick) document.getElementById("type-examples").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  const close = document.getElementById("type-examples-close");
  if (close) close.onclick = e => { e.preventDefault(); state.typePick = null; renderTypes(); };
}

// Head-to-heads behind the picked grid cell: both tweets, times and margin.
function typeExamples(nt) {
  const pick = state.typePick;
  if (!pick) return "";
  const t = nt.types.find(x => x.key === pick.type);
  if (!t) return "";
  const rows = state.stories.filter(s => s.status === "matched" && s.news_type === pick.type
      && s.review_status !== "rejected" && s.season_week && s.season_week !== "Preseason"
      && (!pick.week || s.season_week === pick.week))
    .sort((a, b) => storyTime(b) - storyTime(a));
  const body = rows.map(s => {
    const d = s.time_delta_seconds;
    const cls = d > 0 ? "rw" : d < 0 ? "ud" : "";
    return `<tr><td>${esc(s.player || "?")}${pick.week ? "" : `<div class="muted-sm">${esc(s.season_week)}</div>`}</td>
      <td><span class="badge ${cls}">${fmtMargin(d)}</span></td>
      <td class="story"><span class="who-tag">UD</span>${timeLink(state.handles.underdog, s.underdog)}
        <div>${textLink(state.handles.underdog, s.underdog, s.underdog.text)}</div></td>
      <td class="story"><span class="who-tag">RW</span>${timeLink(state.handles.rotowire, s.rotowire)}
        <div>${textLink(state.handles.rotowire, s.rotowire, s.rotowire.text)}</div></td></tr>`;
  }).join("");
  return `<div class="examples-head"><h3>${esc(t.label)} · ${esc(pick.week || "Season")}</h3>
      <span>${rows.length} head-to-head${rows.length === 1 ? "" : "s"}, newest first ·
      <a href="#" id="type-examples-close">close</a></span></div>
    <div class="type-wrap"><table class="examples"><thead><tr><th data-nosort>Player</th>
      <th data-nosort>First by</th><th data-nosort>Underdog</th><th data-nosort>RotoWire</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

// ---- by time of day: each account's news volume per hour + RotoWire's win rate that hour ----
const hourLabel = h => h === 0 ? "12a" : h < 12 ? `${h}a` : h === 12 ? "12p" : `${h - 12}p`;

function renderHours() {
  const hours = state.agg.hours || [];
  const has = hours.some(h => h.matched || h.rotowire_posts || h.underdog_posts);
  document.getElementById("tab-hours").classList.toggle("hidden", !has);
  const el = document.getElementById("view-hours");
  if (!has) { el.innerHTML = ""; return; }

  // Volume bars show news posts, or every collected post with nothing excluded.
  const all = state.hoursAll && hours.some(h => h.rotowire_all != null);
  const rwN = h => all ? h.rotowire_all : h.rotowire_posts;
  const udN = h => all ? h.underdog_all : h.underdog_posts;
  const what = all ? "" : "news ";

  const cell = h => {

    const tip = `${hourLabel(h.hour)}: RotoWire first on ${h.rotowire_first} of ${h.matched} · typical ${fmtMargin(h.median_lead_seconds)}`;
    return `<div class="hcell ${h.matched < TYPE_MIN_STORIES ? "low" : ""}" title="${esc(tip)}"
      style="background-color:${bg};color:${rate >= 0.3 ? "#0f1419" : "var(--text)"}">
      <b>${fmtPct(rate)}</b><span>${h.matched}</span></div>`;
  };
  const rows = hours.map(h => `<tr><td>${hourLabel(h.hour)}</td><td class="num">${h.rotowire_posts}</td>
    <td class="num">${h.underdog_posts}</td><td class="num">${h.rotowire_all ?? "—"}</td>
    <td class="num">${h.rotowire_links ?? "—"}</td>
    <td class="num">${h.underdog_all ?? "—"}</td><td class="num">${h.matched}</td>
    <td class="num">${h.matched ? fmtPct(h.rotowire_first / h.matched) : "—"}</td>
    <td class="num">${fmtMargin(h.median_lead_seconds)}</td></tr>`).join("");

  el.innerHTML = `<p class="type-note">When each account posts news, and how often RotoWire was first, by

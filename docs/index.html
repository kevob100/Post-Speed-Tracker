function renderAllTable() {
  const rows = state.allStories || [];
  // CT day boundaries (fromT inclusive, toT exclusive), matching the CT display.
  const fromT = ctDayStart(state.allFrom);
  const toT = ctDayEnd(state.allTo);

  const perSport = rows.map(r => ({ ...r, summary: summarize(r.stories, fromT, toT) }));
  const totalSummary = summarize(rows.flatMap(r => r.stories), fromT, toT);

  const cell = v => `<td class="num">${v}</td>`;
  const dataRow = (label, s, key) => {
    const isTotal = !key;
    const name = isTotal
      ? `<td class="sport-name">All sports</td>`
      : `<td class="sport-name">${esc(label)} <span class="go">view →</span></td>`;
    return `<tr class="${isTotal ? "total-row" : "sport-row"}"${key ? ` data-go="${key}"` : ""}>
      ${name}
      ${cell(fmtNum(s.matched))}
      ${cell(fmtPct(s.rotowire_first_rate))}
      ${cell(s.matched ? s.rotowire_first + "/" + s.matched : "—")}
      ${cell(fmtMS(s.median_win_lead_seconds))}
      ${cell(fmtMS(s.median_win_trail_seconds))}
      ${cell(s.rotowire_only)}
      ${cell(s.underdog_only)}
      ${cell(s.dups)}
    </tr>`;
  };

  const head = `<tr>
    <th data-nosort>Sport</th>
    <th data-nosort style="text-align:right">Matched</th>
    <th data-nosort style="text-align:right">RW-first rate</th>
    <th data-nosort style="text-align:right">RW / matched</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories RotoWire posted first">RW wins by</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories Underdog posted first">UD wins by</th>
    <th data-nosort style="text-align:right">RW-only</th>
    <th data-nosort style="text-align:right">UD-only</th>
    <th data-nosort style="text-align:right">Follow-ups</th></tr>`;
  const body = dataRow("", totalSummary, null)
    + perSport.map(r => dataRow(r.label, r.summary, r.key)).join("");
  document.getElementById("all-wrap").innerHTML =
    `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;

  // Click a sport row to jump into its full view.
  document.querySelectorAll("#view-all tr.sport-row").forEach(tr =>
    tr.onclick = () => select(tr.dataset.go));
}

// ---- audience (top of the page): RotoWire's followers and account metrics over time ----
const AUD_MIN_POSTS = 20;             // a week with fewer posts on a side is too thin to compare
const AUD_MIN_DAYS = 30;              // follower history shorter than this hides the audience section

// Audience sits at the top of a sport's page, timing below it; the ALL overview shows neither.
function applyTopMode() {
  const isAll = state.sport === ALL || !state.agg;
  ["kpis", "trend", "lead", "eras"].forEach(id => {
    const node = document.getElementById(id);
    node.classList.toggle("hidden", isAll || node.dataset.empty === "1"); });
  const aud = document.getElementById("audience-top");
  // Speed is the main page; Audience is offered only when the sport has account history.
  const hasAud = !isAll && !!state.agg.audience && aud.dataset.empty !== "1";
  const page = hasAud && state.page === "audience" ? "audience" : "speed";
  document.body.classList.toggle("page-audience", page === "audience");
  aud.classList.toggle("hidden", page !== "audience");
  const seg = document.getElementById("page-seg");
  seg.classList.toggle("hidden", !hasAud);
  seg.querySelectorAll("button").forEach(b => {
    const on = b.dataset.page === page;
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.onclick = () => {
      if (state.page === b.dataset.page) return;
      state.page = b.dataset.page;
      window.scrollTo(0, 0);
      applyTopMode();
      applySpeedTab();
      // Charts measure their panel, so draw the one that just became visible.
      if (state.page === "audience") renderAudience(); else { renderTrend(); updateTabFade(); }
    };
  });
}

function renderAudience() {
  const a = state.agg.audience;
  const el = document.getElementById("audience-top");
  el.dataset.empty = "";
  applyTopMode();   // show the panel first so the follower chart measures its real width
  if (!a) { el.innerHTML = ""; return; }
  const kfmt = n => n == null ? "—" : n < 0 ? "−" + kfmt(-n) : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(n >= 1e5 ? 0 : 1) + "k" : String(Math.round(n));
  const num = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
  const fmtD = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const fol = a.followers || {};
  const genAt = new Date(state.agg.generated_at || Date.now());
  // Complete news-post weeks, used only to flag a sudden step in RotoWire's views per post.
  const full = (a.views_by_week || []).filter(w =>
    new Date(w.week + "T00:00:00Z").getTime() + (7 * 24 + (a.mature_hours || 36)) * 3600e3 <= genAt.getTime()
    && (w.rotowire_posts || 0) >= AUD_MIN_POSTS && (w.underdog_posts || 0) >= AUD_MIN_POSTS);
  // Any 3x step in RotoWire's median views per post, noted under the Impressions view.
  let jump = null;
  full.forEach((w, i) => { const p = full[i - 1];
    if (p && p.rotowire_median_views && w.rotowire_median_views / p.rotowire_median_views >= 3
        && (!jump || w.rotowire_median_views / p.rotowire_median_views > jump.f))
      jump = { w, p, f: w.rotowire_median_views / p.rotowire_median_views }; });

  // One account chart with a metric picker: followers (daily line) or a weekly account total
  // (bars), on the same timeline with the same news-system markers. Metrics sit in groups;
  // a metric with no data for this sport (or only zeros) is left out, and so is an empty group.
  const acct = (a.rotowire_account_impressions || []).filter(w => w.days === 7);
  const mval = (w, k) => k === "net_follows" ? (w.new_follows == null ? null : w.new_follows - (w.unfollows || 0)) : w[k];
  const ACCT_GROUPS = [
    ["Audience", [["followers", "Followers"], ["net_follows", "Net follows"]]],
    ["Reach", [["impressions", "Impressions"], ["media_views", "Media views"], ["video_views", "Video views"]]],
    ["Engagement", [["engagements", "Engagements"], ["likes", "Likes"], ["replies", "Replies"], ["reposts", "Reposts"],
      ["bookmarks", "Bookmarks"], ["shares", "Shares"]]],
    ["Clicks", [["link_clicks", "Link clicks"], ["content_clicks", "Content clicks"], ["profile_visits", "Profile visits"]]],
    ["Posts", [["posts", "Posts"]]],
  ].map(([g, ms]) => [g, ms.filter(([k]) => k === "followers" || acct.some(w => mval(w, k)))]).filter(([, ms]) => ms.length);
  const ACCT_METRICS = ACCT_GROUPS.flatMap(([, ms]) => ms);
  const metric = ACCT_METRICS.some(([k]) => k === state.acctMetric) ? state.acctMetric : "followers";
  const metricLabel = ACCT_METRICS.find(([k]) => k === metric)[1];
  const group = ACCT_GROUPS.find(([, ms]) => ms.some(([k]) => k === metric));
  // What each weekly metric counts, under the chart title.
  const DEF = {
    net_follows: "Follows gained minus follows lost each week.",
    impressions: "Times any RotoWire post was seen.",
    media_views: "Plays and views of images and videos in posts.",
    video_views: "Video plays.",
    engagements: "Every interaction with a post: likes, replies, reposts, clicks, expands and more.",
    likes: "", replies: "", reposts: "", bookmarks: "", shares: "",
    link_clicks: "Clicks on links in posts, the traffic sent to rotowire.com and elsewhere.",
    content_clicks: "Clicks on the post itself (to open it or its media) rather than on its links.",
    profile_visits: "Visits to the RotoWire profile.",
    posts: "Posts published.",
  };
  // Rates in the tooltip: per post for anything a post earns, and a share of impressions for interactions.
  const PER_POST = new Set(["impressions", "media_views", "video_views", "engagements", "likes", "replies", "reposts",
    "bookmarks", "shares", "link_clicks", "content_clicks", "profile_visits"]);
  const OF_IMPR = new Set(["engagements", "likes", "replies", "reposts", "bookmarks", "shares", "link_clicks",
    "content_clicks", "profile_visits"]);
  const SRC_LABEL = { sprout: "From Sprout Social", x_analytics: "From X Analytics" };
  // X Analytics (the account's own export) wins on the days it covers; Sprout Social fills the rest.
  const acctFrom = (a.account_sources || []).join(" and ") || "X Analytics";

  // Followers all time (X Analytics export, then the pipeline's daily count), or a weekly export
  // metric, with the news-system milestones marked, drawn at the panel's real width.
  let folLead = "", folPanel = "";
  const fr = fol.rotowire || [];
  // A few days of counts is noise, not a trend: the section waits for AUD_MIN_DAYS of history.
  const span = fr.length ? (new Date(fr[fr.length - 1].date) - new Date(fr[0].date)) / 864e5 : 0;
  el.dataset.empty = span >= AUD_MIN_DAYS ? "" : "1";
  if (span >= AUD_MIN_DAYS) {
    const W = Math.max(300, (el.clientWidth || 1100) - 28), narrow = W < 560;
    const LANE_ROW = narrow ? 18 : 34;   // each extra row of event labels adds this much above the plot
    const m = { t: 52, r: narrow ? 52 : 64, b: 30, l: narrow ? 52 : 64 }, iw = W - m.l - m.r;
    const t = d => new Date(d + "T12:00:00Z").getTime();
    const t0 = t(fr[0].date), t1 = Math.max(t(fr[fr.length - 1].date), t0 + 86400e3);
    const x = d => m.l + (t(d) - t0) / (t1 - t0) * iw;
    // News-system milestones get a label lane above the plot: short name, date under it, and a
    // dot where the dashed line starts. Each label goes left or right of its line, in some row;
    // no two labels in a row may touch, and no label may be crossed by the line of a marker
    // labelled higher up. A small search finds the fewest rows that works (right side preferred).
    const lane = (state.agg.milestones || []).filter(ms => t(ms.date) >= t0 && t(ms.date) <= t1)
      .map(mk => ({ ...mk, px: x(mk.date),
        w: (narrow ? fmtD(mk.date).length : Math.max(mk.label.length, fmtD(mk.date).length)) * 7.4 }))
      .sort((p, q) => p.px - q.px);
    const span = (L, right) => right ? [L.px, L.px + 8 + L.w] : [L.px - 8 - L.w, L.px];
    const ok = (L, i) => lane.slice(0, i).every(o => {
      if (o.row === L.row && L.a0 < o.a1 + 10 && L.a1 > o.a0 - 10) return false;
      if (o.row > L.row && o.px > L.a0 - 4 && o.px < L.a1 + 4) return false;   // o's line crosses L
      if (L.row > o.row && L.px > o.a0 - 4 && L.px < o.a1 + 4) return false;   // L's line crosses o
      return true; });
    const place = (i, maxRow) => {
      if (i === lane.length) return true;
      const L = lane[i];
      for (let row = 0; row <= maxRow; row++) for (const right of [true, false]) {
        const [a0, a1] = span(L, right);
        if (a0 < 0 || a1 > W - 2) continue;
        Object.assign(L, { row, right, a0, a1 });
        if (ok(L, i) && place(i + 1, maxRow)) return true;
      }
      return false;
    };
    let found = false;
    for (let maxRow = 0; maxRow < 5 && !found; maxRow++) found = place(0, maxRow);
    // No layout fits (many markers on a narrow screen): stack them one per row.
    if (!found) lane.forEach((L, i) => { const [a0, a1] = span(L, L.px + 8 + L.w <= W - 2); Object.assign(L, { row: i, right: a1 > L.px, a0, a1 }); });
    m.t += Math.max(0, ...lane.map(L => L.row)) * LANE_ROW;
    const H = m.t + 258, ih = H - m.t - m.b;
    const isF = metric === "followers", WEEK = 7 * 86400e3;
    const wk = isF ? [] : acct.filter(w => t(w.week) >= t0 - WEEK && t(w.week) <= t1 && mval(w, metric) != null)
      .map(w => ({ week: w.week, v: mval(w, metric), w }));
    const vals = isF ? fr.map(p => p.followers) : wk.map(w => w.v);
    const hiV = Math.max(1, ...vals), loV = Math.min(...vals);
    const lo = isF ? Math.max(0, loV - (hiV - loV) * 0.05) : Math.min(0, loV * 1.1), hi = isF ? hiV + (hiV - loV) * 0.08 : hiV * 1.1;
    const y = v => m.t + (hi - v) / (hi - lo) * ih;
    const step = [10, 25, 50, 100, 250, 500, 1e3, 2.5e3, 5e3, 1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7]
      .find(st => (hi - lo) / st <= 5) || 1e7;
    let grid = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line class="t-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="t-tick" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${isF && hi - lo < 20000 ? num(v) : kfmt(v)}</text>`;
    // Month ticks; the year shows on the first tick and on January.
    let xt = "";
    const first = new Date(t0), mon = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 1));
    const months = [];
    for (let d = mon; d.getTime() <= t1; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) months.push(d);
    const everyM = narrow ? 3 : months.length > 9 ? 2 : 1;
    months.forEach((d, i) => { if (i % everyM) return;
      const iso = d.toISOString().slice(0, 10);
      const lab = d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + (i === 0 || d.getUTCMonth() === 0 ? ` '${String(d.getUTCFullYear()).slice(2)}` : "");
      xt += `<text class="t-tick" x="${x(iso)}" y="${H - 8}" text-anchor="middle">${lab}</text>`; });
    const eras = state.agg.eras || [];
    const markSvg = lane.map(mk => {
      const px = mk.px, anchor = mk.right ? "start" : "end", dx = mk.right ? 8 : -8, up = mk.row * LANE_ROW;
      return `<line class="t-mark" x1="${px}" x2="${px}" y1="${m.t - 10 - up}" y2="${m.t + ih}"/>
      <circle class="f-mark" cx="${px}" cy="${m.t - 10 - up}" r="3.5"/>
      ${narrow ? "" : `<text class="f-mark-name halo" x="${px + dx}" y="${m.t - 28 - up}" text-anchor="${anchor}">${esc(mk.label)}</text>`}
      <text class="f-mark-date halo" x="${px + dx}" y="${m.t - 14 - up}" text-anchor="${anchor}">${fmtD(mk.date)}</text>`; }).join("");
    const e0 = eras[0];
    const band = e0 && e0.until && t(e0.until) > t0
      ? (() => { const bx = e0.first && t(e0.first) > t0 ? x(e0.first) : m.l;
          const bw = Math.min(x(e0.until), W - m.r) - bx;
          return `<rect class="t-band" x="${bx}" y="${m.t}" width="${bw}" height="${ih}"/>${bw > 150
            ? `<text class="f-mark-date" x="${bx + bw / 2}" y="${m.t + 18}" text-anchor="middle">${esc(e0.label)}</text>` : ""}`; })() : "";
    // Single-day jumps of 10k+ (consecutive days merged), labelled on the line.
    const jumps = [];
    fr.forEach((p, i) => { if (!i) return; const g = p.followers - fr[i - 1].followers;
      if (g < 10000) return;
      const last = jumps[jumps.length - 1];
      if (last && t(p.date) - t(last.to) <= 86400e3) { last.to = p.date; last.gain += g; last.top = p; }
      else jumps.push({ from: p.date, to: p.date, gain: g, top: p }); });
    const jumpSvg = jumps.map(j => `<circle class="f-jump" cx="${x(j.top.date)}" cy="${y(j.top.followers)}" r="4"/>
      <text class="t-band-label halo" x="${x(j.top.date) - 8}" y="${y(j.top.followers) + 4}" text-anchor="end">+${kfmt(j.gain)}${narrow ? "" : " " + (j.from === j.to ? fmtD(j.from) : fmtD(j.from) + "–" + fmtD(j.to).replace(/^\w+ /, ""))}</text>`).join("");
    const lp = fr[fr.length - 1];
    const isoAdd = (d, days) => new Date(t(d) + days * 86400e3).toISOString().slice(0, 10);
    const fmtY = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    // The data marks: the follower line with its jumps and end value, or one bar per Monday week.
    const marksData = isF
      ? `<path class="t-line" d="${fr.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.followers).toFixed(1)}`).join("")}"/>${jumpSvg}
         <text class="t-end" x="${x(lp.date) + 8}" y="${y(lp.followers) + 4}">${kfmt(lp.followers)}</text>`
      : wk.map(w => { const xa = Math.max(m.l, x(w.week)), xb = Math.min(W - m.r, x(isoAdd(w.week, 7)));
          return `<rect class="a-col${w.v < 0 ? " neg" : ""}" x="${xa + 1}" y="${Math.min(y(w.v), y(0))}" width="${Math.max(1, xb - xa - 2)}" height="${Math.max(1, Math.abs(y(0) - y(w.v)))}" rx="2"/>`; }).join("")
        + (lo < 0 ? `<line class="t-zero" x1="${m.l}" x2="${W - m.r}" y1="${y(0)}" y2="${y(0)}"/>` : "");
    // Hover: the nearest day (followers) or week (bars) gets a crosshair, dot and tooltip.
    const hoverPts = isF
      ? fr.map((p, i) => ({ cx: x(p.date), cy: y(p.followers), html: `<b>${fmtY(p.date)}</b><div>${num(p.followers)} followers</div>
          ${i ? `<div>${p.followers - fr[i - 1].followers >= 0 ? "+" : "−"}${num(Math.abs(p.followers - fr[i - 1].followers))} that day</div>` : ""}
          <div class="bl">${SRC_LABEL[p.source] || "Counted by the pipeline"}</div>` }))
      : wk.map((w, i) => { const prev = wk[i - 1], posts = w.w.posts, impr = w.w.impressions;
          const chg = prev && prev.v > 0 && w.v >= 0 ? Math.round((w.v / prev.v - 1) * 100) : null;
          return { cx: (Math.max(m.l, x(w.week)) + Math.min(W - m.r, x(isoAdd(w.week, 7)))) / 2, cy: y(w.v),
          html: `<b>Week of ${fmtY(w.week)}</b><div>${metric === "net_follows" && w.v > 0 ? "+" : ""}${num(w.v)} ${metricLabel.toLowerCase()}</div>
            ${PER_POST.has(metric) && posts ? `<div>${(w.v / posts).toLocaleString("en-US", { maximumFractionDigits: w.v / posts < 10 ? 1 : 0 })} per post</div>` : ""}
            ${OF_IMPR.has(metric) && impr ? `<div>${(w.v / impr * 100).toFixed(2)}% of impressions</div>` : ""}
            ${chg != null ? `<div>${chg >= 0 ? "+" : "−"}${Math.abs(chg)}% on the week before</div>` : ""}
            <div class="bl">From ${acctFrom}</div>` }; });
    const hitsF = `<line class="t-cross hidden" y1="${m.t}" y2="${m.t + ih}"/><circle class="f-dot hidden" r="4"/>
      <rect class="t-hit f-hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/>`;
    state.folHover = { pts: hoverPts, m, W };
    const firstCounted = (fr.find(p => !p.source) || lp).date;
    const jumpGain = jumps.reduce((s2, j) => s2 + j.gain, 0), total = lp.followers - fr[0].followers;
    // Short form unless both ends round to the same thing (only a few days counted).
    const fmtF = v => kfmt(fr[0].followers) === kfmt(lp.followers) ? num(v) : kfmt(v);
    folLead = `<section class="lead"><div class="eyebrow">RotoWire followers</div>
      <h2><span class="from">${fmtF(fr[0].followers)}</span><span class="arrow" aria-label="to">→</span><span class="to">${fmtF(lp.followers)}</span></h2>
      <p>Since ${fmtY(fr[0].date)}${jumps.length && total > 0 ? `; ${Math.round(jumpGain / total * 100)}% of the gain came on ${jumps.length === 1 ? "one jump" : jumps.length + " jumps"} marked on the chart` : ""}.</p></section>`;
    const note = isF
      ? (fr[0].source === "sprout"
        ? `Daily counts from Sprout Social up to ${fmtD(firstCounted)}, then counted by the pipeline.`
        : fr[0].source === "x_analytics"
        ? `Daily, from RotoWire's X Analytics export (new follows minus unfollows, walked back from the first real count) up to ${fmtD(firstCounted)}, then counted by the pipeline.`
        : `Counted once a day since ${fmtD(fr[0].date)}.`)
      : `${DEF[metric] ? DEF[metric] + " " : ""}Weekly totals for the whole account (Monday weeks, complete weeks only), from ${acctFrom}.`;
    folPanel = `<div class="panel a-panel"><div class="trend-head"><div><h3>RotoWire ${metricLabel.toLowerCase()} over time</h3>
      <p class="type-note">${note}</p></div>
      ${ACCT_METRICS.length > 1 ? `<div class="acct-pick"><div class="seg acct-seg" role="group" aria-label="Metric group">${ACCT_GROUPS.map(([g, ms]) =>
        `<button type="button" data-k="${(g === group[0] ? ms.find(([k]) => k === metric) : ms[0])[0]}" class="${g === group[0] ? "on" : ""}" aria-pressed="${g === group[0]}">${g}</button>`).join("")}</div>
        ${group[1].length > 1 ? `<div class="seg-chips acct-chips" role="group" aria-label="${group[0]} metric">${group[1].map(([k, l]) =>
        `<button type="button" data-k="${k}" class="${k === metric ? "on" : ""}" aria-pressed="${k === metric}">${l}</button>`).join("")}</div>` : ""}</div>` : ""}</div>
      <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="RotoWire ${metricLabel.toLowerCase()} over time">
        ${band}${grid}${xt}${markSvg}${marksData}${hitsF}</svg><div class="t-tip hidden"></div></div>
      ${jump && metric === "impressions" ? `<p class="a-flag">Week of ${fmtD(jump.w.week)}: median views per news post jumped from ${kfmt(jump.p.rotowire_median_views)} to
        ${kfmt(jump.w.rotowire_median_views)} and stayed up. Worth confirming why before quoting these numbers.</p>` : ""}</div>`;
  }

  el.innerHTML = folPanel ? `${folLead}<div class="a-grid one">${folPanel}</div>` : "";
  wireFollowerHover(el);
  el.querySelectorAll(".acct-seg button, .acct-chips button").forEach(b => b.onclick = () => { state.acctMetric = b.dataset.k; renderAudience(); });
  applyTopMode();
}

// Tooltip on the account chart: the nearest day (followers) or week (bars), built in renderAudience.
function wireFollowerHover(root) {
  const fh = state.folHover, hit = root.querySelector(".f-hit");
  if (!fh || !hit) return;
  const svg = hit.ownerSVGElement, plot = svg.parentElement;
  const tip = plot.querySelector(".t-tip"), cross = svg.querySelector(".t-cross"), dot = svg.querySelector(".f-dot");
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let p = fh.pts[0], best = Infinity;
    fh.pts.forEach(q => { const d = Math.abs(q.cx - px); if (d < best) { best = d; p = q; } });
    cross.setAttribute("x1", p.cx); cross.setAttribute("x2", p.cx); cross.classList.remove("hidden");
    dot.setAttribute("cx", p.cx); dot.setAttribute("cy", p.cy); dot.classList.remove("hidden");
    tip.innerHTML = p.html;
    tip.classList.remove("hidden");
    tip.style.left = Math.min(Math.max(p.cx - tip.offsetWidth / 2, 0), fh.W - tip.offsetWidth) + "px";
    tip.style.top = (fh.m.t + 6) + "px";
  };
  const hide = () => { tip.classList.add("hidden"); cross.classList.add("hidden"); dot.classList.add("hidden"); };
  hit.addEventListener("mousemove", show);
  hit.addEventListener("touchstart", show, { passive: true });
  hit.addEventListener("touchmove", show, { passive: true });
  hit.addEventListener("mouseleave", hide);
}

// ---- tabs + init ----
function showView(name) {
  if (name === "types" && !(state.agg.news_types || {}).types?.length) name = "feed";
  if (name === "hours" && !(state.agg.hours || []).length) name = "feed";
  if (name === "staff" && !((state.agg.staffing || {}).days || []).length) name = "feed";
  if (name === "games" && !((state.agg.game_windows || {}).windows || []).length) name = "feed";
  if (name === "practice" && !state.agg.practice) name = "feed";
  if (name === "focus") name = "archive";
  state.view = name;
  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.view === name;
    t.classList.toggle("active", on); t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
    t.setAttribute("aria-controls", "view-" + t.dataset.view); });
  VIEWS.forEach(v => {
    const sec = document.getElementById("view-" + v);
    sec.classList.toggle("hidden", v !== name); sec.setAttribute("role", "tabpanel"); });
  // A group label with none of its tabs showing (a sport without that data) is hidden too.
  document.querySelectorAll(".tab-group").forEach(g => {

    // Arrow keys move between visible tabs (WAI-ARIA tabs pattern).
    document.getElementById("tabs").addEventListener("keydown", e => {
      const tabs = [...document.querySelectorAll(".tab:not(.hidden)")];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      const j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (j == null) return;
      e.preventDefault();
      const t = tabs[(j + tabs.length) % tabs.length];
      showView(t.dataset.view); t.focus();
    });
    document.getElementById("tabs").addEventListener("scroll", updateTabFade, { passive: true });
    window.addEventListener("resize", updateTabFade);
    state.wired = true;
  }

  renderFeed();
  // Sports with a season calendar (NFL: Tue-Mon weeks) roll up by season week instead of ISO week.
  const seasonWeeks = (state.agg.season_weeks || []).map(r => ({ ...r,
    period: r.start ? `${r.period} · ${fmtWeekRange(r.start, r.end)}` : `${r.period} · thru ${fmtWeekRange(r.end)}` }));
  renderRollup(document.getElementById("view-weekly"), seasonWeeks.length ? seasonWeeks : (state.agg.weekly || []), "week");
  renderRollup(document.getElementById("view-monthly"), state.agg.monthly || [], "month");
  renderTypes();
  renderHours();
  renderStaff();
  renderGames();
  renderPractice();
  renderAudience();
  renderFocus();
  renderCustom();
  renderGaps();
  renderDups();
  if (state.sport !== ALL) showView(state.view || defaultView());
}

// ---------------------------------------------------------------- Desk Speed
// Our time from the source tweet to our post against the gap to Underdog on stories both
// accounts posted. Gaps are per story (our post minus theirs), so cutting S seconds from
// every post lowers each gap by S, and the share we'd post first is the share of gaps below S.
// Three views: all posts, posts sent from a Monitor tweet (split into the desk's three
// steps), and posts added by hand (News Admin's Add Line), which have no steps to split.
const DK_STEPS = [
  { key: "sent_to_monitor", c: "s1", name: "Sent to in Monitor",
    lever: "Faster ingestion, or editors pulling a tweet in by link" },
  { key: "monitor_to_open", c: "s2", name: "In Monitor to opened",
    lever: "Finding the tweet: alerts, paste-a-link" },
  { key: "open_to_x", c: "s3", name: "Opened to on X",
    lever: "Templates: a draft good enough to post untouched" },
];
const DK_PATHS = [["all", "All posts"], ["monitor", "From Monitor"], ["manual", "Added by hand"]];
const dk = { sim: false, cut: [0, 0, 0], days: "key", path: "all" };
const dkFmt = v => { v = Math.round(v); const a = Math.abs(v), m = Math.floor(a / 60), r = a % 60;
  return (v < 0 ? "-" : "") + (m ? `${m}:${String(r).padStart(2, "0")}` : `${r}s`); };
const dkNS = "http://www.w3.org/2000/svg";
// A smooth line through points without overshooting them (monotone cubic, Fritsch-Carlson),
// so a curve never dips below 0% or invents a peak the data doesn't have.
function dkSmooth(p) {
  if (p.length < 3) return p.map((q, i) => `${i ? "L" : "M"}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join("");
  const n = p.length, dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; m[i] = (p[i + 1][1] - p[i][1]) / (dx[i] || 1); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : 3 * (dx[i - 1] + dx[i]) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) { const h = dx[i] / 3;
    d += `C${(p[i][0] + h).toFixed(1)},${(p[i][1] + t[i] * h).toFixed(1)} ${(p[i + 1][0] - h).toFixed(1)},${(p[i + 1][1] - t[i + 1] * h).toFixed(1)} ${p[i + 1][0].toFixed(1)},${p[i + 1][1].toFixed(1)}`; }
  return d;
}
function dkEl(tag, attrs, parent) { const e = document.createElementNS(dkNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  if (!tip) { tip = document.createElement("div"); tip.id = "dk-tip"; tip.className = "dk-tip"; document.body.appendChild(tip); }
  node.addEventListener("pointermove", e => { tip.innerHTML = html; tip.classList.add("on");
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px"; });

// Bar segments for a path: Monitor posts split into steps (or In Monitor + the rest until
// opens are tracked enough); hand-added posts are one span from the source tweet.
function dkSegs(paths, kind) {
  if (kind === "manual") { const f = paths.manual.from_source;
    return f.median == null ? [] : [{ c: "hand", name: "Source tweet to on X, added by hand", v: f.median, n: f.n }]; }
  const st = paths.monitor.steps;
  if (st.split) return DK_STEPS.map(d => ({ c: d.c, name: d.name, v: st[d.key].median, n: st[d.key].n }));
  return [{ c: "s1", name: "Sent to in Monitor", v: st.sent_to_monitor.median, n: st.sent_to_monitor.n },

}
const dkSum = segs => segs.reduce((a, x) => a + (x.v || 0), 0);

// One horizontal bar: segments stacked, a dashed break-even mark where we'd post first on
// half the shared stories, and (optionally) the stretch past it bracketed as the gap.
function dkBar(svg, W, segs, gap, opts) {
  const narrow = W < 560, labelW = opts.label ? (narrow ? 64 : 150) : 0, rowH = opts.rowH || 30, y = opts.top || 0;
  const tot = dkSum(segs), even = tot - gap;
  const x = v => labelW + (Math.max(0, v) / opts.max) * (W - labelW - 48);
  if (opts.label) { const t = dkEl("text", { x: 0, y: y + rowH / 2 + 4, fill: "#e6edf3", "font-weight": 600 }, svg);
    t.textContent = narrow ? opts.short || opts.label : opts.label; }
  let acc = 0;
  segs.forEach((sg, i) => {
    const x0 = x(acc) + (i ? 1 : 0), x1 = x(acc + sg.v) - (i < segs.length - 1 ? 1 : 0);
    const r = dkEl("rect", { x: x0, y, width: Math.max(0, x1 - x0), height: rowH, rx: 4, fill: `var(--${sg.c})` }, svg);
    dkTip(r, `<b>${esc(sg.name)}</b> ${dkFmt(sg.v)} <span>median · n=${sg.n}</span>`);
    if (!opts.small && x1 - x0 > 34) { const t = dkEl("text", { x: (x0 + x1) / 2, y: y + rowH / 2 + 4, "text-anchor": "middle",
      fill: "#0f1419", "font-weight": 650 }, svg); t.textContent = dkFmt(sg.v); t.style.pointerEvents = "none"; }
    acc += sg.v;
  });
  dkEl("text", { x: x(acc) + 6, y: y + rowH / 2 + 4, fill: "#e6edf3", "font-weight": 650 }, svg).textContent = dkFmt(acc);
  if (gap > 0) {
    dkEl("line", { x1: x(even), x2: x(even), y1: y - 5, y2: y + rowH + 5, stroke: "var(--red)", "stroke-width": 2, "stroke-dasharray": "4 3" }, svg);
    const hit = dkEl("rect", { x: x(even) - 8, y: y - 5, width: 16, height: rowH + 10, fill: "transparent" }, svg);
    dkTip(hit, `<b>Break-even ${dkFmt(Math.max(0, even))}</b><br><span>Post this fast and we're first on half the stories both accounts posted.</span>`);
    if (opts.bracket) { const by = y + rowH + 12;
      dkEl("path", { d: `M${x(even)},${by} v4 H${x(acc)} v-4`, fill: "none", stroke: "#8b98a5" }, svg);
      dkEl("text", { x: (x(even) + x(acc)) / 2, y: by + 17, fill: "#8b98a5", "text-anchor": "middle" }, svg).textContent = `${dkFmt(gap)} to make up`; }
  }

}

    const ln = dkEl("line", { x1: x(t), x2: x(t), y1: 0, y2: y - 14, stroke: "#2d3743" }, svg);
    svg.insertBefore(ln, svg.firstChild);
    dkEl("text", { x: x(t), y, fill: "#8b98a5", "text-anchor": "middle" }, svg).textContent = dkFmt(t);
  }
}

// How often editors change the AI's X post draft and by how much, day by day, with a

const ed = { more: false, mode: (() => { try { return localStorage.getItem("ed-mode") || "roll"; } catch (e) { return "roll"; } })() };

function edChart(host, days, series, opts) {

  const x = i => L + (days.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (days.length - 1));
  const y = v => T + (1 - v / opts.max) * (H - T - B);
  opts.ticks.forEach(t => { dkEl("line", { x1: L, x2: W - R, y1: y(t), y2: y(t), stroke: "#2d3743" }, svg);
    dkEl("text", { x: L - 6, y: y(t) + 4, fill: "#8b98a5", "text-anchor": "end" }, svg).textContent = opts.fmt(t); });
  const every = Math.max(1, Math.ceil(days.length / (narrow ? 5 : 10)));

    dkEl("text", { x: x(i), y: H - 6, fill: "#8b98a5", "text-anchor": "middle" }, svg).textContent = edDay(d.day); });

    dkEl("line", { x1: x(i), x2: x(i), y1: T - 6, y2: H - B, stroke: "#8b98a5", "stroke-dasharray": "2 3" }, svg);
    if (!narrow || mk.big) dkEl("text", { x: x(i) + 3, y: T - 8, fill: "#8b98a5" }, svg).textContent = mk.label; });
  if (opts.shadeUntil) { const i = days.findIndex(d => d.day >= opts.shadeUntil);
    if (i > 0) { dkEl("rect", { x: L, y: T, width: x(i) - L, height: H - T - B, fill: "#ffffff", opacity: 0.025 }, svg);
      dkEl("text", { x: L + 6, y: H - B - 6, fill: "#8b98a5" }, svg).textContent = "drafts rebuilt, may overstate edits"; } }

function applySpeedTab() {
  const tabs = document.getElementById("pagetabs");
  if (!tabs) return;
  if (!state.speedTab) { try { state.speedTab = localStorage.getItem("pst-tab") || "sum"; } catch (e) { state.speedTab = "sum"; } }
  const on = state.sport !== ALL && !!(state.desk && state.desk.summary) && !document.body.classList.contains("page-audience");
  tabs.classList.toggle("hidden", !on);
  const tab = ["sum", "det", "road"].includes(state.speedTab) ? state.speedTab : "sum";
  document.body.classList.toggle("sp-sum", on && tab === "sum");
  document.body.classList.toggle("sp-det", on && tab === "det");
  document.body.classList.toggle("sp-road", on && tab === "road");
  tabs.querySelectorAll("button").forEach(b => {
    const sel = b.dataset.t === tab;
    b.classList.toggle("on", sel); b.setAttribute("aria-selected", sel);
    b.onclick = () => {

addEventListener("resize", () => { clearTimeout(window._smResize); window._smResize = setTimeout(() => { if (state.desk && document.body.classList.contains("sp-sum")) renderSummary(); }, 150); });

// ---------------------------------------------------------------- Roadmap
// The whole initiative from Jira: each epic and every ticket under it. Prioritized means
// assigned to the dev and in an open sprint (that sprint's commitment); the rest is backlog.
const rmCls = c => ({ done: "done", indeterminate: "prog", new: "todo" }[c] || "todo");
const rmSprint = sp => { const d = x => x ? smDay(x.slice(0, 10)) : "?"; return `${esc(sp.name)} · ${d(sp.start)}–${d(sp.end)}`; };
// Sprint tables: highest priority first, then work in flight above work not started, done last.
const RM_PRI = { Highest: 0, High: 1, Medium: 2, Low: 3, Lowest: 4 };
const RM_ST = { "In Progress": 0, "In Review": 1, "Ready for Release": 2, "Ready for Work": 3, "Ready for Estimation": 4, "In Refinement": 5 };
const rmStRank = t => t.category === "done" ? 9 : RM_ST[t.status] ?? (t.category === "indeterminate" ? 2 : 6);
const rmOrder = ts => [...ts].sort((a, b) => (RM_PRI[a.priority] ?? 5) - (RM_PRI[b.priority] ?? 5) || rmStRank(a) - rmStRank(b) || a.key.localeCompare(b.key, undefined, { numeric: true }));
// Desk Google Sheets from config.yaml sheets; link by key next to the section it belongs to.
function sheetLink(key, text) {
  const sh = ((state.desk || {}).sheets || []).find(x => x.key === key);
  return sh ? `<a href="${esc(sh.url)}" target="_blank" rel="noopener">${esc(text || sh.title)}</a>` : "";
}
function renderRoad() {

    <td><span class="pill ${rmCls(t.category)}">${esc(t.status)}</span></td><td class="lbl">${esc(t.priority || "")}</td></tr>`;
  const li = t => `<li><a href="${t.url}" target="_blank" rel="noopener">${t.key}</a><span class="pill ${rmCls(t.category)}">${esc(t.status)}</span><span>${esc(t.summary)}${t.assignee && t.assignee !== I.assignee ? ` <span class="lbl">· ${esc(t.assignee)}</span>` : ""}</span></li>`;
  const epic = e => `<div class="sm-card rm-ep"><h3><a href="${e.url}" target="_blank" rel="noopener">${e.key}</a> ${esc(e.summary)}</h3>
    <div class="meta"><span class="pill ${rmCls(e.category)}">${esc(e.status)}</span> · ${e.prioritized.length} prioritized · ${e.backlog.length} in backlog · ${e.done.length} done</div>
    ${e.prioritized.length ? `<ul class="rm-list">${e.prioritized.map(t => li({ ...t, status: t.status + " · " + t.sprint.replace(/^\d{4}\.Q\d\./, "") })).join("")}</ul>` : `<div class="lbl">Nothing prioritized in an open sprint.</div>`}
    ${e.backlog.length ? `<details><summary>Backlog (${e.backlog.length})</summary><ul class="rm-list">${e.backlog.map(li).join("")}</ul></details>` : ""}
    ${e.done.length ? `<details><summary>Done (${e.done.length})</summary><ul class="rm-list">${e.done.map(li).join("")}</ul></details>` : ""}</div>`;
  host.innerHTML = `<div class="rm-head"><h2><a href="${I.url}" target="_blank" rel="noopener">${esc(I.root)}</a> ${esc(I.label || "")}</h2>
    <p>Every epic in the initiative and every ticket under it. <b style="color:var(--text)">Prioritized</b> means assigned to ${esc(I.assignee || "the dev")} and in an open sprint: that sprint's commitment. Everything else not done is backlog.${I.fetched_at ? ` From Jira as of ${esc(fmtTime(I.fetched_at))}.` : ""}</p></div>
    <div class="rm-sprints">${I.sprints.map(sp => { const n = pri.filter(t => t.sprint === sp.name);
      return `<div class="sm-card rm-sp"><div class="lbl">${sp.state === "active" ? "Current sprint" : "Next sprint"} · ${rmSprint(sp)}</div><div class="n">${n.length}</div>
        <div class="lbl">prioritized · ${n.filter(t => t.category === "indeterminate").length} in progress · ${n.filter(t => t.category === "new").length} not started</div></div>`; }).join("")}
      <div class="sm-card rm-sp"><div class="lbl">Backlog</div><div class="n">${back}</div><div class="lbl">not done, not in an open sprint</div></div></div>
    ${I.sprints.map(sp => { const n = rmOrder(pri.filter(t => t.sprint === sp.name)); return n.length ? `<h2 class="sm-h">${sp.state === "active" ? "Current sprint" : "Next sprint"}: ${esc(sp.name)}</h2>
      <div class="sm-card scroll" style="overflow-x:auto"><table class="rm-tbl"><thead><tr><th>Ticket</th><th>What · epic</th><th>Status</th><th>Priority</th></tr></thead><tbody>${n.map(row).join("")}</tbody></table></div>` : ""; }).join("")}
    ${(state.desk.sheets || []).some(sh => sh.list !== false) ? `<h2 class="sm-h">Working sheets</h2>
    <div class="rm-sheets">${state.desk.sheets.filter(sh => sh.list !== false).map(sh => `<div class="sm-card"><a href="${esc(sh.url)}" target="_blank" rel="noopener"><b>${esc(sh.title)}</b></a><div class="lbl" style="margin-top:4px">${esc(sh.what)}</div>${(sh.tabs || []).length ? `<ul class="rm-tabs">${sh.tabs.map(t => `<li><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a><span class="lbl">${esc(t.what)}</span></li>`).join("")}</ul>` : ""}</div>`).join("")}</div>` : ""}
    <h2 class="sm-h">By epic</h2>

}

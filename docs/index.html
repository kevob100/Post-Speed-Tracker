<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post-Speed Tracker — RotoWire vs Underdog</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --panel2: #222b36; --line: #2d3743;
    --text: #e6edf3; --muted: #8b98a5; --green: #2ea043; --red: #e5534b;
    --accent: #4493f8; --chip: #2d3743;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 20px 24px 8px; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }

  /* sport switcher */
  .sports { display: flex; gap: 6px; margin: 12px 0 4px; flex-wrap: wrap; }
  .sport-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .sport-btn:hover { color: var(--text); }
  .sport-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .wrap { padding: 0 24px 48px; max-width: 1200px; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 20px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 4px; }
  .kpi .value small { font-size: 13px; color: var(--muted); font-weight: 400; }

  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
    overflow-x: auto; scrollbar-width: none; }
  .tab { padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; user-select: none;
    white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: end; }
  .filters label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .filters input, .filters select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }

  #feed-wrap, #all-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  td.story { white-space: normal; min-width: 200px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; }
  th[data-nosort] { cursor: default; }
  th.sorted::after { content: " ▾"; color: var(--accent); }
  th.sorted.asc::after { content: " ▴"; }
  tbody tr:hover { background: var(--panel); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.rw { background: rgba(46,160,67,.15); color: var(--green); }
  .badge.ud { background: rgba(229,83,75,.15); color: var(--red); }
  .delta.pos { color: var(--green); } .delta.neg { color: var(--red); }
  .chip { background: var(--chip); color: var(--muted); padding: 1px 7px; border-radius: 999px; font-size: 11px; }
  .chip.role-followup { background: rgba(88,166,255,.15); color: var(--accent); }
  .chip.role-original { background: var(--chip); color: var(--muted); }
  .status-confirmed { color: var(--green); } .status-rejected { color: var(--red); }
  .status-merged { color: var(--accent); } .status-pending { color: var(--muted); }

  .empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px; }
  .hidden { display: none; }

  /* trend bars */
  .bars { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 18px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 48px; align-items: center; gap: 10px; font-size: 12px; }
  .bar-track { background: var(--panel2); border-radius: 5px; height: 16px; overflow: hidden; }
  .bar-fill { background: var(--green); height: 100%; }
  .cov { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .cov h3 { font-size: 13px; margin: 0 0 6px; color: var(--muted); }
  .cov li { margin: 4px 0; }

  /* by news type grid */
  .type-note { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
  .type-wrap { overflow-x: auto; }
  .type-grid { border-collapse: separate; border-spacing: 2px; }
  .type-grid th, .type-grid td { border-bottom: 0; }
  .type-grid th.type-name { color: var(--text); font-weight: 400; font-size: 14px; cursor: default; padding-left: 0; }
  /* keep the type names visible while the weeks scroll sideways on a phone */
  .type-grid th:first-child { position: sticky; left: 0; z-index: 1; background: var(--bg); }
  .type-grid thead th { vertical-align: bottom; cursor: default; }
  .type-grid th.wk { text-align: center; }
  .type-grid .wk-note { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); }
  .type-grid th.season { border-left: 2px solid var(--line); }
  .type-cell { padding: 0; min-width: 104px; height: 50px; }
  .type-cell > div, .type-cell > button { display: flex; flex-direction: column; justify-content: center;
    align-items: center; width: 100%; height: 100%; border-radius: 4px; }
  .type-cell > button { border: 0; font: inherit; cursor: pointer; padding: 0; }
  .type-cell > button:hover { outline: 1px solid var(--muted); }
  .type-cell > button:focus-visible, .type-cell.picked > button { outline: 2px solid var(--accent); outline-offset: 1px; }
  .type-cell .pct { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .type-cell .meta { font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
  .type-cell.low > button, .hatch-key { background-image: repeating-linear-gradient(45deg, transparent 0 5px,
    rgba(255,255,255,.08) 5px 7px); }
  .type-cell.empty-cell > div { color: var(--muted); background: var(--panel); }
  .type-cell.season { border-left: 2px solid var(--line); padding-left: 4px; }
  .type-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 11.5px;
    color: var(--muted); margin-top: 12px; }
  .type-legend .ramp { display: inline-flex; gap: 2px; }
  .type-legend .ramp i { width: 26px; height: 10px; border-radius: 2px; }
  .hatch-key { display: inline-block; width: 26px; height: 10px; border-radius: 2px; margin-left: 10px;
    background-color: var(--panel2); }

  .legend-hint { margin-left: auto; }
  #type-examples { margin-top: 20px; }
  .examples-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; }
  .examples-head h3 { font-size: 14px; margin: 0; }
  .examples-head span { color: var(--muted); font-size: 12px; }
  table.examples td { vertical-align: top; }
  table.examples td.story { min-width: 260px; }
  .who-tag { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--muted); margin-right: 6px; }
  .muted-sm { color: var(--muted); font-size: 11px; }

  /* by time of day */
  .hours { display: grid; grid-template-columns: 70px repeat(24, minmax(26px, 1fr)); gap: 2px;
    align-items: end; min-width: 760px; }
  .hlab { color: var(--muted); font-size: 11px; align-self: center; }
  .hcol { display: flex; flex-direction: column; justify-content: flex-end; }
  .hcol.down { justify-content: flex-start; }
  .hcol .hbar { width: 100%; background: var(--green); border-radius: 3px 3px 0 0; }
  .hcol.down .hbar { background: var(--red); border-radius: 0 0 3px 3px; }
  .hzero { grid-column: 2 / -1; height: 1px; background: var(--muted); opacity: .5; }
  .hcell { height: 42px; border-radius: 3px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 8px; }
  .hcell span { font-size: 10px; opacity: .85; }
  .hcell.none { background: var(--panel); color: var(--muted); }
  .hcell.low { background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255,255,255,.08) 5px 7px); }
  .htick { color: var(--muted); font-size: 10.5px; text-align: center; }
  .key-sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .key-sw.rw { background: var(--green); } .key-sw.ud { background: var(--red); margin-left: 10px; }
  .hours-table { margin-top: 14px; }

  /* by staff: shift strip (who held each role, hour by hour) + people table */
  .seg-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg-chips button { background: var(--panel); color: var(--muted); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
  .seg-chips button:hover { color: var(--text); }
  .seg-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .strip { display: grid; gap: 3px; min-width: 760px; }
  .strip .s-lab { color: var(--muted); font-size: 11.5px; align-self: center; padding-right: 6px; }
  .strip .s-span { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    font-size: 11.5px; padding: 5px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip .s-cell { height: 52px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 12.5px; cursor: pointer; color: var(--text); font: inherit; padding: 0; }
  .strip .s-cell b { font-size: 13px; }
  .strip .s-cell span { font-size: 10px; opacity: .85; }
  .strip .s-cell.on { outline: 2px solid var(--accent); outline-offset: 1px; }
  .strip .s-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .strip .s-tick { font-size: 10.5px; color: var(--muted); text-align: center; }
  .small-n { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .bl { color: var(--muted); font-size: 11.5px; }
  tr.gw-row.on td { background: var(--panel2); }
  .hours-table summary { color: var(--accent); cursor: pointer; font-size: 12.5px; margin-bottom: 8px; }

  /* trend chart */
  .trend { padding: 14px; margin: 0 0 20px; }
  .trend-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 16px; align-items: flex-start; }
  .trend-head h3 { font-size: 14px; margin: 0 0 2px; }
  .trend-head p { color: var(--muted); font-size: 12.5px; margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: inherit;
    font-size: 12.5px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .trend-plot { position: relative; margin-top: 10px; }
  .trend-plot svg { display: block; max-width: 100%; }
  .t-grid { stroke: var(--line); stroke-width: 1; }
  .t-zero { stroke: var(--muted); stroke-width: 1.5; }
  .t-tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .t-side { fill: var(--muted); font-size: 10.5px; }
  .t-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .t-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
  .t-dot.faint { fill: var(--muted); opacity: .55; stroke-width: 1; }
  .t-dot.hollow { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
  .t-dot.faint.hollow { stroke: var(--muted); }
  .t-dot.clipped { opacity: .9; stroke: var(--text); stroke-width: 1; }
  .t-end { fill: var(--text); font-size: 12px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .t-mark { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 3; opacity: .6; }
  .t-mark-label { fill: var(--text); font-size: 11px; font-weight: 600; }
  .t-cross { stroke: var(--muted); stroke-dasharray: 3 3; }
  .t-hit { fill: transparent; }
  .t-tip { position: absolute; top: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; pointer-events: none; white-space: nowrap; }
  .t-tip b { display: block; margin-bottom: 2px; }

  /* ALL overview */
  .all-title { font-size: 15px; margin: 4px 0 12px; color: var(--muted); }
  #view-all table tbody tr.sport-row { cursor: pointer; }
  #view-all table tbody tr.sport-row:hover { background: var(--panel); }
  #view-all td.sport-name { font-weight: 650; }
  #view-all tr.total-row td {
    border-top: 2px solid var(--accent); border-bottom: 2px solid var(--line);
    font-weight: 700; background: var(--panel);
  }
  #view-all tr.total-row td.sport-name { color: var(--accent); }
  .go { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Post-Speed Tracker</h1>
  <div class="sub" id="subtitle">RotoWire vs Underdog — news-speed comparison.
    <span id="generated"></span></div>
  <div class="sports" id="sport-switcher"></div>
</header>
<div class="wrap">
  <!-- ALL-sports overview (shown when the ALL pill is selected) -->
  <section id="view-all" class="hidden"></section>

  <!-- Per-sport views (shown when a single sport is selected) -->
  <div class="kpis" id="kpis"></div>
  <section class="panel trend" id="trend"></section>

  <div class="tabs" id="tabs">
    <div class="tab active" data-view="feed">Story Feed</div>
    <div class="tab" data-view="weekly">Weekly</div>
    <div class="tab hidden" data-view="types" id="tab-types">By news type</div>
    <div class="tab hidden" data-view="hours" id="tab-hours">By time of day</div>
    <div class="tab hidden" data-view="staff" id="tab-staff">By staff</div>
    <div class="tab hidden" data-view="games" id="tab-games">During games</div>
    <div class="tab" data-view="monthly">Monthly</div>
    <div class="tab" data-view="custom">Custom</div>
    <div class="tab" data-view="gaps">Coverage Gaps</div>
    <div class="tab" data-view="dups">Follow-ups</div>
  </div>

  <section id="view-feed">
    <div class="filters">
      <label>From<input type="date" id="f-from"></label>
      <label>To<input type="date" id="f-to"></label>
      <label>Event<select id="f-event"></select></label>
      <label>Player<input type="text" id="f-player" placeholder="name…"></label>
      <label>Min confidence<input type="number" id="f-conf" min="0" max="1" step="0.05" style="width:80px"></label>
      <label>Status<select id="f-status">
        <option value="matched" selected>matched</option><option value="">all</option>
        <option>pending</option><option>confirmed</option>
        <option>rejected</option><option>merged</option></select></label>
    </div>
    <div id="feed-wrap"></div>
  </section>

  <section id="view-weekly" class="hidden"></section>
  <section id="view-types" class="hidden"></section>
  <section id="view-hours" class="hidden"></section>
  <section id="view-staff" class="hidden"></section>
  <section id="view-games" class="hidden"></section>
  <section id="view-monthly" class="hidden"></section>
  <section id="view-custom" class="hidden"></section>
  <section id="view-gaps" class="hidden"></section>
  <section id="view-dups" class="hidden"></section>
</div>

<script>
const ALL = "all";
const state = {
  stories: [], agg: null, sortKey: "time", sortAsc: false,
  sport: null, sportMeta: null, sportsIndex: [],
  allSummaries: null,   // [{key,label,summary}] when the ALL overview is loaded
  // Default handles; overridden per-sport from sports.json.
  handles: { rotowire: "RotoWireMLB", underdog: "UnderdogMLB" },
};

// Bootstrap: read the sports index, build the switcher, then load the chosen view.
async function boot() {
  const bust = "?_=" + Date.now();
  let index;
  try {
    index = await fetch("./data/sports.json" + bust, { cache: "no-store" }).then(r => r.json());
  } catch (e) {
    // Fallback for a single-sport (pre-index) deployment: assume MLB.
    index = { sports: [{ key: "mlb", label: "MLB",
      handles: { rotowire: "RotoWireMLB", underdog: "UnderdogMLB" } }] };
  }
  state.sportsIndex = index.sports || [];
  const keys = [ALL, ...state.sportsIndex.map(s => s.key)];
  // Opening the bare page always lands on ALL; an explicit #sport link (e.g. shared)
  // is still honored. We intentionally do NOT remember the last-viewed sport.
  const wanted = (location.hash || "").replace(/^#/, "") || ALL;
  const chosen = keys.includes(wanted) ? wanted : ALL;
  await select(chosen);
}

function renderSwitcher() {
  const el = document.getElementById("sport-switcher");
  if (!el) return;
  const pill = (key, label) =>
    `<div class="sport-btn${key === state.sport ? " active" : ""}" data-sport="${key}">${esc(label)}</div>`;
  el.innerHTML = pill(ALL, "ALL") + state.sportsIndex.map(s => pill(s.key, s.label)).join("");
  el.querySelectorAll(".sport-btn").forEach(btn =>
    btn.onclick = () => { if (btn.dataset.sport !== state.sport) select(btn.dataset.sport); });
}

// Route to either the ALL overview or a single sport.
async function select(key) {
  state.sport = key;
  history.replaceState(null, "", "#" + key);
  if (key === ALL) { await loadAll(); }
  else { await loadSport(key); }
  renderSwitcher();
}

async function loadSport(sport) {
  state.sportMeta = state.sportsIndex.find(s => s.key === sport) || null;
  if (state.sportMeta && state.sportMeta.handles) state.handles = state.sportMeta.handles;
  try {
    const bust = "?_=" + Date.now();
    const base = `./data/${sport}/`;
    const [s, a] = await Promise.all([
      fetch(base + "stories.json" + bust, { cache: "no-store" }).then(r => r.json()),
      fetch(base + "aggregates.json" + bust, { cache: "no-store" }).then(r => r.json()),
    ]);
    state.stories = s; state.agg = a;
  } catch (e) {
    state.stories = []; state.agg = { summary: {}, weekly: [], monthly: [] };
  }
  setMode(false);
  init();
}

// Fetch every sport's stories for the ALL overview (stories, not just aggregates, so
// the date filter can recompute each sport's totals over an arbitrary range).
async function loadAll() {
  const bust = "?_=" + Date.now();
  const rows = await Promise.all(state.sportsIndex.map(async s => {
    try {
      const stories = await fetch(`./data/${s.key}/stories.json` + bust, { cache: "no-store" })
        .then(r => r.json());
      return { key: s.key, label: s.label, stories, generated_at: s.generated_at };
    } catch (e) {
      return { key: s.key, label: s.label, stories: [], generated_at: s.generated_at };
    }
  }));
  state.allStories = rows;
  setMode(true);
  renderAll();
}

// Toggle between the ALL overview and the per-sport views.
function setMode(isAll) {
  document.getElementById("view-all").classList.toggle("hidden", !isAll);
  document.getElementById("kpis").classList.toggle("hidden", isAll);
  document.getElementById("trend").classList.toggle("hidden", isAll);
  document.getElementById("tabs").classList.toggle("hidden", isAll);
  if (isAll) {
    VIEWS.forEach(v =>
      document.getElementById("view-" + v).classList.add("hidden"));
  } else {
    showView(state.view || "feed");   // restore the active tab, one visible at a time
  }
}

const VIEWS = ["feed","weekly","types","hours","staff","games","monthly","custom","gaps","dups"];

// ---- formatting helpers ----
const pad = n => String(n).padStart(2, "0");
// Central Time (America/Chicago) — Intl handles CDT/CST daylight-saving automatically.
const _ctFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: "America/Chicago", month: "numeric", day: "numeric",
  hour: "2-digit", minute: "2-digit", hour12: false,
});
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(+d)) return "—";
  const p = Object.fromEntries(_ctFmt.formatToParts(d).map(x => [x.type, x.value]));
  return `${p.month}/${pad(p.day)} ${p.hour}:${p.minute} CT`;
}

// Date-filter boundaries in Central Time (matching the CT display), so filtering
// "8/14–8/15" excludes an 8/13-evening-CT post even though it's 8/14 in UTC.
const _ctOffsetMs = ms => {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Chicago", hour12: false, year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit",
  }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  const h = p.hour === "24" ? 0 : +p.hour;
  return Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second) - ms;
};
// Start (00:00 CT) of the given YYYY-MM-DD, as an epoch ms. null for empty input.
function ctDayStart(dateStr) {
  if (!dateStr) return null;
  const [y, m, d] = dateStr.split("-").map(Number);
  const utcMid = Date.UTC(y, m - 1, d);
  return utcMid - _ctOffsetMs(utcMid);
}
// Exclusive end (00:00 CT of the next day) of the given YYYY-MM-DD.
const ctDayEnd = dateStr => { const s = ctDayStart(dateStr); return s == null ? null : s + 86400000; };

// Tweet links: story sides carry tweet_id + the feed implies the handle.
// Handles are per-sport, sourced from sports.json into state.handles.
const tweetUrl = (handle, id) => `https://x.com/${handle}/status/${id}`;
function timeLink(handle, sideObj) {
  if (!sideObj || !sideObj.created_at) return "—";
  const label = fmtTime(sideObj.created_at);
  return sideObj.tweet_id
    ? `<a href="${tweetUrl(handle, sideObj.tweet_id)}" target="_blank" rel="noopener">${label}</a>`
    : label;
}
// Link arbitrary text to the tweet a story side refers to.
function textLink(handle, sideObj, text) {
  const label = esc(text || "—");
  return (sideObj && sideObj.tweet_id && text)
    ? `<a href="${tweetUrl(handle, sideObj.tweet_id)}" target="_blank" rel="noopener">${label}</a>`
    : label;
}
const hasMedia = t => /(https?:\/\/|t\.co\/)/.test(t || "");
// Classify a same-event duplicate as the original headline or a later follow-up,
// relative to the matched post on the SAME feed. Follow-ups that add a link/clip are
// flagged accordingly (RotoWire adds a story link; Underdog adds a video).
function dupRole(s) {
  const ls = loneSide(s);
  const m = s.duplicate_of && storyById(s.duplicate_of);
  const matchedSide = m && (s.status === "rotowire_only" ? m.rotowire : m.underdog);
  if (!ls || !matchedSide) return { cls: "", label: "duplicate" };
  // The original is the FIRST post on this feed about the event — comparing against the
  // matched post AND every other duplicate of it on the same feed (so a 2nd follow-up
  // isn't mislabeled "original" just because the matched post came later still).
  const peers = state.stories
    .filter(x => x.same_event_duplicate && x.duplicate_of === m.story_id && x.status === s.status)
    .map(x => loneSide(x)?.side).filter(Boolean);
  const sameFeed = [matchedSide, ...peers];
  const earliest = sameFeed.reduce((a, b) => new Date(a.created_at) <= new Date(b.created_at) ? a : b);
  if (ls.side.tweet_id === earliest.tweet_id) return { cls: "role-original", label: "Original (headline)" };
  const medium = hasMedia(ls.side.text)
    ? (s.status === "underdog_only" ? " + video" : " + link") : "";
  return { cls: "role-followup", label: "Follow-up" + medium };
}
// The single populated side of a one-sided story (gap or duplicate) + its handle.
function loneSide(s) {
  if (s.rotowire) return { handle: state.handles.rotowire, side: s.rotowire };
  if (s.underdog) return { handle: state.handles.underdog, side: s.underdog };
  return null;
}
const storyById = id => state.stories.find(s => s.story_id === id);
function fmtDelta(sec) {
  if (sec == null) return "—";
  const a = Math.abs(sec), m = Math.floor(a/60), s = a%60;
  const txt = (m ? `${m}m ` : "") + `${s}s`;
  const cls = sec > 0 ? "pos" : "neg";
  const sign = sec > 0 ? "+" : "−";
  return `<span class="delta ${cls}">${sign}${txt}</span>`;
}
const fmtPct = r => r == null ? "—" : (r*100).toFixed(0) + "%";
const fmtNum = n => n == null ? "—" : n.toLocaleString();
// Minutes:seconds, e.g. 244 -> "4:04". Used for the win/loss margins.
const fmtMS = sec => {
  if (sec == null) return "—";
  const a = Math.round(Math.abs(sec)), m = Math.floor(a / 60), s = a % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
};
function side(s, key) { return (s[key] && s[key].created_at) ? s[key].created_at : null; }
function storyTime(s) {
  const ts = [side(s,"rotowire"), side(s,"underdog")].filter(Boolean).map(t => +new Date(t));
  return ts.length ? Math.min(...ts) : 0;
}

// ---- KPI header ----
function renderKpis() {
  const s = state.agg.summary || {};
  const cards = [
    ["RotoWire-first win rate", fmtPct(s.rotowire_first_rate),
      s.matched ? `${s.rotowire_first}/${s.matched}` : ""],
    ["RW wins by", fmtMS(s.median_win_lead_seconds), "median, when RotoWire is first"],
    ["UD wins by", fmtMS(s.median_win_trail_seconds), "median, when Underdog is first"],
    ["Matched stories", s.matched ?? 0, ""],
    ["Coverage gaps", `${s.rotowire_only ?? 0} / ${s.underdog_only ?? 0}`, "RW-only / UD-only"],
    ["Follow-ups", `${(s.rotowire_duplicate ?? 0) + (s.underdog_duplicate ?? 0)}`, "RW + UD"],
  ];
  document.getElementById("kpis").innerHTML = cards.map(([l,v,sub]) =>
    `<div class="kpi"><div class="label">${l}</div>
     <div class="value">${v} <small>${sub||""}</small></div></div>`).join("");
}

// ---- feed ----
const COLS = [
  ["time", "Date", s => fmtTime(storyTimeIso(s)), false],
  ["player", "Player", s => esc(s.player), false],
  ["team", "Team", s => esc(s.team || "—"), false],
  ["event_class", "Event", s => `<span class="chip">${esc(s.event_class||"—")}</span>`, false],
  ["canonical_label", "Story", s => esc(s.canonical_label || "—"), false],
  ["rw_time", "RotoWire", s => timeLink(state.handles.rotowire, s.rotowire), false],
  ["ud_time", "Underdog", s => timeLink(state.handles.underdog, s.underdog), false],
  ["time_delta_seconds", "Δ lead", s => fmtDelta(s.time_delta_seconds), true],
  ["winner", "Winner", s => winnerBadge(s), false],
  ["rw_impr", "RW impr", s => fmtNum(s.rotowire?.impression_count), true],
  ["ud_impr", "UD impr", s => fmtNum(s.underdog?.impression_count), true],
  ["match_confidence", "Conf", s => s.match_confidence!=null ? s.match_confidence.toFixed(2) : "—", true],
  ["review_status", "Review", s => `<span class="status-${s.review_status}">${s.review_status}</span>`, false],
];
function storyTimeIso(s){ const t = storyTime(s); return t ? new Date(t).toISOString() : null; }
function winnerBadge(s) {
  if (s.roundup) return `<span class="chip">Roundup</span>`;
  if (s.status === "rotowire_only") return `<span class="chip">RW only</span>`;
  if (s.status === "underdog_only") return `<span class="chip">UD only</span>`;
  if (s.rotowire_first == null) return "—";
  return s.rotowire_first ? `<span class="badge rw">RotoWire</span>` : `<span class="badge ud">Underdog</span>`;
}
function esc(v){ return v==null ? "" : String(v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function sortVal(s, key) {
  switch (key) {
    case "time": return storyTime(s);
    case "rw_time": return +new Date(side(s,"rotowire")||0);
    case "ud_time": return +new Date(side(s,"underdog")||0);
    case "rw_impr": return s.rotowire?.impression_count ?? -1;
    case "ud_impr": return s.underdog?.impression_count ?? -1;
    case "winner": return s.rotowire_first ? 1 : 0;
    default: return s[key] ?? "";
  }
}

function filteredStories() {
  const fromT = ctDayStart(val("f-from")), toT = ctDayEnd(val("f-to")),
        ev = val("f-event"), pl = val("f-player").toLowerCase(),
        conf = parseFloat(val("f-conf")), st = val("f-status");
  return state.stories.filter(s => {
    if (s.same_event_duplicate) return false;  // duplicates live on their own tab
    const t = storyTime(s);
    if (fromT != null && t < fromT) return false;
    if (toT != null && t >= toT) return false;
    if (ev && s.event_class !== ev) return false;
    if (pl && !(s.player||"").toLowerCase().includes(pl)) return false;
    if (!isNaN(conf) && (s.match_confidence ?? 0) < conf) return false;
    // Status filter: "matched" targets the story's match status; the review states
    // (pending/confirmed/rejected/merged) target review_status.
    if (st === "matched") { if (s.status !== "matched") return false; }
    else if (st && s.review_status !== st) return false;
    return true;
  });
}
const val = id => document.getElementById(id).value;

function renderFeed() {
  const rows = filteredStories().sort((a,b) => {
    const va = sortVal(a, state.sortKey), vb = sortVal(b, state.sortKey);
    const cmp = va < vb ? -1 : va > vb ? 1 : 0;
    return state.sortAsc ? cmp : -cmp;
  });
  const wrap = document.getElementById("feed-wrap");
  if (!rows.length) { wrap.innerHTML = `<div class="empty">No stories match. Once matching (Phase 3) writes stories.jsonl, rows appear here.</div>`; return; }
  const head = COLS.map(([k,label,,num]) => {
    const cls = (k===state.sortKey ? "sorted "+(state.sortAsc?"asc":"") : "");
    return `<th class="${cls}" data-key="${k}" ${num?'style="text-align:right"':''}>${label}</th>`;
  }).join("");
  const body = rows.map(s => "<tr>" + COLS.map(([k,,fn,num]) =>
    `<td class="${num?'num':''}${k==='canonical_label'?' story':''}">${fn(s)}</td>`).join("") + "</tr>").join("");
  wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
  wrap.querySelectorAll("th[data-key]").forEach(th => th.onclick = () => {
    const k = th.dataset.key;
    if (state.sortKey === k) state.sortAsc = !state.sortAsc;
    else { state.sortKey = k; state.sortAsc = false; }
    renderFeed();
  });
}

// ---- rollup views ----
// "2026-09-08","2026-09-14" -> "Sep 8–14"; a single date -> "Sep 7". Dates are local calendar days.
function fmtWeekRange(start, end) {
  const d = x => new Date(x + "T12:00:00Z");
  const mon = x => d(x).toLocaleString("en-US", { month: "short", timeZone: "UTC" });
  const day = x => d(x).getUTCDate();
  if (!end) return `${mon(start)} ${day(start)}`;
  return mon(start) === mon(end) ? `${mon(start)} ${day(start)}–${day(end)}`
                                 : `${mon(start)} ${day(start)} – ${mon(end)} ${day(end)}`;
}
function renderRollup(el, rows, periodLabel) {
  if (!rows.length) { el.innerHTML = `<div class="empty">No ${periodLabel} data yet.</div>`; return; }
  // Update gaps (development matching): a step of a story both covered that one side skipped.
  const steps = rows.some(r => r.underdog_update_only != null);
  const bars = rows.map(r => {
    const pct = (r.rotowire_first_rate ?? 0) * 100;
    return `<div class="bar-row"><span>${r.period}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span>${fmtPct(r.rotowire_first_rate)}</span></div>`;
  }).join("");
  const body = rows.map(r => `<tr>
    <td>${r.period}</td><td class="num">${r.matched}</td>
    <td class="num">${fmtPct(r.rotowire_first_rate)}</td>
    <td class="num">${fmtMargin(r.median_lead_seconds)}</td>
    <td class="num">${fmtMS(r.median_win_lead_seconds)}</td>
    <td class="num">${fmtMS(r.median_win_trail_seconds)}</td>
    <td class="num">${r.rotowire_only}</td><td class="num">${r.underdog_only}</td>
    ${steps ? `<td class="num">${r.underdog_update_only ?? 0}</td><td class="num">${r.rotowire_update_only ?? 0}</td>` : ""}</tr>`).join("");
  el.innerHTML = `<div class="panel"><h3 style="color:var(--muted)">RotoWire-first win rate by ${periodLabel}</h3>
    <div class="bars">${bars}</div></div>
    <table><thead><tr><th data-nosort>Period</th><th data-nosort style="text-align:right">Matched</th>
    <th data-nosort style="text-align:right">RW win rate</th>
    <th data-nosort style="text-align:right" title="Median of every matched story; UD +1:40 means Underdog was typically 1:40 faster">Typical margin</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories RotoWire posted first">RW wins by</th>
    <th data-nosort style="text-align:right" title="Median margin on the stories Underdog posted first">UD wins by</th><th data-nosort style="text-align:right">RW-only</th>
    <th data-nosort style="text-align:right">UD-only</th>
    ${steps ? `<th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted (e.g. headed to the locker room)">Steps RW skipped</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only RotoWire posted">Steps UD skipped</th>` : ""}
    </tr></thead><tbody>${body}</tbody></table>`;
}

// ---- by news type: season week x type grid of RotoWire's win rate ----
// Single-hue ramp (magnitude): surface -> brand green. Win rates of 50%+ share the top step.
const TYPE_RAMP = ["#1f2a2a", "#1e3b2b", "#1f4f2f", "#226434", "#277a3a", "#2ea043"];
const TYPE_MIN_STORIES = 10;   // cells below this are hatched: too few stories to read much into

function fmtMargin(sec) {
  if (sec == null) return "—";
  if (sec === 0) return "even";
  const a = Math.abs(Math.round(sec));
  return `${sec > 0 ? "RW" : "UD"} +${Math.floor(a / 60)}:${pad(a % 60)}`;
}

function typeCell(c, extra = "", typeKey = "", week = "") {
  if (!c) return `<td class="type-cell empty-cell ${extra}"><div>—</div></td>`;
  const rate = c.rotowire_first_rate;
  const bg = TYPE_RAMP[Math.min(TYPE_RAMP.length - 1, Math.floor(rate / 0.1))];
  const ink = rate >= 0.3 ? "#0f1419" : "var(--text)";
  const low = c.matched < TYPE_MIN_STORIES;
  const tip = `${c.matched} matched ${c.matched === 1 ? "story" : "stories"} · RW first ${fmtPct(rate)} · ` +
    `median ${c.median_lead_seconds < 0 ? "Underdog" : c.median_lead_seconds > 0 ? "RotoWire" : "even"}` +
    `${c.median_lead_seconds ? " faster by " + fmtMargin(c.median_lead_seconds).split("+")[1] : ""}`;
  const picked = state.typePick && state.typePick.type === typeKey && state.typePick.week === week;
  return `<td class="type-cell ${low ? "low" : ""} ${picked ? "picked" : ""} ${extra}">
    <button type="button" data-type="${esc(typeKey)}" data-week="${esc(week)}" title="${esc(tip)} · click for examples"
      style="background:${bg};color:${ink}"><span class="pct">${fmtPct(rate)}</span>
    <span class="meta">${c.matched} · ${fmtMargin(c.median_lead_seconds)}</span></button></td>`;
}

function renderTypes() {
  const nt = state.agg.news_types;
  const has = !!(nt && nt.types && nt.types.length);
  document.getElementById("tab-types").classList.toggle("hidden", !has);
  const el = document.getElementById("view-types");
  if (!has) { el.innerHTML = ""; return; }

  // Flag the week still in progress (its end date hasn't passed yet).
  const today = new Date().toISOString().slice(0, 10);
  const ends = Object.fromEntries((state.agg.season_weeks || []).map(r => [r.period, r.end]));
  const head = nt.weeks.map(w => `<th class="wk">${esc(w)}${ends[w] && ends[w] >= today
    ? `<span class="wk-note">in progress</span>` : ""}</th>`).join("");
  const rows = nt.types.map(t => `<tr><th scope="row" class="type-name">${esc(t.label)}</th>
    ${nt.weeks.map(w => typeCell(t.weeks[w], "", t.key, w)).join("")}${typeCell(t.season, "season", t.key, "")}</tr>`).join("");

  el.innerHTML = `<p class="type-note">How often RotoWire posted first, by type of news and NFL week.
    Each cell shows RW's win rate, then the number of matched stories and the median margin
    (UD +2:00 means Underdog was typically two minutes faster). Week 1 on; types are sorted
    by keyword rules on the post text, so treat them as close, not exact.</p>
    <div class="type-wrap"><table class="type-grid"><thead><tr><th>News type</th>${head}
    <th class="wk season">Season</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="type-legend"><span>RW win rate</span>
      <span class="ramp">${TYPE_RAMP.map(c => `<i style="background:${c}"></i>`).join("")}</span>
      <span>0% → 50%+</span><span class="hatch-key"></span><span>Fewer than ${TYPE_MIN_STORIES} stories</span>
      <span class="legend-hint">Click a cell to see its stories.</span></div>
    <div id="type-examples">${typeExamples(nt)}</div>`;
  el.querySelectorAll(".type-cell button").forEach(b => b.onclick = () => {
    const pick = { type: b.dataset.type, week: b.dataset.week };
    const same = state.typePick && state.typePick.type === pick.type && state.typePick.week === pick.week;
    state.typePick = same ? null : pick;
    renderTypes();
    if (state.typePick) document.getElementById("type-examples").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  const close = document.getElementById("type-examples-close");
  if (close) close.onclick = e => { e.preventDefault(); state.typePick = null; renderTypes(); };
}

// Head-to-heads behind the picked grid cell: both tweets, times and margin.
function typeExamples(nt) {
  const pick = state.typePick;
  if (!pick) return "";
  const t = nt.types.find(x => x.key === pick.type);
  if (!t) return "";
  const rows = state.stories.filter(s => s.status === "matched" && s.news_type === pick.type
      && s.review_status !== "rejected" && s.season_week && s.season_week !== "Preseason"
      && (!pick.week || s.season_week === pick.week))
    .sort((a, b) => storyTime(b) - storyTime(a));
  const body = rows.map(s => {
    const d = s.time_delta_seconds;
    const cls = d > 0 ? "rw" : d < 0 ? "ud" : "";
    return `<tr><td>${esc(s.player || "?")}${pick.week ? "" : `<div class="muted-sm">${esc(s.season_week)}</div>`}</td>
      <td><span class="badge ${cls}">${fmtMargin(d)}</span></td>
      <td class="story"><span class="who-tag">UD</span>${timeLink(state.handles.underdog, s.underdog)}
        <div>${textLink(state.handles.underdog, s.underdog, s.underdog.text)}</div></td>
      <td class="story"><span class="who-tag">RW</span>${timeLink(state.handles.rotowire, s.rotowire)}
        <div>${textLink(state.handles.rotowire, s.rotowire, s.rotowire.text)}</div></td></tr>`;
  }).join("");
  return `<div class="examples-head"><h3>${esc(t.label)} · ${esc(pick.week || "Season")}</h3>
      <span>${rows.length} head-to-head${rows.length === 1 ? "" : "s"}, newest first ·
      <a href="#" id="type-examples-close">close</a></span></div>
    <div class="type-wrap"><table class="examples"><thead><tr><th data-nosort>Player</th>
      <th data-nosort>First by</th><th data-nosort>Underdog</th><th data-nosort>RotoWire</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

// ---- by time of day: each account's news volume per hour + RotoWire's win rate that hour ----
const hourLabel = h => h === 0 ? "12a" : h < 12 ? `${h}a` : h === 12 ? "12p" : `${h - 12}p`;

function renderHours() {
  const hours = state.agg.hours || [];
  const has = hours.some(h => h.matched || h.rotowire_posts || h.underdog_posts);
  document.getElementById("tab-hours").classList.toggle("hidden", !has);
  const el = document.getElementById("view-hours");
  if (!has) { el.innerHTML = ""; return; }

  // Volume bars show news posts, or every collected post with nothing excluded.
  const all = state.hoursAll && hours.some(h => h.rotowire_all != null);
  const rwN = h => all ? h.rotowire_all : h.rotowire_posts;
  const udN = h => all ? h.underdog_all : h.underdog_posts;
  const what = all ? "" : "news ";
  const max = Math.max(1, ...hours.map(h => Math.max(rwN(h), udN(h))));
  const H = 84;  // px height of each volume half
  const bar = (n, who, cls) => `<div class="hcol ${cls}" style="height:${H}px">
      <div class="hbar" title="${n} ${who} ${what}${n === 1 ? "post" : "posts"}" style="height:${Math.round(n / max * H)}px"></div></div>`;
  const cell = h => {
    if (!h.matched) return `<div class="hcell none">—</div>`;
    const rate = h.rotowire_first / h.matched;
    const bg = TYPE_RAMP[Math.min(TYPE_RAMP.length - 1, Math.floor(rate / 0.1))];
    const tip = `${hourLabel(h.hour)}: RotoWire first on ${h.rotowire_first} of ${h.matched} · typical ${fmtMargin(h.median_lead_seconds)}`;
    return `<div class="hcell ${h.matched < TYPE_MIN_STORIES ? "low" : ""}" title="${esc(tip)}"
      style="background-color:${bg};color:${rate >= 0.3 ? "#0f1419" : "var(--text)"}">
      <b>${fmtPct(rate)}</b><span>${h.matched}</span></div>`;
  };
  const rows = hours.map(h => `<tr><td>${hourLabel(h.hour)}</td><td class="num">${h.rotowire_posts}</td>
    <td class="num">${h.underdog_posts}</td><td class="num">${h.rotowire_all ?? "—"}</td>
    <td class="num">${h.underdog_all ?? "—"}</td><td class="num">${h.matched}</td>
    <td class="num">${h.matched ? fmtPct(h.rotowire_first / h.matched) : "—"}</td>
    <td class="num">${fmtMargin(h.median_lead_seconds)}</td></tr>`).join("");

  el.innerHTML = `<p class="type-note">When each account posts news, and how often RotoWire was first, by
    hour of the day (Eastern time, Week 1 on). Top: ${all ? "every post collected per hour, nothing left out"
    : "news posts per hour; hype and other non-news posts are left out"}, RotoWire above the line and
    Underdog below. Bottom: RotoWire's win rate on the stories that broke that hour, with the story
    count. Hover for the typical margin.</p>
    <div class="filters"><label>Posts<select id="f-hours-all">
      <option value=""${all ? "" : " selected"}>News only</option>
      <option value="1"${all ? " selected" : ""}>All tweets</option></select></label></div>
    <div class="type-wrap"><div class="hours">
      <div class="hlab">RW posts</div>${hours.map(h => bar(rwN(h), "RotoWire", "up")).join("")}
      <div></div><div class="hzero"></div>
      <div class="hlab">UD posts</div>${hours.map(h => bar(udN(h), "Underdog", "down")).join("")}
      <div class="hlab">RW first</div>${hours.map(cell).join("")}
      <div></div>${hours.map(h => `<div class="htick">${hourLabel(h.hour)}</div>`).join("")}
    </div></div>
    <div class="type-legend"><span class="key-sw rw"></span><span>RotoWire ${what}posts</span>
      <span class="key-sw ud"></span><span>Underdog ${what}posts</span>
      <span class="hatch-key"></span><span>Fewer than ${TYPE_MIN_STORIES} stories</span></div>
    <details class="hours-table"><summary>Show as a table</summary>
      <table><thead><tr><th data-nosort>Hour</th><th data-nosort style="text-align:right">RW news posts</th>
      <th data-nosort style="text-align:right">UD news posts</th><th data-nosort style="text-align:right">RW all posts</th>
      <th data-nosort style="text-align:right">UD all posts</th><th data-nosort style="text-align:right">Matched</th>
      <th data-nosort style="text-align:right">RW first</th><th data-nosort style="text-align:right">Typical margin</th>
      </tr></thead><tbody>${rows}</tbody></table></details>`;
  document.getElementById("f-hours-all").onchange = e => { state.hoursAll = !!e.target.value; renderHours(); };
}

// ---- by staff: who held each desk role when the news broke ----
// Times on this tab are US Eastern (the schedule's timezone), unlike the CT feed.
const _etTime = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
const hhLabel = hh => { const h = +hh.slice(0, 2); return `${(h + 11) % 12 + 1}${h < 12 ? "a" : "p"}`; };
const STAFF_MIN = 10;   // fewer matched stories than this: flagged as a small sample
// Red when Underdog was typically first, green when RotoWire was; stronger = bigger margin.
function marginBg(sec, n) {
  if (!n || sec == null) return "";
  const a = (0.18 + 0.55 * Math.min(1, Math.abs(sec) / 240)).toFixed(2);
  return sec < 0 ? `rgba(229,83,75,${a})` : `rgba(46,160,67,${a})`;
}

// Stories behind a strip cell or window row: when each broke (ET), who won, the first post.
function storyList(title, ids) {
  const rows = ids.map(storyById).filter(Boolean)
    .filter(s => !s.same_event_duplicate && s.review_status !== "rejected")
    .sort((a, b) => storyTime(a) - storyTime(b));
  const what = s => s.status === "matched" ? (s.rotowire_first ? "RotoWire first" : "Underdog first")
    : s.roundup ? "Roundup" : s.gap_kind === "update" ? (s.underdog ? "Step RW skipped" : "Step UD skipped")
    : s.underdog ? "RotoWire missed" : "RotoWire only";
  const body = rows.map(s => {
    const lead = s.underdog && (!s.rotowire || !s.rotowire_first) ? s.underdog : s.rotowire;
    const handle = lead === s.underdog ? state.handles.underdog : state.handles.rotowire;
    return `<tr><td>${_etTime.format(new Date(storyTime(s)))}</td><td>${esc(s.player || "?")}${borderlineChip(lead)}</td>
      <td><span class="chip">${what(s)}</span></td>
      <td class="num">${s.status === "matched" ? fmtMargin(s.time_delta_seconds) : "—"}</td>
      <td class="story">${textLink(handle, lead, lead && lead.text)}</td></tr>`;
  }).join("");
  return `<h3 style="font-size:14px;margin:18px 0 8px">${esc(title)} · ${rows.length} ${rows.length === 1 ? "story" : "stories"}</h3>
    ${rows.length ? `<div class="type-wrap"><table><thead><tr><th data-nosort>Broke (ET)</th><th data-nosort>Player</th>
      <th data-nosort>Result</th><th data-nosort style="text-align:right">Margin</th><th data-nosort>First post</th></tr></thead>
      <tbody>${body}</tbody></table></div>` : `<div class="empty">No stories.</div>`}`;
}

function renderStaff() {
  const st = state.agg.staffing || {};
  const days = st.days || [];
  document.getElementById("tab-staff").classList.toggle("hidden", !days.length);
  const el = document.getElementById("view-staff");
  if (!days.length) { el.innerHTML = ""; return; }

  const ALLDAYS = "__all";
  const dayKey = days.some(d => d.date === state.staffDay) || (state.staffDay === ALLDAYS && days.length > 1)
    ? state.staffDay : days[days.length - 1].date;
  const day = days.find(d => d.date === dayKey);
  const roles = st.roles || {};
  const role = roles[state.staffRole] ? state.staffRole : Object.keys(roles)[0];
  const total = day ? day.total : st.all.total;
  const people = (day ? day.people : st.all.people)[role] || [];
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US",
    { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });

  const kpi = (label, value, small) => `<div class="kpi"><div class="label">${label}</div>
    <div class="value">${value}${small ? ` <small>${small}</small>` : ""}</div></div>`;
  const missed = t => `${t.underdog_only}${t.underdog_only_borderline ? ` <small>(${t.underdog_only_borderline} borderline)</small>` : ""}`;
  const kpis = `<div class="kpis">
    ${kpi("Matched stories", total.matched, total.rotowire_posts != null ? `of ${total.rotowire_posts} RW news posts` : "")}
    ${kpi("RotoWire first", fmtPct(total.rotowire_first_rate), `${total.rotowire_first}/${total.matched}`)}
    ${kpi("Typical margin", fmtMargin(total.median_lead_seconds))}
    ${kpi("RotoWire missed", missed(total))}
    ${kpi("Steps skipped", total.underdog_update_only ?? 0, "Underdog-only steps")}</div>`;

  // Shift strip: one row per role (spans = who held it), then each hour's result.
  let strip = "";
  if (day) {
    const slots = day.slots, n = slots.length;
    const spans = r => {
      const out = []; let cur = null, from = 0;
      slots.forEach((s, i) => {
        const k = (s.roles[r] || []).join(" / ");
        if (k !== cur) { if (cur !== null) out.push([from, i, cur]); cur = k; from = i; }
      });
      out.push([from, n, cur]);
      return out.map(([a, b, k]) => {
        const hand = slots.slice(a, b).flatMap(s => s.handoffs[r] || []);
        const tip = `${k} · ${hhLabel(slots[a].start)}–${hhLabel(slots[b - 1].start)}${hand.length ? " · " + hand.join(", ") : ""}`;
        return `<div class="s-span" style="grid-column:${a + 2}/${b + 2}" title="${esc(tip)}">${esc(k)}</div>`;
      }).join("");
    };
    const cells = slots.map((s, i) => {
      const posts = s.rotowire_posts != null ? ` · news posts RW ${s.rotowire_posts}, UD ${s.underdog_posts}` : "";
      const tip = `${hhLabel(s.start)} ET${posts}: ${s.matched} matched, RotoWire first on ${s.rotowire_first}` +
        `${s.matched ? ", typical " + fmtMargin(s.median_lead_seconds) : ""}; ${s.underdog_only} missed` +
        `${s.underdog_only_borderline ? ` (${s.underdog_only_borderline} borderline)` : ""}; ${s.underdog_update_only} steps skipped`;
      const miss = s.underdog_only ? `${s.underdog_only} missed` : "";
      return `<button type="button" class="s-cell${state.staffHour === s.start ? " on" : ""}" data-h="${s.start}"
        style="${marginBg(s.median_lead_seconds, s.matched) ? "background:" + marginBg(s.median_lead_seconds, s.matched) : ""}"
        title="${esc(tip)}" aria-label="${esc(tip)}"><b>${s.matched || ""}</b><span>${miss}</span></button>`;
    }).join("");
    strip = `<div class="type-wrap"><div class="strip" style="grid-template-columns:120px repeat(${n}, minmax(34px, 1fr))">
      ${Object.entries(roles).map(([r, l]) => `<div class="s-lab">${esc(l)}</div>${spans(r)}`).join("")}
      <div class="s-lab">Result</div>${cells}
      <div></div>${slots.map(s => `<div class="s-tick">${hhLabel(s.start)}</div>`).join("")}
    </div></div>
    <p class="type-note">Each hour: the number is matched stories, colour is the typical margin (red: Underdog
      first, green: RotoWire first, stronger = bigger gap), "missed" is news only Underdog posted. Click an hour
      to list its stories. Hours are Eastern time.</p>`;
  }

  // Stories behind the selected hour.
  const slot = day && day.slots.find(s => s.start === state.staffHour);
  const detail = slot ? storyList(`${hhLabel(slot.start)} ET`, slot.story_ids) : "";

  const vol = people.some(p => p.rotowire_posts != null);
  const prow = p => `<tr><td>${esc(p.name)}${p.matched < STAFF_MIN ? `<span class="small-n" title="Fewer than ${STAFF_MIN} matched stories: too few to judge">small sample</span>` : ""}</td>
    <td class="num">${p.hours.toFixed(1)}</td>
    ${vol ? `<td class="num">${p.rotowire_posts ?? 0}</td><td class="num">${p.underdog_posts ?? 0}</td>` : ""}
    <td class="num">${p.matched}</td>
    <td class="num">${p.rotowire_first} <span class="bl">${fmtPct(p.rotowire_first_rate)}</span></td>
    <td class="num">${fmtMargin(p.median_lead_seconds)}</td>
    <td class="num">${p.underdog_only}${p.underdog_only_borderline ? ` <span class="bl">(${p.underdog_only_borderline} borderline)</span>` : ""}</td>
    <td class="num">${p.underdog_update_only ?? 0}</td><td class="num">${p.rotowire_only}</td></tr>`;
  const table = `<div class="type-wrap"><table><thead><tr><th data-nosort>Person</th>
    <th data-nosort style="text-align:right">Hours on</th>
    ${vol ? `<th data-nosort style="text-align:right" title="News posts RotoWire made while this person was on (link replies and other non-news left out)">RW news posts</th>
    <th data-nosort style="text-align:right" title="News posts Underdog made while this person was on">UD news posts</th>` : ""}
    <th data-nosort style="text-align:right">Matched</th>
    <th data-nosort style="text-align:right">RotoWire first</th>
    <th data-nosort style="text-align:right" title="Median of the matched stories; UD +1:40 means Underdog was typically 1:40 faster">Typical margin</th>
    <th data-nosort style="text-align:right" title="News only Underdog posted. Borderline = highlight clips and in-game notes the classifier would otherwise drop">RotoWire missed</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted (e.g. headed to the locker room)">Steps skipped</th>
    <th data-nosort style="text-align:right">RotoWire exclusive</th></tr></thead>
    <tbody>${[...people].sort((a, b) => b.hours - a.hours).map(prow).join("")}</tbody></table></div>`;

  el.innerHTML = `<p class="type-note">How RotoWire did against Underdog by who held each desk role when the news
      broke (the first post on either feed). A shared hour credits everyone on it. Only hours on the schedule count.</p>
    <div class="filters">
      <label>Day<select id="f-staff-day">${days.map(d =>
        `<option value="${d.date}"${d.date === dayKey ? " selected" : ""}>${fmtDay(d.date)}</option>`).join("")}
        ${days.length > 1 ? `<option value="${ALLDAYS}"${dayKey === ALLDAYS ? " selected" : ""}>All scheduled days</option>` : ""}</select></label>
    </div>
    ${kpis}${strip}${detail}
    <div class="filters" style="margin-top:20px"><label>Role<div class="seg-chips" role="group" aria-label="Role">
      ${Object.entries(roles).map(([r, l]) => `<button type="button" data-r="${r}" class="${r === role ? "on" : ""}" aria-pressed="${r === role}">${esc(l)}</button>`).join("")}
    </div></label></div>
    ${table}`;

  document.getElementById("f-staff-day").onchange = e => { state.staffDay = e.target.value; state.staffHour = null; renderStaff(); };
  el.querySelectorAll(".seg-chips button").forEach(b => b.onclick = () => { state.staffRole = b.dataset.r; renderStaff(); });
  el.querySelectorAll(".s-cell").forEach(c => c.onclick = () => {
    state.staffHour = state.staffHour === c.dataset.h ? null : c.dataset.h; renderStaff();
  });
}

// ---- during games: kickoff - 2h to kickoff + 3h (+4h primetime), from ESPN kickoffs ----
function renderGames() {
  const gw = state.agg.game_windows || {};
  const wins = gw.windows || [];
  document.getElementById("tab-games").classList.toggle("hidden", !wins.length);
  const el = document.getElementById("view-games");
  if (!wins.length) { el.innerHTML = ""; return; }

  const missed = t => `${t.underdog_only}`;
  const cmp = (label, t, hrs) => `<tr><td>${label}</td><td class="num">${hrs}</td><td class="num">${t.matched}</td>
    <td class="num">${t.rotowire_first} <span class="bl">${fmtPct(t.rotowire_first_rate)}</span></td>
    <td class="num">${fmtMargin(t.median_lead_seconds)}</td><td class="num">${missed(t)}</td>
    <td class="num">${t.underdog_update_only ?? 0}</td><td class="num">${t.rotowire_only}</td></tr>`;
  const head = `<th data-nosort style="text-align:right">Matched</th><th data-nosort style="text-align:right">RotoWire first</th>
    <th data-nosort style="text-align:right">Typical margin</th>
    <th data-nosort style="text-align:right" title="News only Underdog posted">RotoWire missed</th>
    <th data-nosort style="text-align:right" title="Steps of a story both covered that only Underdog posted">Steps skipped</th>
    <th data-nosort style="text-align:right">RotoWire exclusive</th>`;
  const compare = `<div class="type-wrap"><table><thead><tr><th data-nosort></th><th data-nosort style="text-align:right">Hours</th>${head}</tr></thead>
    <tbody>${cmp("During games", gw.inside, gw.inside_hours)}${cmp("Rest of the week", gw.outside, "—")}</tbody></table></div>`;

  // Clock hours (ET) across every game window so far.
  const hrs = gw.hours || [];
  const lab = h => `${(h + 11) % 12 + 1}${h < 12 ? "a" : "p"}`;
  const strip = hrs.length ? `<h3 style="font-size:14px;margin:22px 0 8px">By hour, during games</h3>
    <div class="type-wrap"><div class="strip" style="grid-template-columns:120px repeat(${hrs.length}, minmax(40px, 1fr))">
      <div class="s-lab">Result</div>${hrs.map(h => {
        const tip = `${lab(h.hour)} ET in game windows: ${h.matched} matched, RotoWire first on ${h.rotowire_first}` +
          `${h.matched ? ", typical " + fmtMargin(h.median_lead_seconds) : ""}; ${h.underdog_only} missed; ${h.underdog_update_only} steps skipped`;
        const bg = marginBg(h.median_lead_seconds, h.matched);
        return `<div class="s-cell" style="cursor:default${bg ? ";background:" + bg : ""}" title="${esc(tip)}" aria-label="${esc(tip)}">
          <b>${h.matched || ""}</b><span>${h.matched ? fmtPct(h.rotowire_first / h.matched) + " RW" : ""}</span></div>`;
      }).join("")}
      <div></div>${hrs.map(h => `<div class="s-tick">${lab(h.hour)}</div>`).join("")}
    </div></div>
    <p class="type-note">Number is matched stories that broke in that hour during a game window, with RotoWire's
      win rate under it; colour is the typical margin (red: Underdog first, green: RotoWire first). Hover for misses.</p>` : "";

  const fmtET = iso => _etTime.format(new Date(iso));
  const rows = [...wins].reverse().map(w => {
    const names = w.games.map(g => g.name).join(", ");
    return `<tr class="gw-row${state.gameWin === w.start ? " on" : ""}" data-w="${w.start}" style="cursor:pointer">
      <td>${esc(w.label)}</td><td>${fmtET(w.start)} – ${fmtET(w.end)}</td>
      <td title="${esc(names)}">${w.games.length === 1 ? esc(names) : `${w.games.length} games`}</td>
      <td class="num">${w.matched}</td><td class="num">${w.rotowire_first} <span class="bl">${fmtPct(w.rotowire_first_rate)}</span></td>
      <td class="num">${fmtMargin(w.median_lead_seconds)}</td><td class="num">${missed(w)}</td>
      <td class="num">${w.underdog_update_only ?? 0}</td><td class="num">${w.rotowire_only}</td></tr>`;
  }).join("");
  const sel = wins.find(w => w.start === state.gameWin);
  const detail = sel ? storyList(`${sel.label}, ${fmtET(sel.start)} – ${fmtET(sel.end)} ET`, sel.story_ids) : "";

  el.innerHTML = `<p class="type-note">How RotoWire compares while NFL games are on. A game's window runs from 2 hours
      before kickoff (injury reports land about 90 minutes before), rounded down to the hour, to 3 hours after
      (4 hours for a 7pm ET or later kickoff), rounded up; overlapping windows merge. Kickoffs come from ESPN, so
      international and other one-off games are included. Times are Eastern.</p>
    ${compare}${strip}
    <h3 style="font-size:14px;margin:22px 0 8px">Game windows</h3>
    <div class="type-wrap"><table><thead><tr><th data-nosort>Day</th><th data-nosort>Window (ET)</th><th data-nosort>Games</th>${head}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="type-note">Click a window to list its stories.</p>${detail}`;

  el.querySelectorAll(".gw-row").forEach(r => r.onclick = () => {
    state.gameWin = state.gameWin === r.dataset.w ? null : r.dataset.w; renderGames();
  });
}

// ---- trend: median margin per day / week / month, zero line = even ----
// Positive = RotoWire typically first. The goal is to get above the line.
const TREND_GRAINS = [["day", "Day"], ["week", "Week"], ["month", "Month"]];
const TREND_CLAMP = 600;            // y-axis caps at ±10 min; values beyond sit on the edge
function trendGrain() {
  // Always opens on Week; a Day/Month pick lasts until the page is reloaded.
  return state.trendGrain || "week";
}

function renderTrend() {
  const el = document.getElementById("trend");
  const trend = state.agg.trend;
  if (!trend || !(trend.week || []).length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  el.classList.remove("hidden");
  const grain = trendGrain();
  const rows = trend[grain] || [];
  const isDay = grain === "day";
  // The line is a trailing median (7 days / 4 weeks / 3 months, pooled over the stories) so
  // it shows the trend; each bucket's own median is a faint dot. Older JSON without the
  // rolling field falls back to the bucket median.
  const ROLL = { day: "7 days", week: "4 weeks", month: "3 months" }[grain];
  const rolling = rows.some(r => r.rolling_median_seconds != null);
  const lineVal = r => rolling ? r.rolling_median_seconds
                               : isDay ? r.rolling7_median_seconds : r.median_lead_seconds;
  const last = rows[rows.length - 1];

  const W = Math.max(320, el.clientWidth - 28), H = 240;
  const m = { t: 14, r: 76, b: 30, l: 72 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  // Day view scales to the trend line; single days far outside it sit on the plot edge.
  const vals = (isDay || rolling ? rows.map(lineVal) : rows.map(r => r.median_lead_seconds)).filter(v => v != null);
  const clampV = v => Math.max(-TREND_CLAMP, Math.min(TREND_CLAMP, v));
  let lo = Math.min(0, ...vals.map(clampV)), hi = Math.max(0, ...vals.map(clampV));
  const span = Math.max(120, hi - lo); lo -= span * 0.12;
  hi = Math.max(hi + span * 0.12, span * 0.3);   // always leave room above "even": that's the goal
  const step = [30, 60, 120, 300, 600].find(s => (hi - lo) / s <= 6) || 600;
  const y = v => m.t + (hi - Math.max(lo, Math.min(hi, clampV(v)))) / (hi - lo) * ih;
  const x = i => m.l + (rows.length === 1 ? iw / 2 : i / (rows.length - 1) * iw);

  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const tickLabel = v => v === 0 ? "even" : `${v > 0 ? "RW" : "UD"} ${fmtMS(Math.abs(v))}`;
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? "t-zero" : "t-grid"}"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" class="t-tick" text-anchor="end">${tickLabel(v)}</text>`).join("");

  const every = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 64)));
  const lastI = rows.length - 1;
  const showX = i => i % every === 0 ? !(i !== lastI && lastI - i < every / 2 && lastI % every !== 0)
                                     : i === lastI && lastI % every >= every / 2;
  const xlabels = rows.map((r, i) => showX(i)
    ? `<text x="${x(i)}" y="${H - 8}" class="t-tick" text-anchor="middle">${esc(r.label)}</text>` : "").join("");

  const pts = rows.map((r, i) => [i, lineVal(r)]).filter(([, v]) => v != null);
  const path = pts.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const dots = rows.map((r, i) => {
    const v = r.median_lead_seconds, low = r.matched < TYPE_MIN_STORIES;
    if (v == null) return "";   // a period with no matched story: no dot, axis keeps its place
    const clipped = v > hi || v < lo || Math.abs(v) > TREND_CLAMP;
    const faint = isDay || rolling;
    return `<circle cx="${x(i)}" cy="${y(v)}" r="${isDay ? 3 : 4}" class="t-dot ${faint ? "faint" : ""} ${low ? "hollow" : ""} ${clipped ? "clipped" : ""}"/>`;
  }).join("");
  const lastV = last && lineVal(last);
  const endLabel = lastV != null ? `<text x="${x(rows.length - 1) + 10}" y="${y(lastV) + 4}" class="t-end">${fmtMargin(Math.round(lastV))}</text>` : "";
  // Release markers: a dashed line at the bucket each release date falls in. A release
  // before the first bucket can't be placed, so it's named in a note instead.
  const keyOf = d => grain === "month" ? d.slice(0, 7) : d;
  const marks = [], early = [];
  (state.agg.milestones || []).forEach(ms => {
    const k = keyOf(ms.date);
    let idx = -1;
    rows.forEach((r, i) => { if (r.period <= k) idx = i; });
    if (idx < 0) { early.push(ms); return; }
    marks.push({ ...ms, i: idx });
  });
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const markSvg = marks.map(mk => `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${m.t}" y2="${m.t + ih}" class="t-mark"/>
    <text x="${x(mk.i) + (mk.i > rows.length * 0.75 ? -6 : 6)}" y="${m.t + 12}" class="t-mark-label"
      text-anchor="${mk.i > rows.length * 0.75 ? "end" : "start"}">${esc(mk.label)} · ${fmtDay(mk.date)}</text>`).join("");
  const earlyNote = early.length ? ` ${early.map(e => `${esc(e.label)} (${fmtDay(e.date)})`).join(", ")}
    went live before tracking started, so everything shown is after it.` : "";
  const hits = rows.map((r, i) => {
    const w = rows.length === 1 ? iw : iw / (rows.length - 1);
    return `<rect x="${x(i) - w / 2}" y="${m.t}" width="${w}" height="${ih}" data-i="${i}" class="t-hit"/>`;
  }).join("");

  el.innerHTML = `<div class="trend-head">
      <div><h3>Typical margin over time</h3>
        <p>Median of every matched story${rolling || isDay ? ` (line: trailing ${ROLL}; dots: each ${grain})` : ""}. Above the line RotoWire was typically first; below it, Underdog. The goal is to get above the line.${earlyNote}</p></div>
      <div class="seg" role="group" aria-label="Group by">${TREND_GRAINS.map(([k, l]) =>
        `<button type="button" data-g="${k}" class="${k === grain ? "on" : ""}" aria-pressed="${k === grain}">${l}</button>`).join("")}</div>
    </div>
    <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Median margin by ${grain}; latest ${last ? esc(last.label) + " " + fmtMargin(Math.round(lastV)) : ""}">
      <text x="${m.l + 6}" y="${y(0) - 7}" class="t-side">▲ RotoWire earlier</text>
      <text x="${m.l + 6}" y="${y(0) + 15}" class="t-side">▼ Underdog earlier</text>
      ${grid}${xlabels}${markSvg}<path d="${path}" class="t-line"/>${dots}${endLabel}
      <line class="t-cross hidden" y1="${m.t}" y2="${m.t + ih}"/>${hits}</svg>
      <div class="t-tip hidden"></div></div>`;

  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    state.trendGrain = b.dataset.g;
    renderTrend();
  });
  const tip = el.querySelector(".t-tip"), cross = el.querySelector(".t-cross");
  el.querySelectorAll(".t-hit").forEach(h => {
    h.onmouseenter = () => {
      const r = rows[+h.dataset.i], cx = x(+h.dataset.i);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.classList.remove("hidden");
      tip.innerHTML = `<b>${esc(r.label)}</b><div>${r.median_lead_seconds == null ? "No matched stories"
          : `Median ${fmtMargin(Math.round(r.median_lead_seconds))}`}</div>
        <div>RotoWire first on ${r.rotowire_first} of ${r.matched}</div>
        ${r.rolling_median_seconds != null ? `<div>Trailing ${ROLL} ${fmtMargin(Math.round(r.rolling_median_seconds))} (${r.rolling_matched} stories)</div>`
          : isDay && r.rolling7_median_seconds != null ? `<div>Trailing 7 days ${fmtMargin(Math.round(r.rolling7_median_seconds))} (${r.rolling7_matched} stories)</div>` : ""}`;
      tip.classList.remove("hidden");
      const left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), W - tip.offsetWidth);
      tip.style.left = left + "px";
    };
    h.onmouseleave = () => { tip.classList.add("hidden"); cross.classList.add("hidden"); };
  });
}
let _trendResize;
window.addEventListener("resize", () => {
  clearTimeout(_trendResize);
  _trendResize = setTimeout(() => { if (state.agg && state.agg.trend) renderTrend(); }, 150);
});

// Custom-range summary for the current sport. Reuses summarize() (same math as the
// ALL overview / src/aggregate.py::_summary) over a user-picked [from,to] window.
function renderCustom() {
  const fromT = ctDayStart(state.customFrom);
  const toT = ctDayEnd(state.customTo);
  const s = summarize(state.stories, fromT, toT);
  const ranged = state.customFrom || state.customTo;
  const rangeLabel = `${state.customFrom || "start"} → ${state.customTo || "latest"}`;
  const cards = [
    ["RotoWire-first win rate", fmtPct(s.rotowire_first_rate), s.matched ? `${s.rotowire_first}/${s.matched}` : ""],
    ["RW wins by", fmtMS(s.median_win_lead_seconds), "median, when RotoWire is first"],
    ["UD wins by", fmtMS(s.median_win_trail_seconds), "median, when Underdog is first"],
    ["Matched stories", fmtNum(s.matched), ""],
    ["Coverage gaps", `${s.rotowire_only} / ${s.underdog_only}`, "RW-only / UD-only"],
    ["Follow-ups", `${s.dups}`, "RW + UD"],
  ];

  // Win-rate graph: a single bar for the whole selected period (RotoWire-first rate over
  // the [from,to] window, from the same summary `s` as the KPI cards).
  const pct = (s.rotowire_first_rate ?? 0) * 100;
  const barLabel = ranged ? rangeLabel : "All dates";
  const bar = s.matched
    ? `<div class="bar-row" style="grid-template-columns:minmax(120px,auto) 1fr 56px">
         <span>${esc(barLabel)}</span>
         <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
         <span>${fmtPct(s.rotowire_first_rate)}</span></div>`
    : `<div class="empty">No matched stories in this range.</div>`;
  const graph = `<div class="panel"><h3 style="color:var(--muted)">RotoWire-first win rate</h3>
    <div class="bars">${bar}</div></div>`;

  document.getElementById("view-custom").innerHTML =
    `<div class="filters">
       <label>From<input type="date" id="c-from" value="${state.customFrom || ""}"></label>
       <label>To<input type="date" id="c-to" value="${state.customTo || ""}"></label>
       <label>&nbsp;<button id="c-clear" class="sport-btn" style="padding:6px 12px">Clear</button></label>
     </div>
     <p style="color:var(--muted);font-size:13px;margin:0 0 12px">
       Metrics for ${ranged ? esc(rangeLabel) : "all dates"} — pick a range to scope the numbers.</p>
     <div class="kpis">${cards.map(([l,v,sub]) =>
       `<div class="kpi"><div class="label">${l}</div><div class="value">${v} <small>${sub||""}</small></div></div>`).join("")}</div>
     ${graph}`;
  const cf = document.getElementById("c-from"), ct = document.getElementById("c-to");
  cf.onchange = () => { state.customFrom = cf.value; renderCustom(); };
  ct.onchange = () => { state.customTo = ct.value; renderCustom(); };
  document.getElementById("c-clear").onclick = () => { state.customFrom = ""; state.customTo = ""; renderCustom(); };
}

// Feed label = which account actually posted this one-sided story.
const feedOf = s => s.status === "rotowire_only" ? "RotoWire" : "Underdog";

// Coverage gaps for sports whose stories carry gap_kind (development matching): what each
// side missed or posted later, one NFL week at a time, so a week's misses can be reviewed.
const GAP_VIEWS = [
  { key: "ud_missed", status: "underdog_only", kind: "missed", label: "RotoWire missed",
    note: "Underdog posted it and RotoWire posted nothing about the player in the next 24 hours." },
  { key: "ud_late", status: "underdog_only", kind: "late", label: "RotoWire later",
    note: "Underdog posted it; RotoWire's next post about the player came later (it may be a different update, so both are shown)." },
  { key: "rw_missed", status: "rotowire_only", kind: "missed", label: "RotoWire exclusive",
    note: "RotoWire posted it and Underdog posted nothing about the player in the next 24 hours." },
  { key: "rw_late", status: "rotowire_only", kind: "late", label: "Underdog later",
    note: "RotoWire posted it; Underdog's next post about the player came later." },
  { key: "ud_update", status: "underdog_only", kind: "update", label: "Update RotoWire skipped",
    note: "Both accounts covered this player's story, but only Underdog posted this step of it (e.g. headed to the locker room). Shown next to RotoWire's closest post on the player. Not counted as a missed story." },
  { key: "rw_update", status: "rotowire_only", kind: "update", label: "Update Underdog skipped",
    note: "Both accounts covered this player's story, but only RotoWire posted this step of it." },
];

// Signed offset of the other account's post from the lone one: "4m before" / "12m after".
function fmtOffset(sec) {
  const m = Math.round(Math.abs(sec) / 60);
  const t = m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
  return sec < 0 ? `${t} before` : `${t} after`;
}
const borderlineChip = side => side && side.borderline
  ? ` <span class="chip" title="Labelled ${esc(side.borderline.replace("_", " "))} by the classifier, counted as news anyway">borderline</span>` : "";

function fmtDelay(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m}m later` : `${Math.floor(m / 60)}h ${pad(m % 60)}m later`;
}

function renderGapsByWeek() {
  const el = document.getElementById("view-gaps");
  const gaps = state.stories.filter(s => s.gap_kind && !s.same_event_duplicate
                                         && s.review_status !== "rejected" && s.season_week);
  const weeks = (state.agg.season_weeks || []).map(r => r.period)
    .filter(w => gaps.some(s => s.season_week === w));
  if (!weeks.length) { el.innerHTML = `<div class="empty">No coverage gaps.</div>`; return; }
  const week = weeks.includes(state.gapWeek) ? state.gapWeek : weeks[weeks.length - 1];
  const inWeek = gaps.filter(s => s.season_week === week);
  const view = GAP_VIEWS.find(v => v.key === state.gapView) || GAP_VIEWS[0];
  const count = v => inWeek.filter(s => s.status === v.status && s.gap_kind === v.kind).length;
  const rows = inWeek.filter(s => s.status === view.status && s.gap_kind === view.kind)
    .sort((a, b) => storyTime(a) - storyTime(b));

  const hype = ((state.agg.hype || {}).weeks || {})[week];
  const hypeLine = hype ? ` Left out as hype (not a report) this week: Underdog ${hype.underdog},
    RotoWire ${hype.rotowire}.` : "";
  const loneHandle = view.status === "underdog_only" ? state.handles.underdog : state.handles.rotowire;
  const otherHandle = view.status === "underdog_only" ? state.handles.rotowire : state.handles.underdog;

  const paired = view.kind === "late" || view.kind === "update";
  const body = rows.map(s => {
    const lone = s.underdog || s.rotowire;
    const other = view.kind === "update" ? s.other_side_near : s.other_side_later;
    const gap = !other ? "—" : view.kind === "update" ? fmtOffset(other.delay_seconds)
                                                     : fmtDelay(other.delay_seconds);
    return `<tr><td>${fmtTime(lone.created_at)}</td><td>${esc(s.player || "?")}${borderlineChip(lone)}</td>
      <td class="story">${textLink(loneHandle, lone, lone.text)}</td>
      ${paired ? `<td class="num">${gap}</td>
      <td class="story">${other ? textLink(otherHandle, other, other.text) : "—"}</td>` : ""}</tr>`;
  }).join("");
  const loneName = view.status === "underdog_only" ? "Underdog post" : "RotoWire post";
  const otherWho = view.status === "underdog_only" ? "RotoWire's" : "Underdog's";
  const otherName = view.kind === "update" ? `${otherWho} closest post on the player`
                                           : `${otherWho} later post`;

  el.innerHTML = `<p class="type-note">News only one account covered. Pick a week and a list
      to review what RotoWire missed or posted late.${hypeLine}</p>
    <div class="filters">
      <label>NFL week<select id="f-gap-week">${weeks.map(w =>
        `<option${w === week ? " selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
      <label>Show<select id="f-gap-view">${GAP_VIEWS.map(v =>
        `<option value="${v.key}"${v === view ? " selected" : ""}>${v.label} (${count(v)})</option>`).join("")}
      </select></label>
    </div>
    <p class="type-note">${view.note}</p>
    ${rows.length ? `<div class="type-wrap"><table><thead><tr><th data-nosort>Posted</th>
      <th data-nosort>Player</th><th data-nosort>${loneName}</th>
      ${paired ? `<th data-nosort style="text-align:right">Gap</th>
      <th data-nosort>${otherName}</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>`
      : `<div class="empty">None in ${esc(week)}.</div>`}`;

  document.getElementById("f-gap-week").onchange = e => { state.gapWeek = e.target.value; renderGapsByWeek(); };
  document.getElementById("f-gap-view").onchange = e => { state.gapView = e.target.value; renderGapsByWeek(); };
}

function renderGaps() {
  if (state.stories.some(s => s.gap_kind)) return renderGapsByWeek();
  const all = state.stories
    .filter(s => (s.status === "rotowire_only" || s.status === "underdog_only")
                 && !s.same_event_duplicate && !s.roundup && s.gap_kind !== "update" && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const rw = all.filter(s => s.status === "rotowire_only").length;
  const ud = all.length - rw;

  const sel = state.gapFeed || "";  // "", "RotoWire", or "Underdog"
  const rows = sel ? all.filter(s => feedOf(s) === sel) : all;
  const filters = `<div class="filters"><label>Feed<select id="f-gap-feed">
      <option value="">both (${all.length})</option>
      <option value="RotoWire"${sel==="RotoWire"?" selected":""}>RotoWire-only (${rw})</option>
      <option value="Underdog"${sel==="Underdog"?" selected":""}>Underdog-only (${ud})</option>
    </select></label></div>`;

  const body = rows.map(s => {
    const ls = loneSide(s);
    return `<tr>
      <td>${ls ? fmtTime(ls.side.created_at) : "—"}</td>
      <td>${esc(s.player||"?")}</td>
      <td><span class="chip">${esc(s.event_class||"—")}</span></td>
      <td><span class="chip">${feedOf(s)}</span></td>
      <td class="story">${ls ? textLink(ls.handle, ls.side, ls.side.text) : "—"}</td></tr>`;
  }).join("");
  const intro = `<p style="color:var(--muted);font-size:13px;margin:0 0 12px">
       News one feed posted and the other never matched — ${rw} RotoWire-only,
       ${ud} Underdog-only. The Story links to the tweet.</p>`;
  const table = rows.length
    ? `<table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th>
       <th data-nosort>Story</th></tr></thead><tbody>${body}</tbody></table>`
    : `<div class="empty">No coverage gaps for this feed.</div>`;
  document.getElementById("view-gaps").innerHTML = all.length
    ? intro + filters + table
    : `<div class="empty">No coverage gaps.</div>`;

  const fsel = document.getElementById("f-gap-feed");
  if (fsel) fsel.onchange = () => { state.gapFeed = fsel.value; renderGaps(); };
}

function renderDups() {
  // Same-event duplicates: posts that matched an event already counted elsewhere, so
  // they lost the strict 1-to-1 match. Shown here (not in the feed or coverage gaps).
  const dups = state.stories
    .filter(s => s.same_event_duplicate && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const body = dups.map(s => {
    const ls = loneSide(s);
    const m = s.duplicate_of && storyById(s.duplicate_of);
    const matchedSide = m && (s.status === "rotowire_only" ? m.rotowire : m.underdog);
    const matchedText = m ? (m.canonical_label || `${m.player||""} ${m.event_class||""}`.trim() || s.duplicate_of) : null;
    const matchedHandle = ls && ls.handle;  // same feed as the duplicate
    const role = dupRole(s);
    return `<tr>
      <td>${ls ? fmtTime(ls.side.created_at) : "—"}</td>
      <td>${esc(s.player||"?")}</td>
      <td><span class="chip">${esc(s.event_class||"—")}</span></td>
      <td><span class="chip">${feedOf(s)}</span></td>
      <td><span class="chip ${role.cls}">${esc(role.label)}</span></td>
      <td class="story">${ls ? textLink(ls.handle, ls.side, ls.side.text) : "—"}</td>
      <td class="story">${matchedSide ? textLink(matchedHandle, matchedSide, matchedText) : esc(matchedText || "—")}</td></tr>`;
  }).join("");
  document.getElementById("view-dups").innerHTML = dups.length
    ? `<p style="color:var(--muted);font-size:13px;margin:0 0 12px">
         Later posts about news one account already reported: an Underdog quote-tweet update
         or a second RotoWire tweet on the same development. They don't count toward speed
         or coverage gaps; this list is for spot-checking. <b>Type</b> flags whether this post is
         the original headline or a later follow-up (RotoWire adds a story link; Underdog
         adds a video). Story and Matched-story link to their tweets.</p>
       <table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th><th data-nosort>Type</th>
       <th data-nosort>Story</th><th data-nosort>Matched story</th></tr></thead>
       <tbody>${body}</tbody></table>`
    : `<div class="empty">No follow-up posts.</div>`;
}

// ---- ALL overview ----
const medianOf = xs => {
  if (!xs.length) return null;
  const a = [...xs].sort((x,y) => x-y), m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
};
const meanOf = xs => xs.length ? xs.reduce((p,c) => p+c, 0) / xs.length : null;

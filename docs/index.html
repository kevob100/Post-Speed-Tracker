// Time from the original source tweet to each side's post (src/source.py). The margin chart
// can't say which side moved; this one can. Lower is faster. Same Day / Week / Month grain.
function sourceChart(rows, grain, W, fmtDay, marks) {
  if (!rows.some(r => r.sourced)) return "";
  const isDay = grain === "day";
  const pre = { day: "rolling1_", week: "rolling7_", month: "rolling30_" }[grain];
  const val = (r, side) => r[`${pre}${side}_from_source`];
  const thin = () => false;   // windows stretch to enough stories (aggregate.TREND_MIN)
  const H = 200, m = { t: 14, r: 76, b: 30, l: 72 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const solid = rows.filter(r => !thin(r)).flatMap(r => [val(r, "rw"), val(r, "ud")]).filter(v => v != null);
  const all = rows.flatMap(r => [val(r, "rw"), val(r, "ud")]).filter(v => v != null);
  const hi = Math.min(3600, Math.max(120, ...(solid.length ? solid : all)) * 1.15);
  const step = [60, 120, 300, 600, 900, 1800].find(s => hi / s <= 5) || 1800;
  const y = v => m.t + (1 - Math.min(hi, Math.max(0, v)) / hi) * ih;
  const x = i => m.l + (rows.length === 1 ? iw / 2 : i / (rows.length - 1) * iw);
  const ticks = []; for (let v = 0; v <= hi; v += step) ticks.push(v);
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="t-grid"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" class="t-tick" text-anchor="end">${v ? fmtMS(v) : "0:00"}</text>`).join("");
  const paths = side => {
    let s = "", t = "";
    rows.forEach((r, i) => {
      if (!i) return;
      const a = val(rows[i - 1], side), b = val(r, side);
      if (a == null || b == null) return;
      const seg = `M${x(i - 1).toFixed(1)},${y(a).toFixed(1)}L${x(i).toFixed(1)},${y(b).toFixed(1)}`;
      if (thin(rows[i - 1]) || thin(r)) t += seg; else s += seg;
    });
    return `<path d="${t}" class="s-line thin ${side}"/><path d="${s}" class="s-line ${side}"/>`;
  };
  // Direct end labels name each line, so colour isn't the only cue.
  const lastI = rows.map((r, i) => [r, i]).filter(([r]) => val(r, "ud") != null).pop();
  let ends = "";
  if (lastI) {
    const [r, i] = lastI, yr = y(val(r, "rw")), yu = y(val(r, "ud"));
    const gap = Math.abs(yr - yu) < 14 ? (yr < yu ? -7 : 7) : 0;
    ends = `<text x="${x(i) + 10}" y="${yr + 4 + gap}" class="s-end rw">RW ${fmtMS(val(r, "rw"))}</text>
      <text x="${x(i) + 10}" y="${yu + 4 - gap}" class="s-end ud">UD ${fmtMS(val(r, "ud"))}</text>`;
  }
  const markSvg = marks.map(mk => `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${m.t}" y2="${m.t + ih}" class="t-mark"/>`).join("");
  const every = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 64)));
  const xlabels = rows.map((r, i) => i % every === 0 && rows.length - 1 - i >= every / 2 || i === rows.length - 1
    ? `<text x="${x(i)}" y="${H - 8}" class="t-tick" text-anchor="middle">${esc(r.label)}</text>` : "").join("");
  const sourced = rows.reduce((a, r) => a + (r.sourced || 0), 0);
  return `<div class="trend-head" style="margin-top:22px"><div><h3>Time from source to post</h3>
      <p>How long after the original report (the reporter or team tweet the post credits) each side posted.
      Median over the last ${{ day: "day", week: "7 days", month: "30 days" }[grain]}, reaching further back when news is thin;
      lower is faster. The margin above can't say which side moved; this can. Covers the ${sourced} matched
      stories whose source tweet was found.</p></div></div>
    <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Median minutes from source tweet to post, RotoWire and Underdog">
      ${grid}${xlabels}${markSvg}${paths("ud")}${paths("rw")}${ends}</svg></div>`;
}

function renderTrend() {
  const el = document.getElementById("trend");
  const trend = state.agg.trend;
  if (!trend || !(trend.week || []).length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
  applyTopMode();   // visibility follows the Timing / Audience switch
  const grain = trendGrain();
  // Every view runs day by day: Day is each day's actual median, Week a trailing 7-day
  // median and Month a trailing 30-day median (pooled over the stories in the window).
  const rows = trend.day || [];
  const isDay = grain === "day";
  // The line is a trailing median (7 days / 4 weeks / 3 months, pooled over the stories) so
  // it shows the trend; each bucket's own median is a faint dot. Older JSON without the
  // rolling field falls back to the bucket median.
  // Day view plots each day's actual median; Week and Month draw a trailing median.
  // Every view is one continuous line: the last N days, stretched back until the window
  // holds enough stories (aggregate.TREND_MIN), so quiet stretches never leave a gap.
  const ROLL = { day: "day", week: "7 days", month: "30 days" }[grain];
  const MIN = { day: 10, week: 30, month: 100 }[grain];
  const rollKey = { day: "rolling1", week: "rolling7", month: "rolling30" }[grain];
  const rolling = true;
  const hasStretch = rows.some(r => r[`${rollKey}_median_seconds`] !== undefined);
  const lineVal = r => hasStretch ? r[`${rollKey}_median_seconds`]
    : isDay ? r.median_lead_seconds : r[`${rollKey}_median_seconds`];
  const thin = () => false;
  const last = rows[rows.length - 1];

  const W = Math.max(300, el.clientWidth - 28), H = 260;
  const narrow = W < 560;
  const m = { t: 14, r: narrow ? 70 : 84, b: 30, l: 72 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  // The axis fits every point on the line.
  const allVals = rows.map(lineVal).filter(v => v != null);
  const solidVals = rows.filter(r => !thin(r)).map(lineVal).filter(v => v != null);
  const vals = solidVals.length ? solidVals : allVals;
  const clampV = v => Math.max(-TREND_CLAMP, Math.min(TREND_CLAMP, v));
  let lo = Math.min(0, ...vals.map(clampV)), hi = Math.max(0, ...vals.map(clampV));
  const span = Math.max(120, hi - lo); lo -= span * 0.12;
  hi = Math.max(hi + span * 0.12, span * 0.3);   // always leave room above "even": that's the goal
  const step = [30, 60, 120, 300, 600, 900, 1800].find(s => (hi - lo) / s <= 6) || 1800;
  const y = v => m.t + (hi - Math.max(lo, Math.min(hi, clampV(v)))) / (hi - lo) * ih;
  const x = i => m.l + (rows.length === 1 ? iw / 2 : i / (rows.length - 1) * iw);

  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  const tickLabel = v => v === 0 ? "even" : `${v > 0 ? "RW" : "UD"} ${fmtMS(Math.abs(v))}`;
  const grid = ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" class="${v === 0 ? "t-zero" : "t-grid"}"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" class="t-tick" text-anchor="end">${tickLabel(v)}</text>`).join("");

  const every = Math.max(1, Math.ceil(rows.length / Math.floor(iw / 64)));
  const lastI = rows.length - 1;
  const showX = i => i % every === 0 ? !(i !== lastI && lastI - i < every / 2 && lastI % every !== 0)
                                     : i === lastI && lastI % every >= every / 2;
  const xlabels = rows.map((r, i) => showX(i)
    ? `<text x="${x(i)}" y="${H - 8}" class="t-tick" text-anchor="middle">${esc(r.label)}</text>` : "").join("");

  const pts = rows.map((r, i) => [i, lineVal(r)]).filter(([, v]) => v != null);
  // A period with no value breaks the line rather than bridging it. A segment touching a
  // thin point goes on the dotted path; the rest is the solid line.
  const P = (i, v) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`;
  let path = "", thinPath = "";
  pts.forEach(([i, v], k) => {
    if (!k || pts[k - 1][0] !== i - 1) return;
    const [pi, pv] = pts[k - 1], seg = `M${P(pi, pv)}L${P(i, v)}`;
    if (thin(rows[pi]) || thin(rows[i])) thinPath += seg; else path += seg;
  });
  const anyThin = thinPath !== "";
  const dots = rows.map((r, i) => {
    const v = r.median_lead_seconds, low = r.matched < TYPE_MIN_STORIES;
    if (v == null) return "";   // a period with no matched story: no dot, axis keeps its place
    const clipped = v > hi || v < lo || Math.abs(v) > TREND_CLAMP;
    if (rolling) return "";   // smoothed views: the line alone (daily dots would be noise)
    const faint = thin(r);   // a day on too few stories: greyed like its dotted line
    return `<circle cx="${x(i)}" cy="${y(v)}" r="${isDay ? 3 : 4}" class="t-dot ${faint ? "faint" : ""} ${low ? "hollow" : ""} ${clipped ? "clipped" : ""}"/>`;
  }).join("");
  const lastV = last && lineVal(last);
  const endLabel = lastV != null ? `<text x="${x(rows.length - 1) + 8}" y="${y(lastV) + 4}" class="t-end">${fmtMargin(Math.round(lastV))}</text>
    <text x="${x(rows.length - 1) + 8}" y="${y(lastV) + 18}" class="t-side">${isDay ? "latest day" : (narrow ? "" : "last ") + ROLL}</text>` : "";
  // Release markers: a dashed line at the bucket each release date falls in. A release
  // before the first bucket can't be placed, so it's named in a note instead.
  const keyOf = d => d;   // rows are days in every view
  const marks = [], early = [];
  (state.agg.milestones || []).forEach(ms => {
    const k = keyOf(ms.date);
    let idx = -1;
    rows.forEach((r, i) => { if (r.period <= k) idx = i; });
    if (idx < 0) { early.push(ms); return; }
    marks.push({ ...ms, i: idx });
  });
  const fmtDay = d => new Date(d + "T12:00:00Z").toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  // A milestone that opens an era is named after that era, so chart and table agree.
  const eras = state.agg.eras || [];
  marks.forEach(mk => { const e = eras.find(e => e.from === mk.date); if (e) mk.label = e.label; });
  // Labels sit along the bottom of the plot; ones closer than their width stack upwards.
  const markText = mk => narrow ? fmtDay(mk.date) : `${mk.label} · ${fmtDay(mk.date)}`;
  // Each label's horizontal extent (about 7px a character at 12px); a label that would touch
  // one already placed moves up a row.
  const placed = [];
  marks.forEach(mk => {
    mk.end = x(mk.i) + 6 + markText(mk).length * 7 > W - m.r;
    const w = markText(mk).length * 7, px = x(mk.i);
    const [a0, a1] = mk.end ? [px - 6 - w, px - 6] : [px + 6, px + 6 + w];
    let r = 0;
    while (placed.some(p => p.row === r && a0 < p.a1 + 8 && a1 > p.a0 - 8)) r++;
    mk.row = r; placed.push({ row: r, a0, a1 });
  });
  const markSvg = marks.map(mk => `<line x1="${x(mk.i)}" x2="${x(mk.i)}" y1="${m.t}" y2="${m.t + ih}" class="t-mark"/>
    <text x="${x(mk.i) + (mk.end ? -6 : 6)}" y="${m.t + ih - 8 - mk.row * 16}" class="t-mark-label halo"
      text-anchor="${mk.end ? "end" : "start"}">${esc(markText(mk))}</text>`).join("");
  // The first era (before mass adoption) is shaded, with its typical margin drawn across it.
  let band = "", bandFg = "";
  const e0 = eras[0];
  if (eras.length > 1 && e0.until && e0.median_lead_seconds != null) {
    let iEnd = -1;
    rows.forEach((r, i) => { if (r.period < e0.until) iEnd = i; });
    if (iEnd > 0) {
      const x1 = x(iEnd), yv = y(e0.median_lead_seconds);
      band = `<rect x="${m.l}" y="${m.t}" width="${x1 - m.l}" height="${ih}" class="t-band"/>`;
      bandFg = `<line x1="${m.l}" x2="${x1}" y1="${yv}" y2="${yv}" class="t-era"/>
        <text x="${(m.l + x1) / 2}" y="${yv - 7}" text-anchor="middle" class="t-band-label halo">${narrow ? "" : esc(e0.label) + ": "}typical ${fmtMargin(e0.median_lead_seconds)}</text>`;
    }
  }
  // How far the 7-day gap has stayed over the last month, stated as a ceiling with a start date.
  const r7 = rows.map(r => [r.period, r.rolling7_median_seconds]).filter(([, v]) => v != null);
  let held = "";
  if (r7.length > 30) {
    const worst = Math.min(...r7.slice(-30).map(([, v]) => v));
    if (worst < 0) {
      const T = Math.ceil(-worst / 60) * 60;
      const breach = r7.filter(([, v]) => v < -T).pop();
      const startI = breach ? r7.findIndex(([d]) => d === breach[0]) + 1 : 0;
      if (r7.length - startI > 30)
        held = ` Since ${fmtDay(r7[startI][0])} the 7-day gap has stayed under ${T / 60} minute${T === 60 ? "" : "s"}.`;
    }
  }
  const earlyNote = early.length ? ` ${early.map(e => `${esc(e.label)} (${fmtDay(e.date)})`).join(", ")}
    went live before tracking started, so everything shown is after it.` : "";
  const hits = rows.map((r, i) => {
    const w = rows.length === 1 ? iw : iw / (rows.length - 1);
    return `<rect x="${x(i) - w / 2}" y="${m.t}" width="${w}" height="${ih}" data-i="${i}" class="t-hit"/>`;
  }).join("");

  el.innerHTML = `<div class="trend-head">
      <div><h3>Typical margin over time</h3>
        <p>Median of every matched story over the last ${ROLL}, day by day, reaching further back when news is thin so each point rests on at least ${MIN} stories${state.agg.analysis_start ? `, from ${fmtDay(state.agg.analysis_start)} on` : ""}. Above the line RotoWire was typically first; below it, Underdog.${held}${earlyNote}</p></div>
      <div class="seg" role="group" aria-label="Group by">${TREND_GRAINS.map(([k, l]) =>
        `<button type="button" data-g="${k}" class="${k === grain ? "on" : ""}" aria-pressed="${k === grain}">${l}</button>`).join("")}</div>
    </div>
    <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Median margin by ${grain}; latest ${last ? esc(last.label) + " " + fmtMargin(Math.round(lastV)) : ""}">
      ${band}
      <text x="${m.l + 6}" y="${y(0) - 7}" class="t-side halo">▲ RotoWire earlier</text>
      <text x="${m.l + 6}" y="${y(0) + 15}" class="t-side halo">▼ Underdog earlier</text>
      ${grid}${xlabels}${markSvg}<path d="${thinPath}" class="t-line thin"/><path d="${path}" class="t-line"/>${bandFg}${dots}${endLabel}
      <line class="t-cross hidden" y1="${m.t}" y2="${m.t + ih}"/>${hits}</svg>
      <div class="t-tip hidden"></div></div>`;
  // Before / after table and source timing live in their own panel, below the KPIs.
  const erasEl = document.getElementById("eras");
  erasEl.innerHTML = erasTable() + sourceChart(rows, grain, W, fmtDay, marks);
  if (erasEl.innerHTML.trim()) delete erasEl.dataset.empty; else erasEl.dataset.empty = "1";
  applyTopMode();

  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    state.trendGrain = b.dataset.g;
    renderTrend();
  });
  const tip = el.querySelector(".t-tip"), cross = el.querySelector(".t-cross");
  el.querySelectorAll(".t-hit").forEach(h => {
    h.onmouseenter = () => {
      const r = rows[+h.dataset.i], cx = x(+h.dataset.i);
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.classList.remove("hidden");
      const span = r[`${rollKey}_days`];
      const roll = r[`${rollKey}_median_seconds`] != null
        ? `<div>Trend: ${fmtMargin(Math.round(r[`${rollKey}_median_seconds`]))} (${r[`${rollKey}_matched`]} stories${span ? ` over ${span >= 2 ? Math.round(span) + " days" : "1 day"}` : ""})</div>` : "";
      tip.innerHTML = `<b>${esc(r.label)}</b>${roll}<div>${r.median_lead_seconds == null ? "No matched stories that day"
          : `That day: ${fmtMargin(Math.round(r.median_lead_seconds))}, RotoWire first on ${r.rotowire_first} of ${r.matched}`}</div>`;
      tip.classList.remove("hidden");
      const left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), W - tip.offsetWidth);
      tip.style.left = left + "px";
    };
    h.onmouseleave = () => { tip.classList.add("hidden"); cross.classList.add("hidden"); };
  });
}
let _trendResize;
window.addEventListener("resize", () => {
  clearTimeout(_trendResize);
  _trendResize = setTimeout(() => { if (state.agg && state.agg.trend) renderTrend();
    if (state.agg && state.agg.audience) renderAudience(); }, 150);
});

// Custom-range summary for the current sport. Reuses summarize() (same math as the
// ALL overview / src/aggregate.py::_summary) over a user-picked [from,to] window.
function renderCustom() {
  const fromT = ctDayStart(state.customFrom);
  const toT = ctDayEnd(state.customTo);
  const s = summarize(state.stories, fromT, toT);
  const ranged = state.customFrom || state.customTo;
  const rangeLabel = `${state.customFrom || "start"} → ${state.customTo || "latest"}`;
  const cards = [
    ["RotoWire-first win rate", fmtPct(s.rotowire_first_rate), s.matched ? `${s.rotowire_first}/${s.matched}` : ""],
    ["RW wins by", fmtMS(s.median_win_lead_seconds), "median, when RotoWire is first"],
    ["UD wins by", fmtMS(s.median_win_trail_seconds), "median, when Underdog is first"],
    ["Matched stories", fmtNum(s.matched), ""],
    ["Coverage gaps", `${s.rotowire_only} / ${s.underdog_only}`, "RW-only / UD-only"],
    ["Follow-ups", `${s.dups}`, "RW + UD"],
  ];

  // Win-rate graph: a single bar for the whole selected period (RotoWire-first rate over
  // the [from,to] window, from the same summary `s` as the KPI cards).
  const pct = (s.rotowire_first_rate ?? 0) * 100;
  const barLabel = ranged ? rangeLabel : "All dates";
  const bar = s.matched
    ? `<div class="bar-row" style="grid-template-columns:minmax(120px,auto) 1fr 56px">
         <span>${esc(barLabel)}</span>
         <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
         <span>${fmtPct(s.rotowire_first_rate)}</span></div>`
    : `<div class="empty">No matched stories in this range.</div>`;
  const graph = `<div class="panel"><h3 style="color:var(--muted)">RotoWire-first win rate</h3>
    <div class="bars">${bar}</div></div>`;

  document.getElementById("view-custom").innerHTML =
    `<div class="filters">
       <label>From<input type="date" id="c-from" value="${state.customFrom || ""}"></label>
       <label>To<input type="date" id="c-to" value="${state.customTo || ""}"></label>
       <label>&nbsp;<button id="c-clear" class="sport-btn" style="padding:6px 12px">Clear</button></label>
     </div>
     <p style="color:var(--muted);font-size:14px;margin:0 0 12px">
       Metrics for ${ranged ? esc(rangeLabel) : "all dates"} — pick a range to scope the numbers.</p>
     <div class="kpis">${cards.map(([l,v,sub]) =>
       `<div class="kpi"><div class="label">${l}</div><div class="value">${v} <small>${sub||""}</small></div></div>`).join("")}</div>
     ${graph}`;
  const cf = document.getElementById("c-from"), ct = document.getElementById("c-to");
  cf.onchange = () => { state.customFrom = cf.value; renderCustom(); };
  ct.onchange = () => { state.customTo = ct.value; renderCustom(); };
  document.getElementById("c-clear").onclick = () => { state.customFrom = ""; state.customTo = ""; renderCustom(); };
}

// Feed label = which account actually posted this one-sided story.
const feedOf = s => s.status === "rotowire_only" ? "RotoWire" : "Underdog";

// One-sided stories that are not missed stories: a skipped step, or news outside RotoWire's beat.
const NOT_GAPS = ["update", "not_fantasy", "not_covered"];

// Coverage gaps for sports whose stories carry gap_kind (development matching): what each
// side missed or posted later, one NFL week at a time, so a week's misses can be reviewed.
const GAP_VIEWS = [
  { key: "ud_missed", status: "underdog_only", kind: "missed", label: "RotoWire missed",
    note: "Underdog posted it and RotoWire posted nothing about the player in the next 24 hours." },
  { key: "ud_late", status: "underdog_only", kind: "late", label: "RotoWire later",
    note: "Underdog posted it; RotoWire's next post about the player came later (it may be a different update, so both are shown)." },
  { key: "rw_missed", status: "rotowire_only", kind: "missed", label: "RotoWire exclusive",
    note: "RotoWire posted it and Underdog posted nothing about the player in the next 24 hours." },
  { key: "rw_late", status: "rotowire_only", kind: "late", label: "Underdog later",
    note: "RotoWire posted it; Underdog's next post about the player came later." },
  { key: "ud_update", status: "underdog_only", kind: "update", label: "Update RotoWire skipped",
    note: "Both accounts covered this player's story, but only Underdog posted this step of it (e.g. headed to the locker room). Shown next to RotoWire's closest post on the player. Not counted as a missed story." },
  { key: "rw_update", status: "rotowire_only", kind: "update", label: "Update Underdog skipped",
    note: "Both accounts covered this player's story, but only RotoWire posted this step of it." },
  { key: "ud_not_fantasy", status: "underdog_only", kind: "not_fantasy", label: "Not fantasy (UD)",
    note: "Underdog news about linemen, defenders and specialists. RotoWire is a fantasy account and skips these, so they are not counted as missed." },
  { key: "ud_not_covered", status: "underdog_only", kind: "not_covered", label: "Below RotoWire's bar",
    note: "Underdog news about a fantasy-position player RotoWire has never posted about (a deep backup, for example). Not counted as missed; check here for anyone who should be covered." },
];

// Signed offset of the other account's post from the lone one: "4m before" / "12m after".
function fmtOffset(sec) {
  const m = Math.round(Math.abs(sec) / 60);
  const t = m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
  return sec < 0 ? `${t} before` : `${t} after`;
}
const borderlineChip = side => side && side.borderline
  ? ` <span class="chip" title="Labelled ${esc(side.borderline.replace("_", " "))} by the classifier, counted as news anyway">borderline</span>` : "";

function fmtDelay(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m}m later` : `${Math.floor(m / 60)}h ${pad(m % 60)}m later`;
}

function renderGapsByWeek() {
  const el = document.getElementById("view-gaps");
  const gaps = state.stories.filter(s => s.gap_kind && !s.same_event_duplicate && !s.before_start
                                         && s.review_status !== "rejected" && s.season_week);
  const weeks = (state.agg.season_weeks || []).map(r => r.period)
    .filter(w => gaps.some(s => s.season_week === w));
  if (!weeks.length) { el.innerHTML = `<div class="empty">No coverage gaps.</div>`; return; }
  const week = weeks.includes(state.gapWeek) ? state.gapWeek : weeks[weeks.length - 1];
  const inWeek = gaps.filter(s => s.season_week === week);
  const view = GAP_VIEWS.find(v => v.key === state.gapView) || GAP_VIEWS[0];
  const count = v => inWeek.filter(s => s.status === v.status && s.gap_kind === v.kind).length;
  const rows = inWeek.filter(s => s.status === view.status && s.gap_kind === view.kind)
    .sort((a, b) => storyTime(a) - storyTime(b));

  const hype = ((state.agg.hype || {}).weeks || {})[week];
  const hypeLine = hype ? ` Left out as hype (not a report) this week: Underdog ${hype.underdog},
    RotoWire ${hype.rotowire}.` : "";
  const loneHandle = view.status === "underdog_only" ? state.handles.underdog : state.handles.rotowire;
  const otherHandle = view.status === "underdog_only" ? state.handles.rotowire : state.handles.underdog;

  const paired = view.kind === "late" || view.kind === "update";
  const body = rows.map(s => {
    const lone = s.underdog || s.rotowire;
    const other = view.kind === "update" ? s.other_side_near : s.other_side_later;
    const gap = !other ? "—" : view.kind === "update" ? fmtOffset(other.delay_seconds)
                                                     : fmtDelay(other.delay_seconds);
    return `<tr><td>${fmtTime(lone.created_at)}</td><td>${esc(s.player || "?")}${borderlineChip(lone)}</td>
      <td class="story">${textLink(loneHandle, lone, lone.text)}</td>
      ${paired ? `<td class="num">${gap}</td>
      <td class="story">${other ? textLink(otherHandle, other, other.text) : "—"}</td>` : ""}</tr>`;
  }).join("");
  const loneName = view.status === "underdog_only" ? "Underdog post" : "RotoWire post";
  const otherWho = view.status === "underdog_only" ? "RotoWire's" : "Underdog's";
  const otherName = view.kind === "update" ? `${otherWho} closest post on the player`
                                           : `${otherWho} later post`;

  el.innerHTML = `<p class="type-note">News only one account covered. Pick a week and a list
      to review what RotoWire missed or posted late.${hypeLine}</p>
    <div class="filters">
      <label>NFL week<select id="f-gap-week">${weeks.map(w =>
        `<option${w === week ? " selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
      <label>Show<select id="f-gap-view">${GAP_VIEWS.map(v =>
        `<option value="${v.key}"${v === view ? " selected" : ""}>${v.label} (${count(v)})</option>`).join("")}
      </select></label>
    </div>
    <p class="type-note">${view.note}</p>
    ${rows.length ? `<div class="type-wrap"><table><thead><tr><th data-nosort>Posted</th>
      <th data-nosort>Player</th><th data-nosort>${loneName}</th>
      ${paired ? `<th data-nosort style="text-align:right">Gap</th>
      <th data-nosort>${otherName}</th>` : ""}</tr></thead><tbody>${body}</tbody></table></div>`
      : `<div class="empty">None in ${esc(week)}.</div>`}`;

  document.getElementById("f-gap-week").onchange = e => { state.gapWeek = e.target.value; renderGapsByWeek(); };
  document.getElementById("f-gap-view").onchange = e => { state.gapView = e.target.value; renderGapsByWeek(); };
}

function renderGaps() {
  if (state.stories.some(s => s.gap_kind)) return renderGapsByWeek();
  const all = state.stories
    .filter(s => (s.status === "rotowire_only" || s.status === "underdog_only")
                 && !s.same_event_duplicate && !s.roundup && !NOT_GAPS.includes(s.gap_kind) && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const rw = all.filter(s => s.status === "rotowire_only").length;
  const ud = all.length - rw;

  const sel = state.gapFeed || "";  // "", "RotoWire", or "Underdog"
  const rows = sel ? all.filter(s => feedOf(s) === sel) : all;
  const filters = `<div class="filters"><label>Feed<select id="f-gap-feed">
      <option value="">both (${all.length})</option>

      <option value="Underdog"${sel==="Underdog"?" selected":""}>Underdog-only (${ud})</option>

  const body = rows.map(s => {

  const intro = `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">
       News one feed posted and the other never matched — ${rw} RotoWire-only,
       ${ud} Underdog-only. The Story links to the tweet.</p>`;
  const table = rows.length
    ? `<table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th>
       <th data-nosort>Story</th></tr></thead><tbody>${body}</tbody></table>`
    : `<div class="empty">No coverage gaps for this feed.</div>`;
  document.getElementById("view-gaps").innerHTML = all.length
    ? intro + filters + table
    : `<div class="empty">No coverage gaps.</div>`;

  const fsel = document.getElementById("f-gap-feed");
  if (fsel) fsel.onchange = () => { state.gapFeed = fsel.value; renderGaps(); };
}

function renderDups() {
  // Same-event duplicates: posts that matched an event already counted elsewhere, so
  // they lost the strict 1-to-1 match. Shown here (not in the feed or coverage gaps).
  const dups = state.stories
    .filter(s => s.same_event_duplicate && s.review_status !== "rejected")
    .sort((a,b) => storyTime(a) - storyTime(b));
  const body = dups.map(s => {
    const ls = loneSide(s);
    const m = s.duplicate_of && storyById(s.duplicate_of);
    const matchedSide = m && (s.status === "rotowire_only" ? m.rotowire : m.underdog);
    const matchedText = m ? (m.canonical_label || `${m.player||""} ${m.event_class||""}`.trim() || s.duplicate_of) : null;
    const matchedHandle = ls && ls.handle;  // same feed as the duplicate
    const role = dupRole(s);
    return `<tr>
      <td>${ls ? fmtTime(ls.side.created_at) : "—"}</td>
      <td>${esc(s.player||"?")}</td>
      <td><span class="chip">${esc(s.event_class||"—")}</span></td>
      <td><span class="chip">${feedOf(s)}</span></td>
      <td><span class="chip ${role.cls}">${esc(role.label)}</span></td>
      <td class="story">${ls ? textLink(ls.handle, ls.side, ls.side.text) : "—"}</td>
      <td class="story">${matchedSide ? textLink(matchedHandle, matchedSide, matchedText) : esc(matchedText || "—")}</td></tr>`;
  }).join("");
  document.getElementById("view-dups").innerHTML = dups.length
    ? `<p style="color:var(--muted);font-size:14px;margin:0 0 12px">
         Later posts about news one account already reported: an Underdog quote-tweet update
         or a second RotoWire tweet on the same development. They don't count toward speed
         or coverage gaps; this list is for spot-checking. <b>Type</b> flags whether this post is
         the original headline or a later follow-up (RotoWire adds a story link; Underdog
         adds a video). Story and Matched-story link to their tweets.</p>
       <table><thead><tr><th data-nosort>Date</th><th data-nosort>Player</th>
       <th data-nosort>Event</th><th data-nosort>Feed</th><th data-nosort>Type</th>
       <th data-nosort>Story</th><th data-nosort>Matched story</th></tr></thead>
       <tbody>${body}</tbody></table>`
    : `<div class="empty">No follow-up posts.</div>`;
}

// ---- ALL overview ----
const medianOf = xs => {
  if (!xs.length) return null;
  const a = [...xs].sort((x,y) => x-y), m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
};
const meanOf = xs => xs.length ? xs.reduce((p,c) => p+c, 0) / xs.length : null;

// Compute a sport's headline metrics from its stories over an optional [from,to) range.
// fromT is inclusive, toT is exclusive (pass CT day boundaries via ctDayStart/ctDayEnd).
// Mirrors src/aggregate.py::_summary (active = not rejected/merged; gaps exclude dups).
function summarize(stories, fromT, toT) {
  const inRange = s => {
    const t = storyTime(s);
    if (fromT != null && t < fromT) return false;
    if (toT != null && t >= toT) return false;
    return true;
  };
  const isDup = s => !!s.same_event_duplicate;
  const active = stories.filter(s =>
    s.review_status !== "rejected" && s.review_status !== "merged" && !s.before_start && inRange(s));
  const matched = active.filter(s => s.status === "matched");
  const deltas = matched.map(s => s.time_delta_seconds).filter(v => v != null);
  const rwFirst = matched.filter(s => s.rotowire_first).length;
  // Split by who posted first: lead = RotoWire's head start (delta>0); trail = its lag.
  const leads = deltas.filter(d => d > 0);
  const trails = deltas.filter(d => d < 0).map(d => -d);
  // Unmatched roundups and update gaps (a step of a story both covered) are not missed stories.
  const count = (st, dup) => active.filter(s => s.status === st && isDup(s) === dup
                                               && (dup || (!s.roundup && !NOT_GAPS.includes(s.gap_kind)))).length;
  return {
    matched: matched.length,
    rotowire_first: rwFirst,
    rotowire_first_rate: matched.length ? rwFirst / matched.length : null,
    median_lead_seconds: medianOf(deltas),
    mean_lead_seconds: meanOf(deltas),
    avg_lead_seconds: meanOf(leads),
    avg_trail_seconds: meanOf(trails),
    median_win_lead_seconds: medianOf(leads),
    median_win_trail_seconds: medianOf(trails),
    rotowire_only: count("rotowire_only", false),
    underdog_only: count("underdog_only", false),
    dups: count("rotowire_only", true) + count("underdog_only", true),
  };
}

// ---- audience (top switch): RotoWire's followers and impressions, then growth vs Underdog ----
const AUD_MIN_POSTS = 20;             // a week with fewer posts on a side is too thin to compare
const FOL_MIN_DAYS = 60;              // follower growth vs Underdog needs this many days counted on both

function applyTopMode() {
  const isAll = state.sport === ALL || !state.agg;
  const has = !isAll && !!(state.agg && state.agg.audience);
  const mode = has && state.topMode !== "timing" ? "audience" : "timing";
  document.getElementById("mode-row").classList.toggle("hidden", !has);
  ["kpis", "focus-callout", "trend", "lead", "eras"].forEach(id => {
    const node = document.getElementById(id);
    node.classList.toggle("hidden", isAll || mode !== "timing" || node.dataset.empty === "1"); });
  document.getElementById("audience-top").classList.toggle("hidden", isAll || mode !== "audience");
  document.querySelectorAll("#mode-row button").forEach(b => {
    b.classList.toggle("on", b.dataset.m === mode); b.setAttribute("aria-pressed", b.dataset.m === mode); });
}

function renderAudience() {
  const a = state.agg.audience;
  const el = document.getElementById("audience-top");
  applyTopMode();   // show the panel first so the follower chart measures its real width
  if (!a) { el.innerHTML = ""; return; }
  const kfmt = n => n == null ? "—" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(n >= 1e5 ? 0 : 1) + "k" : String(Math.round(n));
  const num = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
  const pctS = (x, d = 1) => x == null ? "—" : `${x >= 0 ? "+" : ""}${(x * 100).toFixed(d)}%`;
  const fmtD = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const g = a.growth || {}, h = a.head_to_head || {}, fol = a.followers || {};
  const genAt = new Date(state.agg.generated_at || Date.now());
  // Complete weeks only: a week counts once its last post has had time to mature.
  const weeks = (a.views_by_week || []).filter(w =>
    new Date(w.week + "T00:00:00Z").getTime() + (7 * 24 + (a.mature_hours || 36)) * 3600e3 <= genAt.getTime())
    .map(w => ({ ...w, thin: (w.rotowire_posts || 0) < AUD_MIN_POSTS || (w.underdog_posts || 0) < AUD_MIN_POSTS }));
  const full = weeks.filter(w => !w.thin);
  const lastW = full[full.length - 1], prev4 = full.slice(-5, -1);
  const avg = xs => xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
  const rwPrevAvg = avg(prev4.map(w => w.rotowire_total_views || 0));
  const kpi = (label, value, sub) => `<div class="kpi"><div class="label">${label}</div>
    <div class="value">${value}</div><div class="kpi-sub">${sub}</div></div>`;

  // Follower growth from the first day both accounts were counted (rate, so the bigger account isn't favoured).
  const gr = g.rotowire, gu = g.underdog;
  const fr0 = fol.rotowire || [], fu0 = fol.underdog || [];
  const common = fr0.length && fu0.length ? [fr0[0].date, fu0[0].date].sort().pop() : null;
  const gainSince = (ser, d) => { const a0 = ser.find(p => p.date >= d), z = ser[ser.length - 1];
    return a0 && z && z.date > a0.date ? z.followers / a0.followers - 1 : null; };
  const folDays = common && fr0.length ? (new Date(fr0[fr0.length - 1].date) - new Date(common)) / 864e5 : 0;
  const folOk = folDays >= FOL_MIN_DAYS;
  const folR = folOk ? gainSince(fr0, common) : null, folU = folOk ? gainSince(fu0, common) : null;
  // Impressions growth: each week's last 4 weeks of impressions vs the 4 weeks before
  // (complete weeks), so the comparison is about pace now, not an empty July baseline.
  const sum4 = (i, side) => weeks.slice(i - 3, i + 1).reduce((t, w) => t + (w[`${side}_total_views`] || 0), 0);
  const growth = weeks.map((w, i) => i < 7 ? null : {
    week: w.week, rw: sum4(i, "rotowire") / (sum4(i - 4, "rotowire") || 1) - 1,
    ud: sum4(i, "underdog") / (sum4(i - 4, "underdog") || 1) - 1 }).filter(Boolean);
  const gNow = growth[growth.length - 1];
  // Any 3x step in RotoWire's median views per post, so the growth number carries its caveat.
  let jump = null;
  full.forEach((w, i) => { const p = full[i - 1];
    if (p && p.rotowire_median_views && w.rotowire_median_views / p.rotowire_median_views >= 3
        && (!jump || w.rotowire_median_views / p.rotowire_median_views > jump.f))
      jump = { w, p, f: w.rotowire_median_views / p.rotowire_median_views }; });

  const kpis = `<div class="kpis has-headline a-kpis">
    ${gNow ? `<div class="kpi"><div class="label">Impressions growth · last 4 weeks vs prior 4</div>
      <div class="value">RW ${pctS(gNow.rw, 0)}</div><div class="kpi-sub">UD ${pctS(gNow.ud, 0)}</div>
      ${jump ? `<div class="kpi-sub kpi-flag">RotoWire's views per post jumped ${Math.round(jump.f)}x the week of ${fmtD(jump.w.week)}; worth confirming why before quoting this.</div>` : ""}</div>` : ""}
    ${lastW ? kpi("RotoWire impressions, last week", kfmt(lastW.rotowire_total_views),
      `${rwPrevAvg ? pctS(lastW.rotowire_total_views / rwPrevAvg - 1, 0) + " vs the 4 weeks before" : ""} · week of ${fmtD(lastW.week)}`) : ""}
    ${folR != null && folU != null ? kpi(`Follower growth since ${fmtD(common)}`, pctS(folR, 2), `UD ${pctS(folU, 2)}`) : ""}</div>`;

  // One account chart with a metric picker: followers (daily line) or a weekly total from the
  // X Analytics export (bars), on the same timeline with the same news-system markers.
  const acct = (a.rotowire_account_impressions || []).filter(w => w.days === 7);
  const ACCT_METRICS = [["followers", "Followers"], ["impressions", "Impressions"], ["engagements", "Engagements"],
    ["profile_visits", "Profile visits"], ["posts", "Posts"]].filter(([k]) => k === "followers" || acct.some(w => w[k] != null));
  const metric = ACCT_METRICS.some(([k]) => k === state.acctMetric) ? state.acctMetric : "followers";
  const metricLabel = ACCT_METRICS.find(([k]) => k === metric)[1];

  // Followers all time (X Analytics export, then the pipeline's daily count), or a weekly export
  // metric, with the news-system milestones marked, drawn at the panel's real width.
  let folLead = "", folPanel = "";
  const fr = fol.rotowire || [];
  if (fr.length > 1) {
    const W = Math.max(300, (el.clientWidth || 1100) - 28), narrow = W < 560;
    const LANE_ROW = narrow ? 18 : 34;   // each extra row of event labels adds this much above the plot
    const m = { t: 52, r: narrow ? 52 : 64, b: 30, l: narrow ? 52 : 64 }, iw = W - m.l - m.r;
    const t = d => new Date(d + "T12:00:00Z").getTime();
    const t0 = t(fr[0].date), t1 = Math.max(t(fr[fr.length - 1].date), t0 + 86400e3);
    const x = d => m.l + (t(d) - t0) / (t1 - t0) * iw;
    // News-system milestones get a label lane above the plot: short name, date under it, and a
    // dot where the dashed line starts. Each label goes left or right of its line, in some row;
    // no two labels in a row may touch, and no label may be crossed by the line of a marker
    // labelled higher up. A small search finds the fewest rows that works (right side preferred).
    const lane = (state.agg.milestones || []).filter(ms => t(ms.date) >= t0 && t(ms.date) <= t1)
      .map(mk => ({ ...mk, px: x(mk.date),
        w: (narrow ? fmtD(mk.date).length : Math.max(mk.label.length, fmtD(mk.date).length)) * 7.4 }))
      .sort((p, q) => p.px - q.px);
    const span = (L, right) => right ? [L.px, L.px + 8 + L.w] : [L.px - 8 - L.w, L.px];
    const ok = (L, i) => lane.slice(0, i).every(o => {
      if (o.row === L.row && L.a0 < o.a1 + 10 && L.a1 > o.a0 - 10) return false;
      if (o.row > L.row && o.px > L.a0 - 4 && o.px < L.a1 + 4) return false;   // o's line crosses L
      if (L.row > o.row && L.px > o.a0 - 4 && L.px < o.a1 + 4) return false;   // L's line crosses o
      return true; });
    const place = (i, maxRow) => {
      if (i === lane.length) return true;
      const L = lane[i];
      for (let row = 0; row <= maxRow; row++) for (const right of [true, false]) {
        const [a0, a1] = span(L, right);
        if (a0 < 0 || a1 > W - 2) continue;
        Object.assign(L, { row, right, a0, a1 });
        if (ok(L, i) && place(i + 1, maxRow)) return true;
      }
      return false;
    };
    let found = false;
    for (let maxRow = 0; maxRow < 5 && !found; maxRow++) found = place(0, maxRow);
    // No layout fits (many markers on a narrow screen): stack them one per row.
    if (!found) lane.forEach((L, i) => { const [a0, a1] = span(L, L.px + 8 + L.w <= W - 2); Object.assign(L, { row: i, right: a1 > L.px, a0, a1 }); });
    m.t += Math.max(0, ...lane.map(L => L.row)) * LANE_ROW;
    const H = m.t + 258, ih = H - m.t - m.b;
    const isF = metric === "followers", WEEK = 7 * 86400e3;
    const wk = isF ? [] : acct.filter(w => t(w.week) >= t0 - WEEK && t(w.week) <= t1).map(w => ({ week: w.week, v: w[metric] || 0 }));
    const vals = isF ? fr.map(p => p.followers) : wk.map(w => w.v);
    const hiV = Math.max(1, ...vals), loV = Math.min(...vals);
    const lo = isF ? Math.max(0, loV - (hiV - loV) * 0.05) : 0, hi = isF ? hiV + (hiV - loV) * 0.08 : hiV * 1.1;
    const y = v => m.t + (hi - v) / (hi - lo) * ih;
    const step = [10, 25, 50, 100, 250, 500, 1e3, 2.5e3, 5e3, 1e4, 2.5e4, 5e4, 1e5, 2.5e5, 5e5, 1e6, 2.5e6, 5e6, 1e7]
      .find(st => (hi - lo) / st <= 5) || 1e7;
    let grid = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line class="t-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="t-tick" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${isF && hi - lo < 20000 ? num(v) : kfmt(v)}</text>`;
    // Month ticks; the year shows on the first tick and on January.
    let xt = "";
    const first = new Date(t0), mon = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 1));
    const months = [];
    for (let d = mon; d.getTime() <= t1; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1))) months.push(d);
    const everyM = narrow ? 3 : months.length > 9 ? 2 : 1;
    months.forEach((d, i) => { if (i % everyM) return;
      const iso = d.toISOString().slice(0, 10);
      const lab = d.toLocaleDateString("en-US", { month: "short", timeZone: "UTC" }) + (i === 0 || d.getUTCMonth() === 0 ? ` '${String(d.getUTCFullYear()).slice(2)}` : "");
      xt += `<text class="t-tick" x="${x(iso)}" y="${H - 8}" text-anchor="middle">${lab}</text>`; });
    const eras = state.agg.eras || [];
    const markSvg = lane.map(mk => {
      const px = mk.px, anchor = mk.right ? "start" : "end", dx = mk.right ? 8 : -8, up = mk.row * LANE_ROW;
      return `<line class="t-mark" x1="${px}" x2="${px}" y1="${m.t - 10 - up}" y2="${m.t + ih}"/>
      <circle class="f-mark" cx="${px}" cy="${m.t - 10 - up}" r="3.5"/>
      ${narrow ? "" : `<text class="f-mark-name halo" x="${px + dx}" y="${m.t - 28 - up}" text-anchor="${anchor}">${esc(mk.label)}</text>`}
      <text class="f-mark-date halo" x="${px + dx}" y="${m.t - 14 - up}" text-anchor="${anchor}">${fmtD(mk.date)}</text>`; }).join("");
    const e0 = eras[0];
    const band = e0 && e0.until && t(e0.until) > t0
      ? (() => { const bx = e0.first && t(e0.first) > t0 ? x(e0.first) : m.l;
          const bw = Math.min(x(e0.until), W - m.r) - bx;
          return `<rect class="t-band" x="${bx}" y="${m.t}" width="${bw}" height="${ih}"/>${bw > 150
            ? `<text class="f-mark-date" x="${bx + bw / 2}" y="${m.t + 18}" text-anchor="middle">${esc(e0.label)}</text>` : ""}`; })() : "";
    // Single-day jumps of 10k+ (consecutive days merged), labelled on the line.
    const jumps = [];
    fr.forEach((p, i) => { if (!i) return; const g = p.followers - fr[i - 1].followers;
      if (g < 10000) return;
      const last = jumps[jumps.length - 1];
      if (last && t(p.date) - t(last.to) <= 86400e3) { last.to = p.date; last.gain += g; last.top = p; }
      else jumps.push({ from: p.date, to: p.date, gain: g, top: p }); });
    const jumpSvg = jumps.map(j => `<circle class="f-jump" cx="${x(j.top.date)}" cy="${y(j.top.followers)}" r="4"/>
      <text class="t-band-label halo" x="${x(j.top.date) - 8}" y="${y(j.top.followers) + 4}" text-anchor="end">+${kfmt(j.gain)}${narrow ? "" : " " + (j.from === j.to ? fmtD(j.from) : fmtD(j.from) + "–" + fmtD(j.to).replace(/^\w+ /, ""))}</text>`).join("");
    const lp = fr[fr.length - 1];
    const isoAdd = (d, days) => new Date(t(d) + days * 86400e3).toISOString().slice(0, 10);
    const fmtY = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    // The data marks: the follower line with its jumps and end value, or one bar per Monday week.
    const marksData = isF
      ? `<path class="t-line" d="${fr.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.followers).toFixed(1)}`).join("")}"/>${jumpSvg}
         <text class="t-end" x="${x(lp.date) + 8}" y="${y(lp.followers) + 4}">${kfmt(lp.followers)}</text>`
      : wk.map(w => { const xa = Math.max(m.l, x(w.week)), xb = Math.min(W - m.r, x(isoAdd(w.week, 7)));
          return `<rect class="a-col" x="${xa + 1}" y="${y(w.v)}" width="${Math.max(1, xb - xa - 2)}" height="${Math.max(1, y(0) - y(w.v))}" rx="2"/>`; }).join("");
    // Hover: the nearest day (followers) or week (bars) gets a crosshair, dot and tooltip.
    const hoverPts = isF
      ? fr.map((p, i) => ({ cx: x(p.date), cy: y(p.followers), html: `<b>${fmtY(p.date)}</b><div>${num(p.followers)} followers</div>
          ${i ? `<div>${p.followers - fr[i - 1].followers >= 0 ? "+" : "−"}${num(Math.abs(p.followers - fr[i - 1].followers))} that day</div>` : ""}
          <div class="bl">${p.source === "x_analytics" ? "From X Analytics" : "Counted by the pipeline"}</div>` }))
      : wk.map(w => ({ cx: (Math.max(m.l, x(w.week)) + Math.min(W - m.r, x(isoAdd(w.week, 7)))) / 2, cy: y(w.v),
          html: `<b>Week of ${fmtY(w.week)}</b><div>${num(w.v)} ${metricLabel.toLowerCase()}</div><div class="bl">From X Analytics</div>` }));
    const hitsF = `<line class="t-cross hidden" y1="${m.t}" y2="${m.t + ih}"/><circle class="f-dot hidden" r="4"/>
      <rect class="t-hit f-hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}"/>`;
    state.folHover = { pts: hoverPts, m, W };
    const fromExport = fr[0].source === "x_analytics";
    const jumpGain = jumps.reduce((s2, j) => s2 + j.gain, 0), total = lp.followers - fr[0].followers;
    // Short form unless both ends round to the same thing (only a few days counted).
    const fmtF = v => kfmt(fr[0].followers) === kfmt(lp.followers) ? num(v) : kfmt(v);
    folLead = `<section class="lead"><div class="eyebrow">RotoWire followers</div>
      <h2><span class="from">${fmtF(fr[0].followers)}</span><span class="arrow" aria-label="to">→</span><span class="to">${fmtF(lp.followers)}</span></h2>
      <p>Since ${fmtY(fr[0].date)}${jumps.length && total > 0 ? `; ${Math.round(jumpGain / total * 100)}% of the gain came on ${jumps.length === 1 ? "one jump" : jumps.length + " jumps"} marked on the chart` : ""}.</p></section>`;
    const note = isF
      ? (fromExport
        ? `Daily, from RotoWire's X Analytics export (new follows minus unfollows, walked back from the first real count) up to ${fmtD((fr.find(p => p.source !== "x_analytics") || lp).date)}, then counted by the pipeline.`
        : `Counted once a day since ${fmtD(fr[0].date)}.`) + (!folOk && common ? ` Underdog's count starts ${fmtD(common)}, so growth against it shows once both have ${FOL_MIN_DAYS} days.` : "")
      : `Weekly totals for the whole account (Monday weeks, complete weeks only), from its X Analytics export.`;
    folPanel = `<div class="panel a-panel"><div class="trend-head"><div><h3>RotoWire ${metricLabel.toLowerCase()} over time</h3>
      <p class="type-note">${note}</p></div>
      ${ACCT_METRICS.length > 1 ? `<div class="seg acct-seg" role="group" aria-label="Metric">${ACCT_METRICS.map(([k, l]) =>
        `<button type="button" data-k="${k}" class="${k === metric ? "on" : ""}" aria-pressed="${k === metric}">${l}</button>`).join("")}</div>` : ""}</div>
      <div class="trend-plot"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="RotoWire ${metricLabel.toLowerCase()} over time">
        ${band}${grid}${xt}${markSvg}${marksData}${hitsF}</svg><div class="t-tip hidden"></div></div>
      ${jump && metric === "impressions" ? `<p class="a-flag">Week of ${fmtD(jump.w.week)}: median views per news post jumped from ${kfmt(jump.p.rotowire_median_views)} to
        ${kfmt(jump.w.rotowire_median_views)} and stayed up. Worth confirming why before quoting these numbers.</p>` : ""}</div>`;
  }

  // Comps: impressions growth vs Underdog, the latest 4 weeks vs the 4 before, one bar each.
  let impComp = "";
  if (gNow) {
    const maxG = Math.max(0.01, gNow.rw, gNow.ud);
    const gbar = (label, v, cls) => `<div class="a-bar" title="${esc(`${label}: ${pctS(v, 0)} impressions, the 4 weeks to ${fmtD(gNow.week)} vs the 4 weeks before`)}">
      <div class="a-bar-lab">${label}</div>
      <div class="a-bar-track"><div class="a-track"><div class="a-bar-fill ${cls} strong" style="width:${(Math.max(0, v) / maxG * 100).toFixed(1)}%"></div></div>
      <span class="a-bar-val">${pctS(v, 0)}</span></div></div>`;
    impComp = `<div class="panel a-panel"><h3>Impressions growth vs Underdog</h3>
      <p class="type-note">News-post impressions in the 4 weeks to ${fmtD(gNow.week)} vs the 4 weeks before. Growth rate, so the bigger account isn't favoured. Both accounts are comparable from ${fmtD(weeks[0].week)}, when live collection started.</p>
      <div class="a-bars">${gbar("RotoWire", gNow.rw, "rw")}${gbar("Underdog", gNow.ud, "ud")}</div></div>`;
  }
  // Follower growth vs Underdog: percent gained since the first count, one line each.
  let folComp = "";
  const fu = fol.underdog || [];
  if (folOk && fr.filter(p => p.date >= common).length > 1 && fu.filter(p => p.date >= common).length > 1) {
    const W = 560, H = 210, m = { t: 14, r: 86, b: 28, l: 52 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const pctOf = ser => ser.map(p => ({ date: p.date, v: p.followers / ser[0].followers - 1 }));
    const pr = pctOf(fr.filter(p => p.date >= common)), pu = pctOf(fu.filter(p => p.date >= common)), dates = [...new Set([...pr, ...pu].map(p => p.date))].sort();
    const hi = Math.max(0.001, ...pr.map(p => p.v), ...pu.map(p => p.v)) * 1.15;
    const x = d => m.l + dates.indexOf(d) / Math.max(1, dates.length - 1) * iw, y = v => m.t + (1 - v / hi) * ih;
    const step = [0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1].find(st => hi / st <= 5) || 0.1;
    let svg = "";
    for (let v = 0; v <= hi; v += step) svg += `<line class="${v ? "t-grid" : "t-zero"}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="t-tick" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v ? pctS(v, step < 0.01 ? 2 : 1) : "0%"}</text>`;
    const lr = pr[pr.length - 1], lu = pu[pu.length - 1];
    const gap = Math.abs(y(lr.v) - y(lu.v)) < 14 ? (y(lr.v) < y(lu.v) ? -7 : 7) : 0;
    [[pu, "ud", "UD", -gap], [pr, "rw", "RW", gap]].forEach(([ser, c, l, dy]) => {
      const last = ser[ser.length - 1];
      svg += `<path class="s-line ${c}" d="${ser.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join("")}"/>
        <text class="s-end ${c}" x="${x(last.date) + 8}" y="${y(last.v) + 4 + dy}">${l} ${pctS(last.v, 2)}</text>`; });
    svg += dates.map(d => `<text class="t-tick" x="${x(d)}" y="${H - 8}" text-anchor="middle">${fmtD(d)}</text>`)
      .filter((_, i) => i % Math.max(1, Math.ceil(dates.length / 6)) === 0 || i === dates.length - 1).join("");
    folComp = `<div class="panel a-panel"><h3>Follower growth vs Underdog</h3>
      <p class="type-note">Percent gained since ${fmtD(common)}, the first day both were counted, so the bigger account isn't favoured. The higher line is growing faster.</p>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Follower growth, RotoWire vs Underdog">${svg}</svg></div>`;
  }
  // Same story, both feeds: RotoWire's views as a fraction of Underdog's. One sentence, because
  // the fraction barely moves with who posted first; it is a reach gap, not a speed gap.
  const oneIn = r => r && r.rotowire_share ? `1/${Math.round(1 / r.rotowire_share)}` : null;
  const shAll = oneIn(h.all), shFirst = oneIn(h.rotowire_first), shLate = oneIn(h.underdog_first_10m);
  const sharePanel = shAll ? `<div class="panel a-panel"><h3>Views on the same story</h3>
    <p class="a-finding">On a story both accounts posted, RotoWire gets about <b>${shAll}</b> of Underdog's views${shFirst
      ? `, ${shFirst === shAll ? "the same" : shFirst} when RotoWire posts first` : ""}${shLate ? `; ${shLate} when Underdog is 10+ minutes faster` : ""}.</p>
    <p class="type-note" style="margin:6px 0 0">Median of RotoWire's views ÷ Underdog's over ${num(h.all.stories)} matched stories
      (RotoWire first ${num((h.rotowire_first || {}).stories || 0)}, Underdog first by 10+ min ${num((h.underdog_first_10m || {}).stories || 0)}).
      Posting first barely changes it, so the gap is reach, not speed.</p></div>` : "";

  el.innerHTML = `${folLead}<div class="a-grid one">${folPanel}</div>${kpis}
    <h3 class="a-sub">Compared with Underdog</h3>
    <div class="a-grid${impComp && folComp ? "" : " one"}">${impComp}${folComp}</div>
    ${sharePanel ? `<div class="a-grid one">${sharePanel}</div>` : ""}`;
  wireFollowerHover(el);
  el.querySelectorAll(".acct-seg button").forEach(b => b.onclick = () => { state.acctMetric = b.dataset.k; renderAudience(); });
  applyTopMode();
}

// Tooltip on the account chart: the nearest day (followers) or week (bars), built in renderAudience.
function wireFollowerHover(root) {
  const fh = state.folHover, hit = root.querySelector(".f-hit");
  if (!fh || !hit) return;
  const svg = hit.ownerSVGElement, plot = svg.parentElement;
  const tip = plot.querySelector(".t-tip"), cross = svg.querySelector(".t-cross"), dot = svg.querySelector(".f-dot");
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    let p = fh.pts[0], best = Infinity;
    fh.pts.forEach(q => { const d = Math.abs(q.cx - px); if (d < best) { best = d; p = q; } });
    cross.setAttribute("x1", p.cx); cross.setAttribute("x2", p.cx); cross.classList.remove("hidden");
    dot.setAttribute("cx", p.cx); dot.setAttribute("cy", p.cy); dot.classList.remove("hidden");
    tip.innerHTML = p.html;
    tip.classList.remove("hidden");
    tip.style.left = Math.min(Math.max(p.cx - tip.offsetWidth / 2, 0), fh.W - tip.offsetWidth) + "px";
    tip.style.top = (fh.m.t + 6) + "px";
  };
  const hide = () => { tip.classList.add("hidden"); cross.classList.add("hidden"); dot.classList.add("hidden"); };
  hit.addEventListener("mousemove", show);
  hit.addEventListener("touchstart", show, { passive: true });
  hit.addEventListener("touchmove", show, { passive: true });
  hit.addEventListener("mouseleave", hide);
}

// ---- tabs + init ----
function showView(name) {
  if (name === "types" && !(state.agg.news_types || {}).types?.length) name = "feed";
  if (name === "hours" && !(state.agg.hours || []).length) name = "feed";
  if (name === "staff" && !((state.agg.staffing || {}).days || []).length) name = "feed";
  if (name === "games" && !((state.agg.game_windows || {}).windows || []).length) name = "feed";
  if (name === "practice" && !state.agg.practice) name = "feed";
  if (name === "focus" && !((state.agg.focus || {}).groups || []).length) name = "weekly";
  state.view = name;
  document.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.view === name;
    t.classList.toggle("active", on); t.setAttribute("aria-selected", on); t.tabIndex = on ? 0 : -1;
    t.setAttribute("aria-controls", "view-" + t.dataset.view); });
  VIEWS.forEach(v => {
    const sec = document.getElementById("view-" + v);
    sec.classList.toggle("hidden", v !== name); sec.setAttribute("role", "tabpanel"); });
  const act = document.querySelector(".tab.active");
  if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
  updateTabFade();
}
// Opens on what to work on (Focus areas), or the weekly record when there is none.
const defaultView = () => ((state.agg && state.agg.focus) || {}).groups?.length ? "focus" : "weekly";

// Edge fades on the tab strip when tabs are scrolled out of view.
function updateTabFade() {
  const t = document.getElementById("tabs"), w = document.getElementById("tabs-wrap");
  if (!t || !w) return;
  w.classList.toggle("fade-l", t.scrollLeft > 2);
  w.classList.toggle("fade-r", t.scrollLeft + t.clientWidth < t.scrollWidth - 2);
}

function init() {
  const gen = state.agg.generated_at;
  const label = state.sportMeta ? state.sportMeta.label : "";
  document.getElementById("subtitle").innerHTML =
    `@${esc(state.handles.rotowire)} vs @${esc(state.handles.underdog)}` +
    (label ? ` — ${esc(label)} news-speed comparison. ` : " news-speed comparison. ") +
    `<span id="generated">${gen ? "Updated " + esc(fmtTime(gen)) : ""}</span>`;
  renderKpis();
  renderTrend();

  // event filter options
  const events = [...new Set(state.stories.map(s => s.event_class).filter(Boolean))].sort();
  document.getElementById("f-event").innerHTML =
    `<option value="">all</option>` + events.map(e => `<option>${e}</option>`).join("");
  // Wire input/tab handlers once — init() re-runs on every sport switch.
  if (!state.wired) {
    ["f-from","f-to","f-event","f-player","f-conf","f-status"].forEach(id =>
      document.getElementById(id).addEventListener("input", renderFeed));
    document.querySelectorAll(".tab").forEach(t => t.onclick = () => showView(t.dataset.view));
    // Arrow keys move between visible tabs (WAI-ARIA tabs pattern).
    document.getElementById("tabs").addEventListener("keydown", e => {
      const tabs = [...document.querySelectorAll(".tab:not(.hidden)")];
      const i = tabs.indexOf(document.activeElement);
      if (i < 0) return;
      const j = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
      if (j == null) return;
      e.preventDefault();
      const t = tabs[(j + tabs.length) % tabs.length];
      showView(t.dataset.view); t.focus();
    });
    document.getElementById("tabs").addEventListener("scroll", updateTabFade, { passive: true });
    window.addEventListener("resize", updateTabFade);
    document.querySelectorAll("#mode-row button").forEach(b => b.onclick = () => {
      state.topMode = b.dataset.m;
      applyTopMode(); if (state.topMode === "timing") renderTrend(); else renderAudience(); });
    state.topMode = "audience";   // always opens on Audience; a Timing pick lasts until reload
    state.wired = true;
  }

  renderFeed();
  // Sports with a season calendar (NFL: Tue-Mon weeks) roll up by season week instead of ISO week.
  const seasonWeeks = (state.agg.season_weeks || []).map(r => ({ ...r,
    period: r.start ? `${r.period} · ${fmtWeekRange(r.start, r.end)}` : `${r.period} · thru ${fmtWeekRange(r.end)}` }));
  renderRollup(document.getElementById("view-weekly"), seasonWeeks.length ? seasonWeeks : (state.agg.weekly || []), "week");
  renderRollup(document.getElementById("view-monthly"), state.agg.monthly || [], "month");
  renderTypes();
  renderHours();
  renderStaff();
  renderGames();
  renderPractice();
  renderAudience();
  renderFocus();
  renderCustom();
  renderGaps();
  renderDups();
  if (state.sport !== ALL) showView(state.view || defaultView());
}

boot();
</script>
</body>

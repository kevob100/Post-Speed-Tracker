sports:
  nfl:
    label: NFL
    active: true
    backfill_start_date: '2026-07-06'
    # Score each news development once (first post per side) instead of the closest
    # pair of posts. See src/develop.py.
    match_mode: developments
    # Eras compared under the trend chart (US Central dates; `until` is exclusive).
    # Jul 24 is mass adoption: the day the desk switched over to the new news system for NFL.
    eras:
    - {label: Before mass adoption, until: '2026-07-24'}
    - {label: News system 1.0 (mass adoption), from: '2026-07-24', until: '2026-09-29'}
    - {label: News system 2.0, from: '2026-09-29'}
    # Hype kinds counted as news anyway (err toward matching more). The post keeps its
    # label as `borderline` so it can be reviewed. soundbite and other (clips) stay out.
    include_hype_kinds: [rumor, in_game_note, non_fantasy]
    # Game windows (By game windows tab): kickoffs from ESPN, cached in data/nfl/games.json.
    # Window = kickoff - before_hours (rounded down to the hour) to kickoff + after_hours
    # (primetime_after_hours from primetime_from on), rounded up. Injury reports land ~90m
    # before kickoff, hence 2h before.
    # Label each practice post pre- or post-practice (Practice tab).
    practice_phases: true
    # Desk Speed panel (src/desk_speed.py): News Admin's per-tweet desk timeline, pulled
    # with ROTOWIRE_MCP_TOKEN. Skipped quietly without the token.
    desk_speed:
      league: nfl
      # NFL turbo scan (News Admin RD-8036): sources scanned every `seconds` inside these
      # ET windows instead of every `normal_seconds`. Mirror of News Admin's
      # config/scraper.php -> nfl_scan_schedule; keep the two in sync. day: 0 = Sunday.
      turbo:
        since: '2026-10-05'
        timezone: America/New_York
        seconds: 10
        normal_seconds: 30
        windows:
        - {day: 0, start: '06:00', end: '08:00'}
        - {day: 0, start: '11:00', end: '18:00'}
        - {day: 3, start: '12:00', end: '18:00'}
        - {day: 4, start: '12:00', end: '19:00'}
        - {day: 5, start: '12:00', end: '17:00'}
      # The Jira initiative this work rolls up to (Roadmap tab), pulled nightly: its epics
      # and every ticket under them. Prioritized = assigned to prioritize_assignee and in
      # an open sprint (active or next); everything else not done is backlog.
      initiative:
        root: RD-8097
        label: Breaking News AI
        prioritize_assignee: Matthew Kulina
      # Shipped changes the Summary's "Is it working?" cards measure: the metric(s) each
      # targets, 14 days before `live` vs since. Metrics: arrival_turbo, arrival, open_to_x,
      # edited_pct, change_pct, margin, manual_pct. The first `main: true` leads the card.
      changes:
      - key: RD-8036
        label: Turbo mode
        live: '2026-10-05'
        metrics:
        - {metric: arrival_turbo, label: 'Sent to in Monitor, turbo windows', main: true}
      - key: RD-8090
        label: Practice report templates
        live: '2026-10-09'
        metrics:
        - {metric: edited_pct, label: Posts edited, main: true}
        - {metric: change_pct, label: Share of draft changed}
      - key: RD-8092
        label: Transaction templates
        live: '2026-10-13'
        metrics:
        - {metric: edited_pct, label: Posts edited, main: true}
        - {metric: change_pct, label: Share of draft changed}
      # Hand-labeled sample of what editors change (Details > Editing, Summary spotlight). Rerun
      # ~/Code/rotowire-news/data/edits/classify_edits.py on a fresh sample and update the counts.
      # Buckets run worst to lightest; style + minor are edits the post didn't need.
      edit_breakdown:
        sample: 52 exact drafts, 10/14-10/15
        buckets:
        - {key: wrong, label: Draft was wrong, n: 19, color: '#e0702e', needed: true, detail: 'a status invented from an image-only report (5), no news in the draft (5), the Monitor picked a non-news tweet (5), wrong player, injury or status (4)', tickets: [RD-8171, RD-8114], no_ticket: ['Monitor picking non-news tweets (stat lines, milestones, features)']}
        - {key: content, label: 'Facts right, detail added or cut', n: 14, color: '#9a7fd8', needed: true, detail: 'added the participation level or injury tag (9), cut speculation (3), newer detail (2)', tickets: [RD-8090], no_ticket: ['Templates on beat-writer practice news and "did not practice" (asked Kulina 10/15)']}
        - {key: style, label: 'Same facts, house style', n: 14, color: '#a8902c', needed: false, detail: 'official injury-report wording, quote marks, credit to the team account', tickets: [RD-8090], no_ticket: ['Templates on beat-writer practice news and "did not practice" (asked Kulina 10/15)']}
        - {key: minor, label: Small rewording, n: 4, color: '#2aa5bb', needed: false, detail: 'synonyms and word order, same meaning', no_ticket: ['Desk call: these could have gone out as drafted']}
        - {key: none, label: Posted as drafted, n: 1, color: '#5b6672', needed: false, detail: ''}
      # The tickets behind each step (Summary: "What we're doing about it"). Status comes
      # from Jira when JIRA_EMAIL / JIRA_API_TOKEN are set, else data/nfl/jira_tickets.json.
      roadmap:
      - step: s1
        label: Getting tweets in
        tickets:
        - {key: RD-8036, title: Turbo scan mode for peak windows}
      - step: s2
        label: Finding them in the Monitor
        tickets:
        - {key: RD-8112, title: Note editor as a modal with step tabs}
        - {key: RD-8164, title: Earliest Monitor tweet about the same player}
        - {key: RD-8037, title: Injury report quick view for key players}
        no_ticket:
        - Add the accounts Underdog credits to the Monitor list (KOB, weekly)
      - step: s3
        label: Posting them
        tickets:
        - {key: RD-8090, title: Practice report templates}
        - {key: RD-8091, title: Game day templates}
        - {key: RD-8092, title: Transaction templates}
        - {key: RD-8094, title: Practice report watchlist and auto updates}
        - {key: RD-8168, title: Record which template wrote each draft}
        - {key: RD-8169, title: Templates and their revision history in the MCP}
        - {key: RD-8171, title: Stop inventing a status from image-only sources}
        - {key: RD-8114, title: Read NFL injury report images}
      - step: hand
        label: Added by hand
        tickets:
        - {key: RD-8163, title: Add Line posts in the speed data}
      # Not one of the three steps: work taken off the desk so editors spend their time on
      # posting. `replaces` is the manual job each one removes.
      - step: work
        label: Removing manual work
        tickets:
        - {key: RD-8096, title: Automatic "more details" reply on NFL posts, replaces: 'KOB replying to every post by hand with more details and a link to the full note'}
        - {key: RD-8113, title: Slack ping on every post on X, replaces: 'KOB pinging the desk by hand so they know which note to write'}
    # Who Underdog credits (src/credits.py). Underdog often credits by reporter name
    # ("Schefter: ...") rather than handle; these map the names it uses to accounts. A
    # name prefix not listed here is read as a coach/GM press-conference quote.
    # monitor_list_id is the X list the News Admin Monitor ingests for NFL (owned by KOB).
    underdog_credits:
      monitor_list_id: '103681593'
      # Weekly Monday post goes to #news-project-core (private) via SLACK_WEBHOOK_URL.
      # Accounts KOB doesn't want added (column A, shared as anyone-with-link can view).
      dismiss_sheet: 1-LaeA5IxKmL7wYWD0Jadsp8CA7F4Fc-qQEG0acEhswI
      names:
        Schefter: AdamSchefter
        Rap: RapSheet
        Rapoport: RapSheet
        Fowler: JFowlerESPN
        Schultz: Schultz_Report
        Pelissero: TomPelissero
        Garafolo: MikeGarafolo
        Glazer: JayGlazer
        Graziano: DanGraziano
        Breer: AlbertBreer
        Darlington: JeffDarlington
        Russini: DMRussini
        Silver: MikeSilver
        Howe: JeffPHowe
        Wolfe: CameronWolfe
    game_windows:
      source: espn
      season: 2026
      timezone: America/Chicago
      before_hours: 2
      after_hours: 3
      primetime_from: '18:00'   # 7pm ET
      primetime_after_hours: 4
    # A one-sided Underdog post about a player RotoWire has never posted about counts as
    # "below RotoWire's bar" (not missed) only when he ranks outside Sleeper's top N.
    fantasy_rank_cutoff: 120
    # Staffing schedules (By staff tab), rebuilt from these Google Sheets each run
    # (src/staffing_import.py). X Watcher is the source from 2026-10-04 on; the Breaking
    # News Schedule (NFL + NFL News columns) fills earlier days. Aliases join the two
    # sheets' spellings of one person.
    staffing_sheets:
      x_watcher_sheet: 1aHh9n2TMrB_SGi8voWNNj2yyqlCkPuq4Quc_AdLzdPI
      breaking_news_sheet: 1ZUK_2o5l35Q7aSV_Xu_-4worspeBgEMekTmtB4dM8oE
      since: '2026-04-01'
      timezone: America/Chicago   # the sheets are written in Central
      aliases: {Kevin: KOB, Eric: Eric C.}
    # Source tweet lookup (src/source.py): find the reporter tweet a matched story credits,
    # so each side gets an absolute time to post. Each story is searched once and cached.
    source_lookup:
      window_hours: 6
      max_searches_per_run: 300
      max_minutes: 20
    # One-time fetch of quote-tweet links for posts stored before collection kept them.
    reference_backfill_since: '2026-09-01'
    # NFL weeks run Tuesday to Monday. The 5am CT rollover keeps late Monday-night news
    # with that week's games. Anything before Week 1 rolls up as Preseason.
    season_weeks:
      start: '2026-09-08'
      boundary: '05:00'
      timezone: America/Chicago
    accounts:
      rotowire:
        handle: RotoWireNFL
        sprout_profile_id: 5872832
        user_id: '2542083714'
      underdog:
        handle: UnderdogNFL
        user_id: '1449054490062110725'
  mlb:
    label: MLB
    active: true
    accounts:
      rotowire:
        handle: RotoWireMLB
        sprout_profile_id: 5872860
        user_id: '2426328866'
      underdog:
        handle: UnderdogMLB
        user_id: '1449055868880818178'
  nba:
    label: NBA
    active: true
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireNBA
        sprout_profile_id: 5872842
        user_id: '2291803664'
      underdog:
        handle: UnderdogNBA
        user_id: '1448762998840074240'
  wnba:
    label: WNBA
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireWNBA
        sprout_profile_id: 6132781
        user_id: '1136446644822642688'
      underdog:
        handle: UnderdogWNBA
        user_id: '1577742107929968640'
  golf:
    label: Golf
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireGolf
        sprout_profile_id: 5872851
        user_id: '758773982753587204'
      underdog:
        handle: UnderdogGolf
        user_id: '1550241147787829250'
# RotoWire workflow releases, drawn as markers on the dashboard's trend chart. Add the next
# release here (date = the day it went live, US Central).
milestones:
- date: '2026-05-01'
  label: News system 1.0
- date: '2026-07-24'
  label: Mass adoption
- date: '2026-09-29'
  label: News system 2.0
matching:
  # Posts about a player chain into one session while consecutive posts are this close.
  time_window_minutes: 90
  # Development matching (NFL): the other account's FIRST post on a player can still join
  # a one-account session this long after its last post, and the two sides' first posts on
  # the same development are scored as a match when they are within this window. The
  # model still decides whether they are the same development.
  match_window_minutes: 360
  min_match_confidence: 0.75
  compatible_event_classes:
    injury:
    - injury
    status:
    - status_change
    transaction:
    - roster_move
    role:
    - role_change
impressions:
  freeze_hours: 12
# Sprout Social (src/sprout.py): RotoWire's daily followers and account totals for every
# sport, via each rotowire account's sprout_profile_id. Filled from `since` once, then the
# last refresh_days are re-read each run.
sprout:
  since: '2025-10-01'
  refresh_days: 7
collection:
  backfill_start_date: '2026-05-29'
  # One-time history from full-archive search for every active account, from this date up
  # to its oldest stored post (the timeline endpoint only reaches ~3,200 posts back).
  archive_start: '2026-04-01'
  exclude:
  - retweets
  - replies
llm:
  model: claude-sonnet-4-6

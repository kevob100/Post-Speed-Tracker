sports:
  nfl:
    label: NFL
    active: true
    backfill_start_date: '2026-07-06'
    # Score each news development once (first post per side) instead of the closest
    # pair of posts. See src/develop.py.
    match_mode: developments
    # One-time fetch of quote-tweet links for posts stored before collection kept them.
    reference_backfill_since: '2026-09-01'
    # NFL weeks run Tuesday to Monday. The 6am ET rollover keeps late Monday-night news
    # with that week's games. Anything before Week 1 rolls up as Preseason.
    season_weeks:
      start: '2026-09-08'
      boundary: '06:00'
      timezone: America/New_York
    accounts:
      rotowire:
        handle: RotoWireNFL
        user_id: '2542083714'
      underdog:
        handle: UnderdogNFL
        user_id: '1449054490062110725'
  mlb:
    label: MLB
    active: true
    accounts:
      rotowire:
        handle: RotoWireMLB
        user_id: '2426328866'
      underdog:
        handle: UnderdogMLB
        user_id: '1449055868880818178'
  nba:
    label: NBA
    active: true
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireNBA
        user_id: '2291803664'
      underdog:
        handle: UnderdogNBA
        user_id: '1448762998840074240'
  wnba:
    label: WNBA
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireWNBA
        user_id: '1136446644822642688'
      underdog:
        handle: UnderdogWNBA
        user_id: '1577742107929968640'
  golf:
    label: Golf
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireGolf
        user_id: '758773982753587204'
      underdog:
        handle: UnderdogGolf
        user_id: '1550241147787829250'
# RotoWire workflow releases, drawn as markers on the dashboard's trend chart. Add the next
# release here (date = the day it went live, US Eastern).
milestones:
- date: '2026-05-01'
  label: News system 1.0
- date: '2026-09-29'
  label: News system 2.0
matching:
  time_window_minutes: 90
  min_match_confidence: 0.75
  compatible_event_classes:
    injury:
    - injury
    status:
    - status_change
    transaction:
    - roster_move
    role:
    - role_change
impressions:
  freeze_hours: 12
collection:
  backfill_start_date: '2026-05-29'
  # One-time history from full-archive search for every active account, from this date up
  # to its oldest stored post (the timeline endpoint only reaches ~3,200 posts back).
  archive_start: '2026-04-01'
  exclude:
  - retweets
  - replies
llm:
  model: claude-sonnet-4-6

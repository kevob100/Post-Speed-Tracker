sports:
  nfl:
    label: NFL
    active: true
    backfill_start_date: '2026-07-06'
    # Score each news development once (first post per side) instead of the closest
    # pair of posts. See src/develop.py.
    match_mode: developments
    # Eras compared under the trend chart (US Eastern dates; `until` is exclusive).
    # Jul 24 is mass adoption: the day the desk switched over to the new news system for NFL.
    eras:
    - {label: Before mass adoption, until: '2026-07-24'}
    - {label: News system 1.0 (mass adoption), from: '2026-07-24', until: '2026-09-29'}
    - {label: News system 2.0, from: '2026-09-29'}
    # Hype kinds counted as news anyway (err toward matching more). The post keeps its
    # label as `borderline` so it can be reviewed. soundbite and other (clips) stay out.
    include_hype_kinds: [rumor, in_game_note, non_fantasy]
    # Game windows (By game windows tab): kickoffs from ESPN, cached in data/nfl/games.json.
    # Window = kickoff - before_hours (rounded down to the hour) to kickoff + after_hours
    # (primetime_after_hours from primetime_from on), rounded up. Injury reports land ~90m
    # before kickoff, hence 2h before.
    # Label each practice post pre- or post-practice (Practice tab).
    practice_phases: true
    game_windows:
      source: espn
      season: 2026
      timezone: America/New_York
      before_hours: 2
      after_hours: 3
      primetime_from: '19:00'
      primetime_after_hours: 4
    # A one-sided Underdog post about a player RotoWire has never posted about counts as
    # "below RotoWire's bar" (not missed) only when he ranks outside Sleeper's top N.
    fantasy_rank_cutoff: 120
    # Staffing schedules (By staff tab), rebuilt from these Google Sheets each run
    # (src/staffing_import.py). X Watcher is the source from 2026-10-04 on; the Breaking
    # News Schedule (NFL + NFL News columns) fills earlier days. Aliases join the two
    # sheets' spellings of one person.
    staffing_sheets:
      x_watcher_sheet: 1aHh9n2TMrB_SGi8voWNNj2yyqlCkPuq4Quc_AdLzdPI
      breaking_news_sheet: 1ZUK_2o5l35Q7aSV_Xu_-4worspeBgEMekTmtB4dM8oE
      since: '2026-04-01'
      timezone: America/New_York
      aliases: {Kevin: KOB, Eric: Eric C.}
    # Source tweet lookup (src/source.py): find the reporter tweet a matched story credits,
    # so each side gets an absolute time to post. Each story is searched once and cached.
    source_lookup:
      window_hours: 6
      max_searches_per_run: 1500
    # One-time fetch of quote-tweet links for posts stored before collection kept them.
    reference_backfill_since: '2026-09-01'
    # NFL weeks run Tuesday to Monday. The 6am ET rollover keeps late Monday-night news
    # with that week's games. Anything before Week 1 rolls up as Preseason.
    season_weeks:
      start: '2026-09-08'
      boundary: '06:00'
      timezone: America/New_York
    accounts:
      rotowire:
        handle: RotoWireNFL
        sprout_profile_id: 5872832
        user_id: '2542083714'
      underdog:
        handle: UnderdogNFL
        user_id: '1449054490062110725'
  mlb:
    label: MLB
    active: true
    accounts:
      rotowire:
        handle: RotoWireMLB
        sprout_profile_id: 5872860
        user_id: '2426328866'
      underdog:
        handle: UnderdogMLB
        user_id: '1449055868880818178'
  nba:
    label: NBA
    active: true
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireNBA
        sprout_profile_id: 5872842
        user_id: '2291803664'
      underdog:
        handle: UnderdogNBA
        user_id: '1448762998840074240'
  wnba:
    label: WNBA
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireWNBA
        sprout_profile_id: 6132781
        user_id: '1136446644822642688'
      underdog:
        handle: UnderdogWNBA
        user_id: '1577742107929968640'
  golf:
    label: Golf
    active: false
    backfill_start_date: '2026-07-06'
    accounts:
      rotowire:
        handle: RotoWireGolf
        sprout_profile_id: 5872851
        user_id: '758773982753587204'
      underdog:
        handle: UnderdogGolf
        user_id: '1550241147787829250'
# RotoWire workflow releases, drawn as markers on the dashboard's trend chart. Add the next
# release here (date = the day it went live, US Eastern).
milestones:
- date: '2026-05-01'
  label: News system 1.0
- date: '2026-07-24'
  label: Mass adoption
- date: '2026-09-29'
  label: News system 2.0
matching:
  # Posts about a player chain into one session while consecutive posts are this close.
  time_window_minutes: 90
  # Development matching (NFL): the other account's FIRST post on a player can still join
  # a one-account session this long after its last post, and the two sides' first posts on
  # the same development are scored as a match when they are within this window. The
  # model still decides whether they are the same development.
  match_window_minutes: 360
  min_match_confidence: 0.75
  compatible_event_classes:
    injury:
    - injury
    status:
    - status_change
    transaction:
    - roster_move
    role:
    - role_change
impressions:
  freeze_hours: 12
# Sprout Social (src/sprout.py): RotoWire's daily followers and account totals for every
# sport, via each rotowire account's sprout_profile_id. Filled from `since` once, then the
# last refresh_days are re-read each run.
sprout:
  since: '2025-10-01'
  refresh_days: 7
collection:
  backfill_start_date: '2026-05-29'
  # One-time history from full-archive search for every active account, from this date up
  # to its oldest stored post (the timeline endpoint only reaches ~3,200 posts back).
  archive_start: '2026-04-01'
  exclude:
  - retweets
  - replies
llm:
  model: claude-sonnet-4-6

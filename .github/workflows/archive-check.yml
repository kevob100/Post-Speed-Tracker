name: archive-access-check

# One-off, read-only probe: can this repo's X token use full-archive search, and does the
# user timeline reach back before May 2026? Prints status codes and counts only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe X API access
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          probe() {
            local name="$1" url="$2"
            code=$(curl -s -o body.json -w '%{http_code}' -H "Authorization: Bearer $X_BEARER_TOKEN" "$url")
            count=$(python3 -c "import json;d=json.load(open('body.json'));print(d.get('meta',{}).get('result_count', len(d.get('data',[])) if isinstance(d.get('data'),list) else '-'))" 2>/dev/null)
            detail=$(python3 -c "import json;d=json.load(open('body.json'));e=d.get('errors') or [d] if 'title' in d else d.get('errors') or [];print('; '.join(str(x.get('title') or x.get('message') or '')+' '+str(x.get('detail') or '') for x in e)[:300])" 2>/dev/null)
            echo "$name -> HTTP $code, results=$count ${detail:+| $detail}"
          }
          # 1. Full-archive search for RotoWireNFL in April 2026 (needs Pro/Enterprise access).
          probe "search/all  (Apr 2026)" "https://api.twitter.com/2/tweets/search/all?query=from:RotoWireNFL&start_time=2026-04-01T00:00:00Z&end_time=2026-04-30T00:00:00Z&max_results=10"
          # 2. Recent search (last 7 days only) as a control.
          probe "search/recent (control)" "https://api.twitter.com/2/tweets/search/recent?query=from:RotoWireNFL&max_results=10"
          # 3. User timeline before May 2026 (capped at an account's latest 3,200 posts).
          probe "user timeline (Apr 2026)" "https://api.twitter.com/2/users/2542083714/tweets?start_time=2026-04-01T00:00:00Z&end_time=2026-04-30T00:00:00Z&max_results=10"
          # 4. Usage / plan cap, if the endpoint is available to this app.
          probe "usage/tweets" "https://api.twitter.com/2/usage/tweets"
          python3 -c "import json;d=json.load(open('body.json')).get('data',{});print('usage cap:', d.get('project_cap'), 'used:', d.get('project_usage'), 'resets day:', d.get('cap_reset_day'))" 2>/dev/null || true

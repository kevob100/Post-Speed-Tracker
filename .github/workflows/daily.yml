name: daily-pipeline

# Scheduled production run (PRD Phase B / section 15):
#   collect -> classify (LLM) -> match -> resolve -> build aggregates, then commit
#   refreshed data/ + docs/data/ back to the repo and publish docs/ to GitHub Pages.
# NEVER touches reviews.jsonl (human-owned).

on:
  schedule:
    # 05:01 UTC = 1:01am ET in daylight time, 12:01am ET in standard time. Cron is UTC-only,
    # so this stays after midnight ET all year and each run captures the full previous day.
    - cron: "1 5 * * *"
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write            # commit refreshed artifacts back to the repo
  pages: write               # deploy to GitHub Pages
  id-token: write            # required by the Pages deploy action

concurrency:
  group: daily-pipeline
  cancel-in-progress: false  # never interrupt a run mid-commit

jobs:
  run:
    runs-on: ubuntu-latest
    # A healthy run takes under an hour; fail fast instead of sitting out GitHub's 6-hour limit.
    timeout-minutes: 120
    outputs:
      page_artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"   # stream progress into the log, so a stall shows where it is
          # X dev app with the biggest budget; the access token is @RotoWireNFL's, which also
          # unlocks its own posts' non-public metrics. X_BEARER_TOKEN is only the fallback.
          X_NFL_API_KEY: ${{ secrets.X_NFL_API_KEY }}
          X_NFL_API_SECRET: ${{ secrets.X_NFL_API_SECRET }}
          X_NFL_ACCESS_TOKEN: ${{ secrets.X_NFL_ACCESS_TOKEN }}
          X_NFL_ACCESS_SECRET: ${{ secrets.X_NFL_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SPROUT_SOCIAL_TOKEN: ${{ secrets.SPROUT_SOCIAL_TOKEN }}
          SPROUT_CUSTOMER_ID: ${{ secrets.SPROUT_CUSTOMER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The pipeline is idempotent (since_id state + classification/verdict caches),
        # so retrying is safe and cheap — it absorbs transient X/Anthropic API hiccups
        # (rate limits, 5xx) that would otherwise fail the whole scheduled run.
        run: |
          for attempt in 1 2 3; do
            if python -m src.pipeline; then
              exit 0
            fi
            echo "::warning::pipeline attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          echo "::error::pipeline failed after 3 attempts"
          exit 1

      - name: Commit refreshed data + dashboard JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all per-sport pipeline artifacts + dashboard JSON, then unstage any
          # reviews.jsonl (human-owned, must never be committed by CI).
          git add data docs/data || true
          git reset -q -- ':(glob)data/**/reviews.jsonl' 'data/reviews.jsonl' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily pipeline refresh [skip ci]"
            # Push with fetch+rebase+retry so a concurrent update to main (a PR merge, an
            # overlapping run, or a Re-run replaying an older commit) doesn't fail the job.
            # -X theirs keeps this run's freshly generated data on any artifact conflict.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::push failed after 5 attempts"
                exit 1
              fi
              echo "::warning::push rejected (attempt $attempt); rebasing onto origin/main and retrying"
              git fetch origin main
              git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            done
          fi

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    # Share the Pages concurrency group with deploy-pages.yml so the two never deploy
    # to the github-pages environment at the same time.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      # GitHub Pages deploys occasionally return a transient "Deployment failed, try
      # again later". Attempt 1 is allowed to fail; if it does, wait and retry once.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (retry)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
